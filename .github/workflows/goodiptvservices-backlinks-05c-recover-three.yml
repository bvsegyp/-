                filled=False;tas=p.locator('textarea:visible')
                if await tas.count():
                  best=None;area=-1
                  for j in range(await tas.count()):
                    e=tas.nth(j)
                    try:
                      bb=await e.bounding_box();a=bb['width']*bb['height'] if bb else 0
                      if a>area:best=e;area=a
                    except:pass
                  if best:
                    try:await best.fill(H[2]);filled=True
                    except:pass
                if not filled:
                  ce=p.locator('[contenteditable=true]:visible')
                  if await ce.count():
                    try:await ce.first.fill(H[2]);filled=True
                    except:pass
                for pat in ['Publish','Create','Share','Generate']:
                  btn=p.get_by_role('button',name=re.compile(pat,re.I))
                  if await btn.count():
                    try:await btn.first.click(timeout=7000);print('PASTE_CLICK',pat);break
                    except:pass
                await p.wait_for_timeout(5500);cand=[]
                if p.url.rstrip('/')!='https://paste.page':cand.append(p.url)
                try:cand += await p.locator('a[href]').evaluate_all('els=>els.map(e=>e.href)')
                except:pass
                try:cand += await p.locator('input').evaluate_all('els=>els.map(e=>e.value).filter(v=>v && v.startsWith("http"))')
                except:pass
                try:cand += re.findall(r'https?://[^\s<>"\']+',await p.locator('body').inner_text())
                except:pass
                for t in network:cand += re.findall(r'https?://[^\s<>"\\]+',t)
                print('PASTE_CAND',cand[:40]);seen=set()
                for u in cand:
