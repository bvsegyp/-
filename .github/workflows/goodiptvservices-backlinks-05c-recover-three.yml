                  if any(x in u for x in ['/login','/signup','/privacy','/terms','/templates','/about','/html-to-website','/html-viewer','/free-html-hosting']):continue
                  v=await verify_browser(b,'Paste.page',u)
                  if v:out.append(('Paste.page',v));break
                await p.close()
              except Exception as e:print('PASTE_ERR',repr(e))
              await b.close()
            print('GOODIPTV5C_RESULTS_BEGIN')
            for n,u in out:print(n+'\t'+u)
            print('GOODIPTV5C_RESULTS_END')
            print('GOODIPTV5C_VALID_COUNT='+str(len(out)))
            print('GOODIPTV5C_RESULTS_JSON='+json.dumps(out,ensure_ascii=False))
          asyncio.run(main())
          PY