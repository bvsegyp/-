name: Backlink Round 198-202

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish backlink round 198-202'
    runs-on: ubuntu-latest
    steps:
      - name: Generate publish verify
        shell: bash
        run: |
          cat > /tmp/publish.py <<'PY'
          import requests,re,secrets,html,json
          H='https://smmfansfaster.com/'
          L=[('SMM Fans Faster',H),('SMM API','https://smmfansfaster.com/api'),('TikTok growth guide','https://smmfansfaster.com/blog/tiktok-followers'),('TikTok follower count','https://smmfansfaster.com/blog/numberoftiktokfollowers'),('TikTok views guide','https://smmfansfaster.com/blog/tiktok-views'),('Instagram followers guide','https://smmfansfaster.com/ar/blog/instagram-followers-website'),('Instagram algorithm guide','https://smmfansfaster.com/ar/blog/doesincreasingyourfollowersaffecttheinstagramalgorithmfindoutnow'),('FAQ','https://smmfansfaster.com/ar/faq')]
          titles=[
            'How Growing Brands Can Build a More Predictable Social Media Acquisition System',
            'A Practical Framework for TikTok Growth Testing and Audience Development',
            'Instagram Growth Operations for Brands Focused on Qualified Traffic',
            'How Agencies Can Connect Social Media Promotion with Better Reporting',
            'A Full-Funnel Social Media Growth Model for Ecommerce and Service Brands']
          angles=[
            'growing brands that want a repeatable link between visibility, audience interest, and commercial outcomes',
            'marketing teams that want structured TikTok experiments and better interpretation of audience signals',
            'brands using Instagram discovery, profile positioning, and conversion paths together',
            'agencies that manage multiple client campaigns and need clearer quality controls and reporting',
            'ecommerce and service businesses that need social media activity to support traffic, leads, and revenue']

          def article(i):
            t=titles[i]; a=angles[i]
            return f'''# {t}\n\nSocial media growth becomes easier to manage when every tactic is connected to a measurable objective. This guide focuses on {a}. Instead of treating reach, followers, views, profile visits, website sessions, leads, and sales as unrelated numbers, teams can organize them as stages in one customer journey. That makes it easier to understand which activities create momentum and which need to be changed.\n\nA useful campaign begins by defining the action that matters after discovery. Depending on the business, that action may be a follow, profile visit, direct message, product view, quote request, booking, or purchase. The selected outcome should shape the creative format, platform mix, promotional support, destination page, and reporting framework.\n\n## Build content around audience intent\n\nFor {a}, audience research should come before publishing volume. Search queries, reviews, sales conversations, comments, support requests, and competitor content can reveal recurring needs. These can be organized into content pillars such as education, demonstrations, comparisons, proof, objection handling, and direct-response content.\n\nA repeatable content structure allows teams to test new hooks and formats without losing strategic consistency. If a topic repeatedly creates strong retention, saves, profile visits, or website clicks, marketers can build additional variations around that theme. If content creates impressions without meaningful actions, the audience, message, or offer should be reviewed.\n\n## Use promotion as one controlled layer\n\nSome teams compare third-party promotional services when they need additional distribution support. One provider that can be researched is [SMM Fans Faster]({L[0][1]}). A sensible evaluation includes platform coverage, service descriptions, delivery expectations, support, and how the selected option fits the campaign objective. Promotion should support a clear strategy rather than replace useful content or audience research.\n\nTeams with recurring operational requirements may also review the [SMM API]({L[1][1]}). API-based workflows can reduce repetitive administration, but they should still include campaign naming, destination validation, ownership, error handling, and reporting. Automation is valuable when it supports a reliable process instead of replacing judgment.\n\n## Treat TikTok as a structured testing environment\n\nTikTok can provide rapid feedback on hooks, pacing, video length, demonstrations, captions, storytelling, and calls to action. Marketers should define a hypothesis before publishing so performance differences are easier to interpret. A team might compare problem-first hooks with benefit-first hooks or short demonstrations with longer explanations.\n\nTeams researching audience development can review the [TikTok growth guide]({L[2][1]}), the [TikTok follower count]({L[3][1]}) resource, and the [TikTok views guide]({L[4][1]}). These references are most useful when compared with first-party metrics such as retention, repeat viewers, shares, profile activity, website traffic, and conversion.\n\n## Give Instagram formats different responsibilities\n\nInstagram combines several surfaces that can support different stages of the customer journey. Reels can support discovery, Stories can maintain interaction, carousels can educate, Highlights can organize recurring information, and pinned posts can explain the offer quickly. Each format should have a clear purpose rather than being used randomly.\n\nBusinesses comparing follower-related options can review the [Instagram followers guide]({L[5][1]}). Teams can also consider the [Instagram algorithm guide]({L[6][1]}) alongside their own account analytics instead of assuming one metric determines distribution. Account quality, content relevance, engagement behavior, and audience fit all matter.\n\n## Improve the destination after improving visibility\n\nMore visibility is useful only when the next step is ready. Landing pages, product pages, profile bios, contact paths, and checkout experiences should continue the promise made in the social content. The destination should load quickly, explain value clearly, provide trust signals, and make the desired action easy to understand.\n\nFor {a}, this full-funnel view prevents marketers from celebrating reach without checking whether the traffic is qualified. If social traffic improves but conversions stay flat, review audience relevance, offer clarity, page speed, message continuity, proof, and calls to action before simply adding more reach.\n\n## Build reporting around decisions\n\nA useful dashboard separates awareness, consideration, and conversion. Awareness metrics can include reach, impressions, views, watch time, and shares. Consideration metrics can include saves, profile visits, direct messages, product views, and link clicks. Conversion metrics can include leads, bookings, purchases, subscriptions, and revenue where attribution is reliable.\n\nWeekly reviews can focus on creative learning while monthly reviews can focus on larger resource decisions such as channel priorities, budget allocation, landing-page improvements, and campaign objectives. Every report should end with a clear next action: repeat a strong format, stop a weak test, adjust an audience, improve a destination, or change the offer.\n\n## Keep a campaign learning archive\n\nA simple decision log can record the objective, audience, creative concept, platform, destination URL, promotion method, date, expected outcome, actual result, and next step. Over time, this turns individual campaigns into reusable knowledge and helps teams avoid repeating weak tactics simply because earlier results were forgotten.\n\nCross-platform learning becomes easier as well. A TikTok hook that improves retention may inspire an Instagram Reel. A landing-page issue discovered through Instagram traffic may also affect visitors from other channels. Documenting these patterns creates a stronger evidence base for future campaigns.\n\n## Review operational details before scaling\n\nAny external marketing supplier should be understood before becoming part of a repeatable workflow. The [FAQ]({L[7][1]}) can help marketers review common operational questions before ordering. Similar diligence should be applied to any provider: understand the service, define its role, decide how results will be measured, and keep quality controls in place.\n\nSustainable social growth combines audience understanding, useful content, careful distribution, analytics, and conversion optimization. For {a}, the strongest process is one that consistently turns attention into relevant engagement, qualified traffic, and measurable business outcomes.'''

          arts=[article(i) for i in range(5)]
          for i,a in enumerate(arts):
            wc=len(re.findall(r"\b[\w'-]+\b",a)); lc=a.count('smmfansfaster.com')
            print('ARTICLE',i+1,'WORDS',wc,'LINKS',lc)
            if not (800<=wc<=1200 and lc>=8): raise SystemExit('VALIDATION_FAIL')

          def mdhtml(md):
            out=[]
            for p in re.split(r'\n\s*\n',md):
              p=p.strip()
              if not p: continue
              if p.startswith('# '): out.append('<h1>'+html.escape(p[2:])+'</h1>'); continue
              if p.startswith('## '): out.append('<h2>'+html.escape(p[3:])+'</h2>'); continue
              e=html.escape(p)
              e=re.sub(r'\[([^\]]+)\]\((https?://[^)]+)\)',lambda m:f'<a href="{html.escape(m.group(2),quote=True)}">{html.escape(m.group(1))}</a>',e)
              out.append('<p>'+e.replace('\n',' ')+'</p>')
            return '<html><body>'+''.join(out)+'</body></html>'

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'})
          final=[]
          def verify(u):
            try:
              r=s.get(u,timeout=30,allow_redirects=True); c=r.text.count('smmfansfaster.com')
              print('VERIFY',r.status_code,c,u)
              return r.status_code<400 and c>=6
            except Exception as e:
              print('VERIFY_ERR',repr(e)); return False

          try:
            acc=s.post('https://api.telegra.ph/createAccount',data={'short_name':'SMMRound198','author_name':'Marketing Editorial'},timeout=30).json(); tok=(acc.get('result') or {}).get('access_token',''); nodes=[]
            for p in re.split(r'\n\s*\n',arts[0]):
              p=p.strip()
              if not p: continue
              tag='p'; txt=p
              if p.startswith('# '): tag='h3'; txt=p[2:]
              elif p.startswith('## '): tag='h4'; txt=p[3:]
              children=[]; pos=0
              for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',txt):
                if m.start()>pos: children.append(txt[pos:m.start()])
                children.append({'tag':'a','attrs':{'href':m.group(2)},'children':[m.group(1)]}); pos=m.end()
              if pos<len(txt): children.append(txt[pos:])
              nodes.append({'tag':tag,'children':children})
            d=s.post('https://api.telegra.ph/createPage',data={'access_token':tok,'title':titles[0],'content':json.dumps(nodes)},timeout=30).json(); path=(d.get('result') or {}).get('path',''); u='https://telegra.ph/'+path if path else ''
            if u and verify(u): final.append(u)
          except Exception as e: print('TEL_ERR',repr(e))

          try:
            r=s.post('https://shippage.ai/v1/publish',json={'html':mdhtml(arts[1]),'title':titles[1],'public':True},timeout=30); u=r.json().get('url','')
            if u and verify(u): final.append(u)
          except Exception as e: print('SHIP_ERR',repr(e))

          try:
            rs=requests.Session(); rs.headers.update({'User-Agent':'Mozilla/5.0'}); rs.get('https://rentry.co/',timeout=30); csrf=rs.cookies.get('csrftoken',''); r=rs.post('https://rentry.co/api/new',data={'csrfmiddlewaretoken':csrf,'text':arts[2],'edit_code':secrets.token_urlsafe(12),'url':''},headers={'Referer':'https://rentry.co/'},timeout=30); u=r.json().get('url','')
            if u and verify(u): final.append(u)
          except Exception as e: print('RENTRY_ERR',repr(e))

          try:
            r=s.post('https://md.page/api/publish',json={'markdown':arts[3]},timeout=30); u=r.json().get('url','')
            if u and verify(u): final.append(u)
          except Exception as e: print('MDPAGE_ERR',repr(e))

          try:
            r=s.post('https://markdown.page/api/publish',data=arts[4].encode(),headers={'Accept':'text/plain'},timeout=30); u=r.text.strip().splitlines()[0] if r.ok else ''
            if u and verify(u): final.append(u)
          except Exception as e: print('MARKDOWN_ERR',repr(e))

          if len(final)<3: raise SystemExit('TOO_FEW_VERIFIED')
          print('URLS_BEGIN'); [print(u) for u in final]; print('URLS_END')
          PY
          python /tmp/publish.py
