            except Exception as e: print('ERR',repr(e)); return False
          try:
            acc=s.post('https://api.telegra.ph/createAccount',data={'short_name':'SMM315','author_name':'Marketing Editorial'},timeout=30).json(); tok=(acc.get('result') or {}).get('access_token',''); nodes=[]
            for p in re.split(r'\n\s*\n',arts[0]):
