name: Publish Sharable 2012
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run Sharable 2012'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: python3 scripts/publish_sharable_2012.py | tee publish.log
      - name: Show URL
        run: grep '^RESULT_URL=https://' publish.log || true
