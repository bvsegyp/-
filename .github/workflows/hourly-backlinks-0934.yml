name: Publish Verified Backlink Batch 0934
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish verified backlink batch 0934'
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified long articles
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://raw.githubusercontent.com/bvsegyp/-/main/.github/workflows/publish-10-long-backlinks-now.yml' -o /tmp/base.yml
          python - <<'PY'
          import re,textwrap,requests,json,secrets
          y=open('/tmp/base.yml',encoding='utf-8').read()
          m=re.search(r"cat > /tmp/publish\.py <<'PY'\n(.*?)\n\s*PY\n\s*python /tmp/publish\.py",y,re.S)
          if not m: raise SystemExit('BASE_SCRIPT_NOT_FOUND')
          code=textwrap.dedent(m.group(1)); gen=code.split('results=[]',1)[0]
          repl={
          'A Complete Social Media Growth Framework for Agencies and Brands':'Social Media Growth Strategy for 2026: Content Systems, Distribution, and Measurable Demand',
          'How to Build a Sustainable TikTok Growth System in 2026':'TikTok Growth Planning: Creative Research, Retention Signals, and Audience Development',
          'Instagram Growth Strategy: From Reach to Real Conversions':'Instagram Audience Growth: Reels Discovery, Trust Signals, and Conversion Paths',
          'How to Evaluate an SMM Panel Without Losing Sight of Strategy':'Social Media Service Evaluation: Quality Controls, Risk Management, and Campaign Fit',
          'A Practical Social Media Analytics and Promotion Playbook':'Social Media Measurement Systems: From Reach Metrics to Revenue Attribution',
          'Multi-Platform Campaign Operations for Modern Marketing Teams':'Multi-Platform Social Campaign Operations for Agencies and In-House Teams',
          'Combining Organic Content, Paid Media, and SMM Support':'Organic, Paid, and External Social Distribution: Building a Balanced Growth Mix',
          'How to Build a Social Media Funnel That Converts Attention':'Social Media Funnel Design: Turning Discovery into Qualified Traffic and Leads',
          'A Content Testing Framework for Faster Social Media Learning':'Creative Experimentation Systems for Faster Social Media Learning',
          'Agency Automation and the Role of an SMM API in Campaign Workflows':'SMM API Automation for Agencies: Controls, Reporting, and Scalable Operations'}
          for a,b in repl.items(): gen=gen.replace(a,b)
          ns={}; exec(gen,ns)
          arts=ns['articles']; titles=ns['titles']; md_to_html=ns['md_to_html']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'})
          results=[]
          def verify(url):
            try:
              r=s.get(url,timeout=35,allow_redirects=True); c=r.text.count('smmfansfaster.com')
              print('VERIFY',url,r.status_code,c); return r.status_code<400 and c>=6
            except Exception as e: print('VERIFY_ERR',repr(e)); return False
          def accept(domain,url):
            if url and verify(url): results.append([domain,url]); print('ACCEPTED_URL='+url)
          for i,a in enumerate(arts):
            wc=len(re.findall(r"\b[\w’'-]+\b",a)); lc=a.count('https://smmfansfaster.com'); print('ARTICLE',i+1,wc,lc)
            if wc<1200 or lc<6: raise SystemExit('ARTICLE_INVALID')
          # output.pub
          try:
            d=s.post('https://output.pub/api/publish',json={'content':arts[0],'format':'markdown'},timeout=35).json(); accept('output.pub',d.get('url',''))
          except Exception as e: print('OUTPUT_ERR',repr(e))
          # write.as
          try:
            d=s.post('https://write.as/api/posts',json={'body':arts[1],'title':titles[1],'font':'serif','lang':'en','rtl':False},timeout=35).json(); pid=(d.get('data') or {}).get('id',''); accept('write.as','https://write.as/'+pid if pid else '')
          except Exception as e: print('WRITE_ERR',repr(e))
          # telegraph
          try:
            acc=s.post('https://api.telegra.ph/createAccount',data={'short_name':'SMMEditorial','author_name':'Digital Marketing Editorial','author_url':'https://smmfansfaster.com/'},timeout=35).json(); tok=(acc.get('result') or {}).get('access_token',''); nodes=[]
            for para in re.split(r'\n\s*\n',arts[2]):
              para=para.strip()
              if not para: continue
              tag='p'; txt=para
              if para.startswith('# '): tag='h3'; txt=para[2:]
              elif para.startswith('## '): tag='h4'; txt=para[3:]
              ch=[]; pos=0
              for mm in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',txt):
                if mm.start()>pos: ch.append(txt[pos:mm.start()])
                ch.append({'tag':'a','attrs':{'href':mm.group(2)},'children':[mm.group(1)]}); pos=mm.end()
              if pos<len(txt): ch.append(txt[pos:])
              nodes.append({'tag':tag,'children':ch or [txt]})
            d=s.post('https://api.telegra.ph/createPage',data={'access_token':tok,'title':titles[2],'author_name':'Digital Marketing Editorial','author_url':'https://smmfansfaster.com/','content':json.dumps(nodes),'return_content':'true'},timeout=35).json(); accept('telegra.ph',(d.get('result') or {}).get('url',''))
          except Exception as e: print('TELE_ERR',repr(e))
          # shippage
          try:
            d=s.post('https://shippage.ai/v1/publish',json={'html':md_to_html(arts[3]),'title':titles[3],'public':True},timeout=35).json(); accept('shippage.ai',d.get('url',''))
          except Exception as e: print('SHIP_ERR',repr(e))
          # markdown.page
          try:
            r=s.post('https://markdown.page/api/publish',data=arts[4].encode(),timeout=35)
            try: d=r.json(); u=d.get('url','')
            except Exception: u=r.text.strip().strip('"')
            accept('markdown.page',u)
          except Exception as e: print('MP_ERR',repr(e))
          # rentry
          try:
            s.get('https://rentry.co/',timeout=35); csrf=s.cookies.get('csrftoken',''); d=s.post('https://rentry.co/api/new',data={'csrfmiddlewaretoken':csrf,'text':arts[5],'edit_code':secrets.token_urlsafe(12),'url':''},headers={'Referer':'https://rentry.co/'},timeout=35).json(); accept('rentry.co',d.get('url',''))
          except Exception as e: print('RENT_ERR',repr(e))
          # paste.rs
          try:
            r=s.post('https://paste.rs/',data=arts[6].encode(),headers={'Content-Type':'text/markdown'},timeout=35); u=r.text.strip(); u=u+'.md' if u.startswith('http') and not u.endswith('.md') else u; accept('paste.rs',u)
          except Exception as e: print('PASTE_ERR',repr(e))
          # mdless
          try:
            r=s.post('https://mdless.net/api/link',data=arts[7].encode(),timeout=35)
            try: d=r.json(); u=d.get('url','')
            except Exception: u=r.text.strip().strip('"')
            accept('mdless.net',u)
          except Exception as e: print('MDLESS_ERR',repr(e))
          # html-docs
          try:
            d=s.post('https://www.html-docs.com/api/v1/docs',data=arts[8].encode(),headers={'Content-Type':'text/markdown'},timeout=35).json(); accept('html-docs.com',d.get('url',''))
          except Exception as e: print('HD_ERR',repr(e))
          # md.page
          try:
            d=s.post('https://md.page/api/publish',json={'markdown':arts[9]},timeout=35).json(); accept('md.page',d.get('url',''))
          except Exception as e: print('MDP_ERR',repr(e))
          print('VALID_RESULTS_JSON='+json.dumps(results)); print('VALID_COUNT='+str(len(results)))
          PY