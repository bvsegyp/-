name: Publish Unique Domain Backlinks 0957

on:
  push:
    branches: [main]

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify unique-domain rendered links 1029'
    runs-on: ubuntu-latest
    steps:
      - name: Verify rendered backlink count
        shell: bash
        run: |
          set -e
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/v.py <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          targets=[
            ('markdshare.com','https://markdshare.com/1zafhizd'),
            ('pastes.io','https://pastes.io/rXpwWe0d'),
          ]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              out=[]
              for d,u in targets:
                pg=await b.new_page()
                try:
                  await pg.goto(u,wait_until='networkidle',timeout=45000)
                  await pg.wait_for_timeout(3000)
                  hrefs=await pg.locator('a[href*="smmfansfaster.com"]').count()
                  body=await pg.locator('body').inner_text()
                  print(d,'URL',pg.url,'HREFS',hrefs,'TEXTCOUNT',body.count('smmfansfaster.com'))
                  if hrefs==1: out.append([d,pg.url])
                except Exception as e: print(d,'ERR',repr(e))
                await pg.close()
              await b.close()
              print('VALID_RESULTS_JSON='+json.dumps(out))
              print('VALID_COUNT='+str(len(out)))
          asyncio.run(main())
          PY
          python /tmp/v.py
