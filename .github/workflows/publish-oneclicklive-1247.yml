name: Publish OneClickLive 1247
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run OneClickLive publish 1247'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/publish_oneclicklive_1247.py | tee publish.log
      - run: grep '^RESULT_URL=https://' publish.log || true
