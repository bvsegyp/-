name: Publish NAREX anonymous backlinks batch 6

on:
  push:
    branches:
      - narex-publish-batch6-20260812

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Browser publish anonymous pages
        shell: bash
        run: |
          python3 -m pip -q install selenium requests
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.chrome.options import Options
          import requests,time,re,csv,html,pathlib,os,json

          HOME='https://narexx.com/'
          PRODUCT='https://narexx.com/ar/easy-wash/p754364761'
          WHY='https://narexx.com/en/%D9%84%D9%85%D8%A7%D8%B0%D8%A7-%D8%AA%D8%B3%D8%AA%D8%AE%D8%AF%D9%85-%D8%A7%D9%84%D9%85%D9%86%D8%AA%D8%AC/page-833898435'
          WHOLESALE='https://narexx.com/en/%D8%B7%D9%84%D8%A8%D8%A7%D8%AA-%D8%A7%D9%84%D8%AC%D9%85%D9%84%D9%87/page-768158116'
          COMPLAINTS='https://narexx.com/%D9%84%D9%84%D8%B4%D9%83%D8%A7%D9%88%D9%89-%D9%88-%D8%A7%D9%84%D8%A7%D9%82%D8%AA%D8%B1%D8%A7%D8%AD%D8%A7%D8%AA/page-50408011'
          RETURNS='https://narexx.com/ar/%D8%B3%D9%8A%D8%A7%D8%B3%D8%A9-%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%A8%D8%AF%D8%A7%D9%84-%D9%88%D8%A7%D9%84%D8%A5%D8%B3%D8%AA%D8%B1%D8%AC%D8%A7%D8%B9/page-1592231750'
          EN='https://narexx.com/en/'
          refs=[('Easy Wash من NAREX',PRODUCT),('متجر NAREX',HOME),('لماذا تستخدم المنتج',WHY),('صفحة Easy Wash الرسمية',PRODUCT),('NAREX السعودية',HOME),('سياسة الاستبدال والاسترجاع',RETURNS),('الشكاوى والاقتراحات',COMPLAINTS),('طلبات الجملة',WHOLESALE),('NAREX English',EN),('منتج منع انتقال الألوان',PRODUCT),('الموقع الرسمي NAREX',HOME),('Easy Wash للملابس الملونة',PRODUCT),('حلول NAREX للغسيل',HOME),('خدمة عملاء NAREX',COMPLAINTS),('متجر NAREX للعناية بالملابس',HOME),('Easy Wash الرسمي',PRODUCT)]
          paras=[
            'انتقال الصبغات بين قطع الملابس قد يحدث أثناء دورة الغسيل، خاصة عند التعامل مع ملابس جديدة أو درجات داكنة قوية. لذلك تبدأ العناية الجيدة بفهم نوع القماش وقراءة تعليمات الغسيل واختيار درجة الحرارة المناسبة قبل تشغيل الغسالة.',
            'الفرز الذكي يقلل احتمالية اختلاط الألوان، لكن ليس من الضروري دائمًا تشغيل دورة مستقلة لكل درجة لونية. يمكن الجمع بين الملابس المتقاربة عندما تسمح تعليمات العناية بذلك، والاستفادة من حل مساعد مصمم لالتقاط جزء من الصبغات المتسربة داخل الماء.',
            'مناديل التقاط الألوان توضع داخل حلة الغسالة مع الملابس وتعمل خلال الدورة على التقاط الصبغات الزائدة. بعد انتهاء الغسيل يتم التخلص من المنديل. الكمية المناسبة تعتمد على حجم الحمولة وطبيعة الألوان، لذلك يجب الرجوع إلى تعليمات المنتج الحالية.',
            'Easy Wash من NAREX يقدم هذا النوع من الحلول للعناية بالملابس الملونة. المنتج موجه لمن يريد إضافة خطوة بسيطة إلى روتين الغسيل تساعد على تقليل انتقال اللون، مع الاستمرار في التعامل بحذر مع القطع الجديدة جدًا أو المعروفة بأنها تطلق صبغة قوية.',
            'هناك ممارسات أخرى تساعد على الحفاظ على مظهر الملابس، مثل عدم تحميل الغسالة فوق طاقتها، واختيار برنامج مناسب، وعدم استخدام حرارة أعلى من المطلوب، وقلب بعض القطع من الداخل إلى الخارج لتقليل الاحتكاك المباشر على السطح الخارجي.',
            'الملابس الداكنة الجديدة قد تحتاج إلى غسل منفصل في المرة الأولى إذا كان هناك شك في ثبات الصبغة. بعد معرفة سلوك القماش يمكن إدخاله في روتين أكثر مرونة، مع مراعاة الفصل بين الأبيض شديد الحساسية والألوان التي يحتمل أن تنزف بصورة واضحة.',
            'للمستخدم في السعودية، من المفيد مراجعة معلومات المنتج وسياسات المتجر وقنوات التواصل قبل الشراء. الاطلاع على الاستبدال والاسترجاع وخدمة العملاء وطلبات الجملة يعطي صورة أوضح عن رحلة الشراء وطريقة التواصل عند وجود استفسار.',
            'أفضل نتيجة تأتي من روتين متكامل يجمع بين الفرز المنطقي واختيار البرنامج المناسب وكمية المنظف الصحيحة والتعامل السليم مع الملابس بعد انتهاء الدورة، إلى جانب استخدام حل لالتقاط الصبغات عند الحاجة. بهذه الخطوات يصبح غسل الملابس الملونة أكثر تنظيمًا.'
          ]
          topics=[
            'مناديل التقاط ألوان الملابس في السعودية',
            'حل انتقال اللون بين الملابس أثناء الغسيل',
            'حماية الملابس البيضاء من الصبغات المتسربة',
            'طريقة منع اختلاط الألوان في الغسالة',
            'مناديل امتصاص الصبغات للملابس الملونة',
            'العناية بألوان الملابس مع Easy Wash',
            'منتج للمساعدة على منع نزيف ألوان الملابس',
            'روتين غسيل آمن للملابس متعددة الألوان'
          ]
          def html_article(title):
            out=[f'<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(title)}</title><style>body{{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 24px;line-height:2;color:#222}}a{{color:#075cca}}h1,h2{{line-height:1.5}}</style></head><body><article><h1>{html.escape(title)}</h1>']
            for i,p in enumerate(paras):
              a,b=refs[(2*i)%len(refs)],refs[(2*i+1)%len(refs)]
              out.append(f'<h2>{["فهم المشكلة","الفرز الذكي","التقاط الصبغات","Easy Wash","نصائح عملية","الملابس الجديدة","التسوق في السعودية","الخلاصة"][i]}</h2><p>{html.escape(p)} للمزيد راجع <a href="{a[1]}">{html.escape(a[0])}</a> و<a href="{b[1]}">{html.escape(b[0])}</a>.</p>')
            out.append(f'<p>مصادر إضافية: <a href="{PRODUCT}">Easy Wash</a> و<a href="{HOME}">NAREX السعودية</a>.</p></article></body></html>')
            return ''.join(out)
          def md_article(title):
            out=[f'# {title}']
            for i,p in enumerate(paras):
              a,b=refs[(2*i)%len(refs)],refs[(2*i+1)%len(refs)]
              out += [f'## {["فهم المشكلة","الفرز الذكي","التقاط الصبغات","Easy Wash","نصائح عملية","الملابس الجديدة","التسوق في السعودية","الخلاصة"][i]}',p+f' للمزيد راجع [{a[0]}]({a[1]}) و[{b[0]}]({b[1]}).']
            out += [f'مصادر إضافية: [Easy Wash]({PRODUCT}) و[NAREX السعودية]({HOME}).']
            return '\n\n'.join(out)
          def verify(u):
            if not u or not u.startswith('http'): return False
            try:
              r=requests.get(u,timeout=25,allow_redirects=True,headers={'User-Agent':'Mozilla/5.0'})
              return r.status_code<400 and 'narexx.com' in r.text.lower()
            except:return False
          work=pathlib.Path('/tmp/narex6');work.mkdir(exist_ok=True)
          def makefile(title):
            p=work/('narex-'+str(abs(hash(title)))+'.html');p.write_text(html_article(title),encoding='utf-8');return str(p)
          opt=Options();opt.add_argument('--headless=new');opt.add_argument('--no-sandbox');opt.add_argument('--disable-dev-shm-usage');opt.add_argument('--window-size=1600,1200');opt.add_argument('--lang=en-US')
          driver=webdriver.Chrome(options=opt)
          cases=[
            ('paste.page','https://paste.page/free-html-hosting','html','publish'),
            ('showyourcode.app','https://www.showyourcode.app/playground','html','share'),
            ('dochost.io','https://dochost.io/publish-html-website-free','html','get my link'),
            ('htmlput.com','https://www.htmlput.com/?lang=en','html','host'),
            ('markdshare.com','https://markdshare.com/','md','share'),
            ('jotbird.com','https://www.jotbird.com/','md','publish'),
            ('yapp.page','https://yapp.page/host-html-file','file','publish'),
            ('supadrop.host','https://supadrop.host/','file','publish')
          ]
          def fill_native(el,value):
            tag=el.tag_name.lower()
            try:
              if tag in ('textarea','input'):
                driver.execute_script("var el=arguments[0],v=arguments[1];var p=Object.getPrototypeOf(el);var d=Object.getOwnPropertyDescriptor(p,'value');if(d&&d.set)d.set.call(el,v);else el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));",el,value)
              else:
                driver.execute_script("arguments[0].focus();arguments[0].innerText=arguments[1];arguments[0].dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:arguments[1]}));",el,value)
              return True
            except:return False
          def fill_editor(value):
            # CodeMirror 5
            try:
              ok=driver.execute_script("var xs=document.querySelectorAll('.CodeMirror');for(var i=0;i<xs.length;i++){if(xs[i].CodeMirror){xs[i].CodeMirror.setValue(arguments[0]);return true}}return false",value)
              if ok:return 'CodeMirror5'
            except:pass
            # Monaco
            try:
              ok=driver.execute_script("if(window.monaco&&monaco.editor){var ms=monaco.editor.getModels();if(ms&&ms.length){ms[0].setValue(arguments[0]);return true}}return false",value)
              if ok:return 'Monaco'
            except:pass
            # CodeMirror 6 / contenteditable
            els=[]
            for sel in ['textarea','.cm-content[contenteditable="true"]','[contenteditable="true"]']:
              try:els += [e for e in driver.find_elements(By.CSS_SELECTOR,sel) if e.is_displayed()]
              except:pass
            if els:
              els=sorted(els,key=lambda e:e.size.get('width',0)*e.size.get('height',0),reverse=True)
              for e in els:
                if fill_native(e,value):return e.tag_name
            return ''
          def all_candidates(start):
            cand=[]
            if driver.current_url and driver.current_url.rstrip('/')!=start.rstrip('/'):cand.append(driver.current_url)
            for a in driver.find_elements(By.CSS_SELECTOR,'a[href]'):
              try:
                u=a.get_attribute('href') or ''
                if u.startswith('http'):cand.append(u)
              except:pass
            for e in driver.find_elements(By.CSS_SELECTOR,'input,textarea'):
              try:
                v=e.get_attribute('value') or ''
                if v.startswith('http'):cand.append(v)
              except:pass
            src=driver.page_source
            cand += re.findall(r'https?://[^\s"<>]+',src)
            out=[]
            for u in cand:
              u=u.replace('&amp;','&').rstrip('.,;)\"\'')
              if u not in out and u.rstrip('/')!=start.rstrip('/'):out.append(u)
            return out
          rows=[]
          for idx,(site,url,mode,button_key) in enumerate(cases):
            title=topics[idx];content=md_article(title) if mode=='md' else html_article(title);count=content.count('https://narexx.com');result=[site,'',title,count,'FAILED']
            try:
              driver.delete_all_cookies();driver.get(url);time.sleep(5);start=driver.current_url
              # navigate app CTA if editor/upload absent
              if site=='jotbird.com':
                for a in driver.find_elements(By.CSS_SELECTOR,'a,button'):
                  if 'open app' in (a.text or '').lower():
                    try:driver.execute_script('arguments[0].click();',a);time.sleep(4);start=driver.current_url
                    except:pass
                    break
              # dochost Paste Code first and re-query afterwards
              if site=='dochost.io':
                for b in driver.find_elements(By.CSS_SELECTOR,'button'):
                  if 'paste code' in (b.text or '').lower():
                    driver.execute_script('arguments[0].click();',b);time.sleep(2);break
              # For file-friendly sites, prefer actual file input; for htmlput also try upload fallback
              used=''
              inputs=[e for e in driver.find_elements(By.CSS_SELECTOR,'input[type="file"]')]
              if mode=='file' or (site=='htmlput.com' and inputs):
                if not inputs:
                  for b in driver.find_elements(By.CSS_SELECTOR,'button,a'):
                    if any(k in (b.text or '').lower() for k in ['upload','drop file','choose file','browse']):
                      try:driver.execute_script('arguments[0].click();',b);time.sleep(1)
                      except:pass
                  inputs=driver.find_elements(By.CSS_SELECTOR,'input[type="file"]')
                if inputs:
                  inputs[0].send_keys(makefile(title));used='file';time.sleep(3)
              if not used:
                used=fill_editor(content)
              if not used:raise Exception('editor/file input not found')
              # fill slug/title fields when obvious
              for inp in driver.find_elements(By.CSS_SELECTOR,'input[type="text"],input:not([type])')[:15]:
                try:
                  meta=' '.join([inp.get_attribute('placeholder') or '',inp.get_attribute('name') or '',inp.get_attribute('aria-label') or '']).lower()
                  if any(k in meta for k in ['title','document title']):fill_native(inp,title)
                  elif any(k in meta for k in ['slug','your-page','url','address']) and 'http' not in (inp.get_attribute('value') or ''):fill_native(inp,'narex-'+str(int(time.time()))[-8:])
                except:pass
              # dochost choose Public when available
              if site=='dochost.io':
                for e in driver.find_elements(By.XPATH,"//*[contains(translate(normalize-space(.),'PUBLIC','public'),'public')]"):
                  try:
                    if e.is_displayed() and e.tag_name.lower() in ['label','button','div']:
                      driver.execute_script('arguments[0].click();',e);time.sleep(1);break
                  except:pass
              # click intended publish/share control
              keys=[button_key,'publish','share','host now','get my link','deploy','get link','give it a url','create link']
              btn=None
              for b in driver.find_elements(By.CSS_SELECTOR,'button,input[type="submit"],a[role="button"]'):
                try:
                  txt=' '.join([b.text or '',b.get_attribute('value') or '',b.get_attribute('aria-label') or '']).lower().strip()
                  if any(k in txt for k in keys) and b.is_displayed() and b.is_enabled():btn=b;break
                except:pass
              if not btn:raise Exception('publish button not found; used='+used)
              driver.execute_script('arguments[0].scrollIntoView({block:"center"});',btn);time.sleep(.5);driver.execute_script('arguments[0].click();',btn);time.sleep(12)
              cand=all_candidates(start)
              pub=''
              for u in cand:
                if verify(u):pub=u;break
              result=[site,pub,title,count,'published' if pub else 'FAILED no verified URL; current='+driver.current_url]
            except Exception as e:
              result=[site,'',title,count,'FAILED '+repr(e)]
            rows.append(result);print('RESULT|'+'|'.join(map(str,result)),flush=True)
          driver.quit()
          with open('narex-batch6.csv','w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f);w.writerow(['platform','published_url','title','narex_links','status']);w.writerows(rows)
          print('SUCCESS_COUNT='+str(len([r for r in rows if r[1] and r[-1]=='published'])))
          PY
      - name: Upload batch 6 results
        uses: actions/upload-artifact@v4
        with:
          name: narex-batch6-results
          path: narex-batch6.csv
