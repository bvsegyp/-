name: Verify Dochost Backlink 1653
on:
  push:
    branches: [main]
jobs:
  verify:
    if: github.event.head_commit.message == 'Verify dochost backlink 1653'
    runs-on: ubuntu-latest
    steps:
      - name: Verify rendered anchor
        shell: bash
        run: |
          set -e
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/v.py <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              pg=await b.new_page()
              await pg.goto('https://dochost.co/d/zv4uggnh?v=c',wait_until='networkidle',timeout=45000)
              await pg.wait_for_timeout(3000)
              hrefs=await pg.locator('a[href*="smmfansfaster.com"]').count()
              body=await pg.locator('body').inner_text()
              print('URL',pg.url,'HREFS',hrefs,'BODY_MENTION',body.lower().count('smm fans faster'))
              if hrefs==1:
                print('VALID_RESULTS_JSON='+json.dumps([['dochost.co',pg.url]])); print('VALID_COUNT=1')
              else:
                print('VALID_RESULTS_JSON=[]'); print('VALID_COUNT=0')
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/v.py
