name: Publish United Batch3 Fresh Hosts

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish United batch3 fresh hosts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests markdown
      - name: Publish and verify fresh backlink hosts
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json
          from urllib.parse import urlparse
          import markdown

          files=[
            'united-batch2-20260815/01-event-branding.md',
            'united-batch2-20260815/03-stage-av-production.md',
            'united-batch2-20260815/04-conference-attendee-journey.md',
            'united-batch2-20260815/05-national-day-events.md'
          ]
          titles=[
            'بناء هوية بصرية متكاملة للفعاليات في السعودية',
            'إدارة المنصة والصوت والإضاءة في الفعاليات باحتراف',
            'تصميم رحلة حضور احترافية للمؤتمرات والملتقيات',
            'تخطيط فعاليات اليوم الوطني السعودي للشركات باحتراف'
          ]
          articles=[open(f,encoding='utf-8').read() for f in files]

          def make_html(md,title):
            body=markdown.markdown(md,extensions=['extra','sane_lists'])
            return f'''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title}</title><meta name="description" content="دليل عملي للفعاليات والمعارض والطباعة والتجهيزات في السعودية"><style>body{{font-family:Arial,Tahoma,sans-serif;max-width:920px;margin:40px auto;padding:0 22px;line-height:2;color:#222}}h1,h2{{line-height:1.5}}a{{color:#5b21b6;text-decoration:underline}}p{{margin:0 0 18px}}</style></head><body>{body}</body></html>'''
          htmls=[make_html(articles[i],titles[i]) for i in range(4)]
          for i,(m,h) in enumerate(zip(articles,htmls),1):
            hrefs=len(re.findall(r'href=["\'][^"\']*unitedevent\.net',h,re.I))
            print(f'ARTICLE_{i}_WORDS={len(m.split())} LINKS={m.count("unitedevent.net")} HREFS={hrefs}')
            if len(m.split())<650 or hrefs<8: raise SystemExit('ARTICLE_INVALID')

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 UnitedEventsEditorial/4.0'})
          used_providers={'output.pub','yeet.md','markdown.page','rentry.co','draftmark.app','telegra.ph','ht-ml.app','pitchey.app','sshgrid.com'}
          results=[]

          def provider(host):
            host=host.lower().removeprefix('www.')
            for p in used_providers:
              if host==p or host.endswith('.'+p): return p
            parts=host.split('.')
            return '.'.join(parts[-2:]) if len(parts)>=2 else host

          def urls_from(x):
            out=[]
            def walk(v):
              if isinstance(v,str): out.extend(re.findall(r'https?://[^\s"\'<>]+',v))
              elif isinstance(v,dict):
                for z in v.values(): walk(z)
              elif isinstance(v,list):
                for z in v: walk(z)
            walk(x)
            return [u.rstrip('.,);}') for u in out]

          def choose(x,domains=()):
            us=urls_from(x)
            for d in domains:
              for u in us:
                if d in u:return u
            return us[0] if us else ''

          def verify(name,u):
            if not u: print(name+'_NO_URL'); return False
            try:
              r=s.get(u,timeout=35,allow_redirects=True)
              host=urlparse(r.url).netloc.lower().removeprefix('www.')
              prov=provider(host)
              hrefs=len(re.findall(r'href=["\'][^"\']*https?://(?:www\.)?unitedevent\.net',r.text,re.I))
              noindex=('noindex' in r.headers.get('x-robots-tag','').lower()) or bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',r.text,re.I))
              print(f'VERIFY_{name} URL={r.url} STATUS={r.status_code} HOST={host} PROVIDER={prov} HREFS={hrefs} DOMAINS={r.text.count("unitedevent.net")} NOINDEX={int(noindex)}')
              if r.status_code<400 and hrefs>=6 and not noindex and prov not in used_providers:
                used_providers.add(prov); results.append({'platform':name,'url':r.url,'provider':prov,'hrefs':hrefs}); print(f'VALID_{name}={r.url}'); return True
            except Exception as e: print(f'VERIFY_{name}_ERR={type(e).__name__}:{e}')
            return False

          # AirED
          try:
            r=s.post('https://aired.sh/api/publish',json={'html':htmls[0]},timeout=45)
            print('AIRED_POST',r.status_code,r.text[:800].replace('\n',' '))
            try:d=r.json()
            except:d=r.text
            verify('AIRED',choose(d,('aired.sh',)))
          except Exception as e: print('AIRED_ERR',type(e).__name__,e)

          # HTMLDrop
          try:
            r=s.post('https://htmldrop.link/publish',json={'html':htmls[1],'title':titles[1]},timeout=45)
            print('HTMLDROP_POST',r.status_code,r.text[:800].replace('\n',' '))
            try:d=r.json()
            except:d=r.text
            verify('HTMLDROP',choose(d,('htmldrop.link',)))
          except Exception as e: print('HTMLDROP_ERR',type(e).__name__,e)

          # Snapy
          try:
            r=s.post('https://api.snapy.host/api/publish',json={'content':htmls[2],'filename':'index.html','name':'united-events-guide'},timeout=45)
            print('SNAPY_POST',r.status_code,r.text[:900].replace('\n',' '))
            try:d=r.json()
            except:d=r.text
            verify('SNAPY',choose(d,('snapy.page','snapy.host')))
          except Exception as e: print('SNAPY_ERR',type(e).__name__,e)

          # md.page
          try:
            r=s.post('https://md.page/api/publish',json={'markdown':articles[3]},timeout=45)
            print('MDPAGE_POST',r.status_code,r.text[:900].replace('\n',' '))
            try:d=r.json()
            except:d=r.text
            verify('MDPAGE',choose(d,('md.page',)))
          except Exception as e: print('MDPAGE_ERR',type(e).__name__,e)

          print('FINAL_RESULTS_JSON='+json.dumps(results,ensure_ascii=False))
          print('FINAL_COUNT='+str(len(results)))
          PY
