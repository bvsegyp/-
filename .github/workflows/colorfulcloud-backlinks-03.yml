name: Colorful Cloud Backlinks 03
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run Colorful Cloud backlink batch 03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run publisher
        run: python scripts/colorfulcloud_backlinks_03.py
