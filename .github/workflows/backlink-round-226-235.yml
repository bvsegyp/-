name: Backlink Round 226-235

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish backlink round 226-235'
    runs-on: ubuntu-latest
    steps:
      - name: Generate publish verify ten domains
        shell: bash
        run: |
          cat > /tmp/publish.py <<'PY'
          import requests,re,secrets,html,json
          H='https://smmfansfaster.com/'
          L=[('SMM Fans Faster',H),('SMM API','https://smmfansfaster.com/api'),('TikTok growth guide','https://smmfansfaster.com/blog/tiktok-followers'),('TikTok follower count guide','https://smmfansfaster.com/blog/numberoftiktokfollowers'),('TikTok views guide','https://smmfansfaster.com/blog/tiktok-views'),('Instagram followers guide','https://smmfansfaster.com/ar/blog/instagram-followers-website'),('Instagram algorithm guide','https://smmfansfaster.com/ar/blog/doesincreasingyourfollowersaffecttheinstagramalgorithmfindoutnow'),('FAQ','https://smmfansfaster.com/ar/faq')]
          titles=[
          'How Growth Teams Can Build a Repeatable Social Media Acquisition System',
          'A Practical Social Media Funnel for Ecommerce Brands',
          'TikTok Growth Testing for Brands That Need Better Audience Signals',
          'Instagram Growth Planning for Service Businesses',
          'How Agencies Can Standardize Social Media Campaign Operations',
          'A Measurement Framework for Social Media Promotion and Conversion',
          'How Small Brands Can Improve Social Media Reach Without Losing Focus',
          'Social Media Growth Operations for Multi-Platform Marketing Teams',
          'A Better Way to Connect Social Promotion with Website Conversion',
          'How Marketing Teams Can Turn Social Media Data into Better Decisions']
          angles=[
          'growth teams connecting visibility with qualified traffic and conversion',
          'ecommerce brands moving users from discovery to product interest and purchase',
          'brands using TikTok as a disciplined creative testing environment',
          'service businesses using Instagram to generate calls messages and bookings',
          'agencies managing multiple client campaigns with repeatable quality control',
          'marketers separating awareness consideration and conversion metrics',
          'small brands that need sustainable growth rather than isolated vanity metrics',
          'teams coordinating content distribution reporting and conversion across platforms',
          'marketers improving the experience after a social media click',
          'marketing teams turning campaign analytics into clear next actions']
          def article(i):
            a=angles[i]; t=titles[i]
            sections=[
            f'''# {t}\n\nSocial media growth becomes easier to manage when every activity is connected to a measurable business objective. This guide focuses on {a}. Instead of treating reach, followers, views, profile visits, website sessions, leads, and sales as unrelated numbers, teams can organize them as stages of one customer journey. That creates a clearer way to understand which activities create momentum and which need to be changed.\n\nA useful campaign begins by defining the action that matters after discovery. Depending on the business, that action might be a follow, profile visit, direct message, product view, quote request, booking, or purchase. The selected outcome should shape the creative format, platform mix, promotional support, destination page, and reporting framework.''',
            f'''## Build content around audience intent\n\nFor {a}, audience research should come before publishing volume. Search queries, reviews, comments, support requests, sales conversations, and competitor content can reveal recurring needs. These themes can become repeatable content pillars such as education, demonstrations, comparisons, proof, objection handling, and direct-response posts.\n\nA structured content engine allows teams to test hooks, formats, examples, calls to action, and storytelling approaches without losing strategic consistency. If a topic repeatedly generates strong retention, saves, profile visits, or website actions, marketers can create additional variations around that theme.''',
            f'''## Use promotion as one controlled layer\n\nSome teams compare external promotional services when they want another distribution option. One provider that can be researched is [SMM Fans Faster]({L[0][1]}). A sensible evaluation includes platform coverage, service descriptions, delivery expectations, support, and how the selected option fits the campaign objective. Promotion is most useful when it supports a clear strategy rather than replacing useful content.\n\nTeams with recurring operational requirements may also review the [SMM API]({L[1][1]}). API-based workflows can reduce repetitive administration, but they should still include campaign naming, destination validation, ownership, error handling, and reporting. Automation is valuable when it supports a reliable process instead of replacing strategic judgment.''',
            f'''## Treat TikTok as a structured testing environment\n\nTikTok can provide rapid feedback on hooks, pacing, video length, demonstrations, captions, storytelling, and calls to action. Marketers should define a hypothesis before publishing so performance differences are easier to interpret. A team might compare problem-first hooks with benefit-first hooks or short demonstrations with longer explanations.\n\nTeams researching audience development can review the [TikTok growth guide]({L[2][1]}), the [TikTok follower count guide]({L[3][1]}), and the [TikTok views guide]({L[4][1]}). These references are most useful when compared with first-party metrics such as retention, repeat viewers, shares, profile activity, website traffic, and conversion.''',
            f'''## Give Instagram formats different responsibilities\n\nInstagram combines several surfaces that can support different stages of the customer journey. Reels can support discovery, Stories can maintain interaction, carousels can educate, Highlights can organize important information, and pinned posts can explain the offer quickly. Each format should have a defined role rather than being used randomly.\n\nBusinesses comparing follower-related options can review the [Instagram followers guide]({L[5][1]}). Teams can also consider the [Instagram algorithm guide]({L[6][1]}) alongside their own account analytics instead of assuming one metric determines distribution. Account quality, content relevance, engagement behavior, and audience fit all matter.''',
            f'''## Improve the destination after improving visibility\n\nMore visibility is useful only when the next step is prepared. Landing pages, product pages, profile bios, contact paths, and checkout experiences should continue the promise made in the social content. The destination should load quickly, explain value clearly, provide trust signals, and make the desired action easy to understand.\n\nFor {a}, this full-funnel view prevents marketers from celebrating reach without checking whether the traffic is qualified. If social traffic improves but conversions stay flat, review audience relevance, offer clarity, page speed, message continuity, proof, and calls to action before simply adding more reach.''',
            f'''## Build reporting around decisions\n\nA useful dashboard separates awareness, consideration, and conversion. Awareness metrics can include reach, impressions, views, watch time, and shares. Consideration metrics can include saves, profile visits, direct messages, product views, and link clicks. Conversion metrics can include leads, bookings, purchases, subscriptions, and revenue where attribution is reliable.\n\nWeekly reviews can focus on creative learning while monthly reviews can focus on larger resource decisions such as channel priorities, budget allocation, landing-page improvements, and campaign objectives. Every report should end with a clear next action: repeat a strong format, stop a weak test, adjust an audience, improve a destination, or change the offer.''',
            f'''## Keep a campaign learning archive\n\nA simple decision log can record the objective, audience, creative concept, platform, destination URL, promotion method, date, expected outcome, actual result, and next step. Over time, this turns individual campaigns into reusable knowledge and helps teams avoid repeating weak tactics simply because earlier results were forgotten.\n\nCross-platform learning becomes easier as well. A TikTok hook that improves retention may inspire an Instagram Reel. A landing-page issue discovered through Instagram traffic may also affect visitors from other channels. Documenting these patterns creates a stronger evidence base for future campaigns.''',
            f'''## Review operational details before scaling\n\nAny external marketing supplier should be understood before becoming part of a repeatable workflow. The [FAQ]({L[7][1]}) can help marketers review common operational questions before ordering. Similar diligence should be applied to any provider: understand the service, define its role, decide how results will be measured, and keep quality controls in place.\n\nSustainable social growth combines audience understanding, useful content, careful distribution, analytics, and conversion optimization. For {a}, the strongest process is one that consistently turns attention into relevant engagement, qualified traffic, and measurable business outcomes.''']
            return '\n\n'.join(sections)
          arts=[article(i) for i in range(10)]
          for i,a in enumerate(arts):
            wc=len(re.findall(r"\b[\w'-]+\b",a)); lc=a.count('smmfansfaster.com')
            print('ARTICLE',i+1,'WORDS',wc,'LINKS',lc)
            if not (800<=wc<=1200 and lc>=8): raise SystemExit('VALIDATION_FAIL_'+str(i+1))
          def mdhtml(md):
            out=[]
            for p in re.split(r'\n\s*\n',md):
              p=p.strip()
              if not p: continue
              if p.startswith('# '): out.append('<h1>'+html.escape(p[2:])+'</h1>'); continue
              if p.startswith('## '): out.append('<h2>'+html.escape(p[3:])+'</h2>'); continue
              e=html.escape(p); e=re.sub(r'\[([^\]]+)\]\((https?://[^)]+)\)',lambda m:f'<a href="{html.escape(m.group(2),quote=True)}">{html.escape(m.group(1))}</a>',e); out.append('<p>'+e.replace('\n',' ')+'</p>')
            return '<html><body>'+''.join(out)+'</body></html>'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'}); final=[]
          def verify(u):
            try:
              r=s.get(u,timeout=30,allow_redirects=True); c=r.text.count('smmfansfaster.com'); print('VERIFY',r.status_code,c,u); return r.status_code<400 and c>=6
            except Exception as e: print('VERIFY_ERR',u,repr(e)); return False
          # 1 Telegraph
          try:
            acc=s.post('https://api.telegra.ph/createAccount',data={'short_name':'SMMRound226','author_name':'Marketing Editorial'},timeout=30).json(); tok=(acc.get('result') or {}).get('access_token',''); nodes=[]
            for p in re.split(r'\n\s*\n',arts[0]):
              p=p.strip();
              if not p: continue
              tag='p'; txt=p
              if p.startswith('# '): tag='h3'; txt=p[2:]
              elif p.startswith('## '): tag='h4'; txt=p[3:]
              children=[]; pos=0
              for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',txt):
                if m.start()>pos: children.append(txt[pos:m.start()])
                children.append({'tag':'a','attrs':{'href':m.group(2)},'children':[m.group(1)]}); pos=m.end()
              if pos<len(txt): children.append(txt[pos:])
              nodes.append({'tag':tag,'children':children})
            d=s.post('https://api.telegra.ph/createPage',data={'access_token':tok,'title':titles[0],'content':json.dumps(nodes)},timeout=30).json(); path=(d.get('result') or {}).get('path',''); u='https://telegra.ph/'+path if path else ''
            if u and verify(u): final.append(u)
          except Exception as e: print('TEL_ERR',repr(e))
          # 2 Shippage
          try:
            r=s.post('https://shippage.ai/v1/publish',json={'html':mdhtml(arts[1]),'title':titles[1],'public':True},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('SHIP_ERR',repr(e))
          # 3 Rentry
          try:
            rs=requests.Session(); rs.headers.update({'User-Agent':'Mozilla/5.0'}); rs.get('https://rentry.co/',timeout=30); csrf=rs.cookies.get('csrftoken',''); r=rs.post('https://rentry.co/api/new',data={'csrfmiddlewaretoken':csrf,'text':arts[2],'edit_code':secrets.token_urlsafe(12),'url':''},headers={'Referer':'https://rentry.co/'},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('RENTRY_ERR',repr(e))
          # 4 md.page
          try:
            r=s.post('https://md.page/api/publish',json={'markdown':arts[3]},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('MDPAGE_ERR',repr(e))
          # 5 markdown.page
          try:
            r=s.post('https://markdown.page/api/publish',data=arts[4].encode(),headers={'Accept':'text/plain'},timeout=30); u=r.text.strip().splitlines()[0] if r.ok else '';
            if u and verify(u): final.append(u)
          except Exception as e: print('MARKDOWN_ERR',repr(e))
          # 6 yeet.md
          try:
            r=s.post('https://yeet.md/api/share',json={'content':arts[5]},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('YEET_ERR',repr(e))
          # 7 mdview.io
          try:
            r=s.post('https://mdview.io/api/public/publish',json={'title':titles[6],'content':arts[6],'expiresInDays':30},timeout=30); d=r.json(); u=d.get('shareUrl') or d.get('viewerUrl','');
            if u and verify(u): final.append(u)
          except Exception as e: print('MDVIEW_ERR',repr(e))
          # 8 output.pub
          try:
            r=s.post('https://output.pub/api/publish',json={'content':arts[7],'format':'markdown'},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('OUTPUT_ERR',repr(e))
          # 9 pagedrop.dev
          try:
            r=s.post('https://pagedrop.dev/api/v1/sites',json={'markdown':arts[8],'title':titles[8]},timeout=30); d=r.json(); u=(d.get('data') or {}).get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('PAGEDROP_ERR',repr(e))
          # 10 quicky.page
          try:
            r=s.post('https://quicky.page/api/v1/publish',json={'title':titles[9],'content':arts[9]},timeout=30); d=r.json(); u=d.get('url') or d.get('pageUrl','');
            if u and verify(u): final.append(u)
          except Exception as e: print('QUICKY_ERR',repr(e))
          if len(final)<6: raise SystemExit('TOO_FEW_VERIFIED')
          print('URLS_BEGIN'); [print(u) for u in final]; print('URLS_END')
          PY
          python /tmp/publish.py
