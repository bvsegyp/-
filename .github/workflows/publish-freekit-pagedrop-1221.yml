name: Publish FreeKit and PageDrop 1221
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run FreeKit PageDrop 1221 v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish two unique backlinks
        run: python3 scripts/publish_freekit_pagedrop_1221.py | tee publish.log
      - name: Show result URLs
        run: grep '^RESULT_URL=https://' publish.log || true
