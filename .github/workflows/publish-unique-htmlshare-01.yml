name: Publish Unique htmlshare Backlink
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique htmlshare backlink batch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          bash scripts/publish_unique_htmlshare_01.sh | tee backlink-run.log
      - name: Extract URL
        if: always()
        shell: bash
        run: |
          grep '^RESULT_URL=https://' backlink-run.log | sed 's/^RESULT_URL=//' > backlink_urls.txt || true
          echo "URL_COUNT=$(wc -l < backlink_urls.txt)"
