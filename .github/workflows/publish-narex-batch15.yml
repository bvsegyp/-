name: Publish NAREX anonymous backlinks batch 15
on:
  push:
    branches: [narex-publish-batch15-20260812]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish browser anonymous pages
        shell: bash
        run: |
          python3 -m pip -q install playwright
          python3 -m playwright install chromium --with-deps >/dev/null 2>&1
          python3 - <<'PY'
          import asyncio,re,json,html,csv
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          HOME='https://narexx.com/'
          PRODUCT='https://narexx.com/ar/easy-wash/p754364761'
          LINKS=[('Easy Wash',PRODUCT),('NAREX السعودية',HOME)]*10
          TOPICS=['مناديل منع انتقال الألوان للغسيل في السعودية','طريقة حماية الملابس الملونة أثناء الغسيل','حل نزيف ألوان الملابس الجديدة','مناديل التقاط الصبغات داخل الغسالة','حماية الملابس البيضاء من اختلاط الألوان','أفضل روتين للعناية بألوان الملابس','طريقة تقليل انتقال اللون بين الملابس','Easy Wash لحماية الملابس الملونة']
          TARGETS=[
            ('pastemd.io','https://pastemd.io/'),('jotbird.com','https://www.jotbird.com/'),('mininotepad.com','https://www.mininotepad.com/'),('onlinenotepad.live','https://www.onlinenotepad.live/'),('notepadr.com','https://notepadr.com/'),('sharetext.io','https://sharetext.io/'),('textshare.online','https://textshare.online/'),('tempnotepad.com','https://tempnotepad.com/')]
          BASE=[
            'انتقال الألوان بين الملابس قد يحدث عندما تطلق بعض الأقمشة صبغات داخل الماء، خصوصًا مع القطع الجديدة أو الداكنة. تبدأ الحماية الجيدة بقراءة تعليمات العناية واختيار درجة حرارة مناسبة ومعرفة القطع التي تحتاج إلى غسل منفصل في أول مرة.',
            'الفرز الذكي لا يعني تشغيل دورة مستقلة لكل لون. يمكن جمع الملابس المتقاربة عندما تكون تعليمات العناية متوافقة، مع فصل الأبيض شديد الحساسية والقطع التي يثبت أنها تنزف اللون بقوة. هذا الأسلوب يوفر الوقت ويجعل الغسيل أكثر تنظيمًا.',
            'مناديل التقاط الألوان تعمل داخل ماء الغسيل للمساعدة على جذب جزء من الصبغات المتسربة. توضع الورقة داخل حلة الغسالة مع الملابس وتتحرك خلال الدورة ثم يتم التخلص منها بعد الانتهاء وفق تعليمات الاستخدام.',
            'Easy Wash من NAREX يقدم هذا المفهوم كحل مساعد ضمن روتين العناية بالملابس الملونة. الهدف ليس إلغاء الفرز، بل إضافة وسيلة تساعد على تقليل انتقال الصبغات عندما يكون غسل مجموعة من الملابس المتقاربة مناسبًا.',
            'اختيار البرنامج المناسب ودرجة الحرارة وحجم الحمولة له تأثير مباشر في نتيجة الغسيل. من الأفضل عدم تحميل الحلة فوق طاقتها، وترك مساحة لحركة الماء والمنظف، وعدم استخدام حرارة أعلى من اللازم للأقمشة الملونة.',
            'الملابس الداكنة الجديدة قد تحتاج إلى معاملة أكثر حذرًا في أولى مرات الغسيل. إذا كان هناك شك في ثبات اللون يمكن غسل القطعة منفردة أول مرة، ثم إدخالها في روتين أكثر مرونة بعد معرفة سلوك القماش.',
            'العناية بالملابس لا تنتهي عند توقف الغسالة. يفضل إخراج القطع بعد انتهاء الدورة وعدم تركها مبللة فترة طويلة، ثم تجفيفها بالطريقة المناسبة لنوع القماش ومعالجة البقع بسرعة لتقليل الحاجة إلى غسيل قاسٍ متكرر.',
            'بالنسبة للمستخدم في السعودية، من المفيد مراجعة صفحة المنتج والمتجر قبل الشراء للتأكد من طريقة الاستخدام الحالية والتوفر. وجود معلومات واضحة يساعد على اختيار المنتج المناسب ووضعه ضمن روتين غسيل منظم.',
            'تقليل عدد دورات الغسيل لا يعني خلط كل الألوان دون تمييز. الفكرة هي معرفة القطع الحساسة وفصلها، ثم التعامل مع بقية الملابس المتقاربة بمرونة أكبر واستخدام حل مساعد لالتقاط الصبغات عند الحاجة.',
            'أفضل حماية للألوان تأتي من روتين متكامل يجمع بين الفرز المنطقي، البرنامج المناسب، درجة الحرارة الملائمة، كمية المنظف الصحيحة، والعناية بالقطع الجديدة، مع استخدام مناديل التقاط الصبغات عندما يناسب ذلك طبيعة الحمولة.'
          ]
          def article(title):
            out=['# '+title]
            for i,p in enumerate(BASE):
              a,b=LINKS[2*i],LINKS[2*i+1]
              out += [f'## إرشاد {i+1}',p+f' للمزيد راجع [{a[0]}]({a[1]}) و[{b[0]}]({b[1]}).']
            return '\n\n'.join(out)
          def host(u):
            try:return (urlparse(u).hostname or '').lower().lstrip('www.')
            except:return ''
          async def verify(browser,u,domain):
            if not u or not u.startswith('http'):return None
            h=host(u)
            if h=='narexx.com' or h.endswith('.narexx.com') or not (h==domain or h.endswith('.'+domain)):return None
            p=await browser.new_page()
            try:
              await p.goto(u,wait_until='domcontentloaded',timeout=35000);await p.wait_for_timeout(2200)
              hrefs=await p.locator('a[href*="narexx.com"]').count();src=(await p.content()).lower();final=p.url
              return final if max(hrefs,src.count('narexx.com'))>=7 else None
            except:return None
            finally:await p.close()
          async def publish(browser,domain,url,title):
            p=await browser.new_page();art=article(title);count=art.count('https://narexx.com')
            try:
              await p.goto(url,wait_until='domcontentloaded',timeout=45000);await p.wait_for_timeout(2200);initial=p.url
              for pat in ['Publish Markdown','Start writing','Start Writing','Start a New Pad','New Note','Create a post','Create Post','Start writing now','New']:
                el=p.get_by_text(re.compile(pat,re.I))
                if await el.count():
                  try:await el.first.click(timeout=2500);await p.wait_for_timeout(700);break
                  except:pass
              for i in range(await p.locator('input:visible').count()):
                e=p.locator('input:visible').nth(i);meta=' '.join([(await e.get_attribute('placeholder') or ''),(await e.get_attribute('name') or '')]).lower()
                if 'title' in meta:
                  try:await e.fill(title)
                  except:pass
              ed=p.locator('textarea:visible,[contenteditable=true]:visible')
              if not await ed.count():return [domain,'',title,count,'FAILED no editor']
              best=ed.first;area=-1
              for i in range(await ed.count()):
                e=ed.nth(i);box=await e.bounding_box();a=box['width']*box['height'] if box else 0
                if a>area:best=e;area=a
              try:await best.fill(art)
              except:
                await best.click();await p.keyboard.insert_text(art)
              clicked=False
              for pat in ['Publish','Share','Create Share','Create','Save','Generate Share Link','Copy Share Link','Create New Paste','Go','Generate']:
                b=p.get_by_role('button',name=re.compile(pat,re.I))
                if await b.count():
                  try:await b.first.click(timeout=4500);clicked=True;break
                  except:pass
              if not clicked:
                for pat in ['Publish','Share','Create','Save','Generate']:
                  e=p.get_by_text(re.compile('^'+pat+'$',re.I))
                  if await e.count():
                    try:await e.first.click(timeout=3500);clicked=True;break
                    except:pass
              if not clicked:return [domain,'',title,count,'FAILED no button']
              await p.wait_for_timeout(6500);cands=[]
              if p.url!=initial:cands.append(p.url)
              for a in await p.locator('a[href^="http"]').all():
                try:
                  x=await a.get_attribute('href')
                  if x and x not in cands:cands.append(x)
                except:pass
              try:
                txt=await p.locator('body').inner_text();cands+=re.findall(r'https?://[^\s)\]<>"\']+',txt)
              except:pass
              for c in cands[:20]:
                f=await verify(browser,c.rstrip('.,'),domain)
                if f:return [domain,f,title,count,'published']
              return [domain,'',title,count,'FAILED no verified URL']
            except Exception as e:return [domain,'',title,count,'FAILED '+repr(e)]
            finally:await p.close()
          async def main():
            rows=[]
            async with async_playwright() as pw:
              b=await pw.chromium.launch(headless=True)
              for (d,u),t in zip(TARGETS,TOPICS):
                r=await publish(b,d,u,t);rows.append(r);print('RESULT|'+'|'.join(map(str,r)),flush=True)
              await b.close()
            with open('narex-batch15.csv','w',newline='',encoding='utf-8-sig') as f:csv.writer(f).writerows([['platform','published_url','title','narex_links','status']]+rows)
            print('SUCCESS_COUNT='+str(len([r for r in rows if r[1]])))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: narex-batch15-results
          path: narex-batch15.csv
