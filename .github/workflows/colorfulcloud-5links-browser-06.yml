name: Colorful Cloud Browser Five-Link Publishers 06

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run Colorful Cloud browser five-link publishers'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependencies
        run: |
          pip install requests playwright
          python -m playwright install chromium --with-deps
      - name: Publish and browser-verify five-link articles
        run: python scripts/colorfulcloud_5links_browser_06.py
