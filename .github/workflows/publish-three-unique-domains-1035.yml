name: Publish Three Unique Domains 1035
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish three unique domains 1035'
    runs-on: ubuntu-latest
    steps:
      - name: Publish and verify one backlink per domain
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          specs=[
            ('Social Media Reporting and Content Planning for Growth Teams','https://smmfansfaster.com/','social media marketing platform'),
            ('Instagram Content Systems for Sustainable Audience Growth','https://smmfansfaster.com/ar/blog/instagram-followers-website','Instagram growth resource'),
            ('TikTok Creative Testing and Audience Development Playbook','https://smmfansfaster.com/blog/tiktok-followers','TikTok growth guide')
          ]
          sections=[
            ('Start with a measurable objective','A social media strategy becomes easier to evaluate when the team defines the desired business outcome before choosing tactics. Awareness, qualified traffic, leads, bookings, purchases, and retention require different creative approaches and different metrics. A clear objective prevents teams from using follower count as a universal measure of success.'),
            ('Research the audience carefully','Audience research should identify recurring questions, common objections, content preferences, platform habits, and the language people use when describing their needs. Useful evidence can come from customer support conversations, sales calls, search behavior, reviews, comments, and direct messages. These signals make content planning more grounded in real demand.'),
            ('Build repeatable content pillars','A reliable publishing system usually includes several repeatable pillars such as education, demonstrations, comparisons, frequently asked questions, case studies, behind-the-scenes material, and industry commentary. Each pillar should serve a specific stage of the customer journey. This creates structure without forcing every post to be identical.'),
            ('Connect promotion to strategy','Organic publishing, paid media, partnerships, and carefully evaluated external tools can all support the same campaign. The important question is whether each activity serves a defined objective, fits the platform rules, and can be measured. Promotion should strengthen a useful content system rather than replace it.'),
            ('Measure signals that matter','Awareness campaigns can track reach, impressions, video views, completion rates, and shares. Consideration campaigns can focus on saves, profile visits, direct messages, and website clicks. Conversion campaigns can track leads, bookings, purchases, and revenue. A concise dashboard is usually more useful than a large report with metrics nobody acts on.'),
            ('Test creative ideas systematically','Creative experiments are easier to interpret when one major variable changes at a time. Teams can compare hooks, visual formats, captions, audiences, offers, and calls to action. Each test should record its purpose and outcome so campaign activity creates reusable learning rather than isolated results.'),
            ('Improve the destination experience','More visibility has limited value when the profile or landing page is confusing. Profiles should quickly explain who the account serves, what it offers, and what action visitors should take next. Landing pages should load quickly, continue the promise made in the social post, provide relevant proof, and reduce unnecessary friction.'),
            ('Protect account quality','Short-term growth should not come at the expense of trust. Teams should avoid deceptive claims, fake endorsements, hacked properties, spam comments, and attempts to bypass platform safeguards. External marketing services should be evaluated like other suppliers, with clear expectations, measurement, and risk controls.'),
            ('Create a useful review rhythm','Weekly reviews are useful for creative decisions because they reveal which topics and formats deserve more testing. Monthly reviews are better for budget allocation and broader channel strategy. Every review should conclude with specific actions so reporting changes what the team does next.'),
            ('Document campaign operations','Clear ownership helps teams maintain consistency. Decide who owns research, writing, design, publishing, moderation, reporting, and optimization. A pre-publish checklist can catch broken links, incorrect tracking parameters, formatting mistakes, and calls to action that do not match the campaign objective.'),
            ('Separate learning from scaling','Promising ideas can be tested with limited resources before budget is increased. Strong organic performance may provide evidence for paid distribution, while small paid tests can validate audience and offer assumptions. This staged process reduces waste and improves confidence in scaling decisions.'),
            ('Maintain an editorial calendar','A useful calendar records more than dates. It can include audience, content pillar, format, objective, call to action, and primary metric. This context makes later analysis more meaningful because every post can be judged according to its intended role.'),
            ('Build a creative archive','Save successful hooks, headline structures, opening frames, visual patterns, and calls to action. A creative archive gives marketers tested building blocks that can be adapted to new topics. The aim is not duplication but a better understanding of which components consistently earn attention.'),
            ('Use feedback as research','Comments, support requests, sales conversations, reviews, and on-site behavior reveal what audiences understand and where friction remains. Repeated questions are useful content opportunities. Repeated abandonment patterns may indicate a landing-page problem rather than a traffic problem.'),
            ('Keep platform metrics in context','A post can perform well on a platform without generating immediate sales and still be valuable if its purpose is awareness. Conversely, a post with modest reach can be valuable when it produces qualified leads. Evaluation should return to the campaign objective rather than one universal benchmark.'),
            ('Treat growth as a portfolio of experiments','Not every test needs to succeed. Controlled failures are useful when the learning is captured. A healthy portfolio combines proven formats with smaller experiments exploring new topics, audiences, offers, and creative approaches. Over time, the goal is to improve the percentage of decisions informed by evidence.'),
            ('Stay flexible as platforms change','Social platforms evolve constantly. Formats, recommendation systems, advertising features, and audience habits change. Durable strategies keep their principles stable while allowing tactics to evolve. Useful content, clear positioning, measurable goals, ethical promotion, and disciplined learning remain valuable.')]
          def article(i):
            title,url,anchor=specs[i]
            out=['# '+title,'Social media growth is easier to manage when audience research, content, analytics, promotion, and conversion are treated as parts of one system. The objective is to build a repeatable process that improves relevance, trust, qualified traffic, and measurable business outcomes.']
            for idx,(h,p) in enumerate(sections):
              out += ['## '+h,p]
              if idx==3:
                out += [f'Teams comparing outside resources can review this [{anchor}]({url}) as one reference while evaluating options. The tool or service should fit the campaign objective and should never replace useful content, audience understanding, or genuine engagement.']
              else:
                out += [p+' In practice, teams should document what they tried, why they tried it, and what changed after the test. This turns day-to-day campaign activity into reusable knowledge and improves future planning.']
            out += ['## Final perspective','Sustainable social media growth is a process of repeated learning. Clear objectives, audience understanding, useful content, structured testing, careful promotion, conversion optimization, and consistent reporting reinforce one another. The strongest systems build visibility that contributes to trust and measurable outcomes.']
            text='\n\n'.join(out)
            wc=len(re.findall(r"\b[\w’'-]+\b",text)); lc=text.count('https://smmfansfaster.com')
            print('ARTICLE',i+1,'WORDS',wc,'LINKS',lc); assert wc>=1200 and lc==1
            return text
          arts=[article(i) for i in range(3)]
          def verify(u):
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=35,allow_redirects=True)
            hrefs=re.findall(r'href=["\'](https://smmfansfaster\.com[^"\']*)["\']',r.text,re.I)
            print('VERIFY',u,'STATUS',r.status_code,'FINAL',r.url,'HREF_COUNT',len(hrefs),'HREFS',hrefs)
            return r.status_code<400 and len(hrefs)==1, r.url
          results=[]
          # txtduck
          try:
            r=s.post('https://www.txtduck.com/api/create',json={'content':arts[0],'title':specs[0][0]},headers={'Content-Type':'application/json','Referer':'https://www.txtduck.com/'},timeout=35)
            print('TXTDUCK_CREATE',r.status_code,r.text[:1000]); d=r.json()
            red=d.get('redirect','')
            u=urljoin('https://www.txtduck.com/',red) if red else ''
            ok,final=verify(u) if u else (False,'')
            if ok: results.append(['txtduck.com',final])
          except Exception as e: print('TXTDUCK_ERR',repr(e))
          # markdownur with natural csrf init
          try:
            sm=requests.Session(); sm.headers.update({'User-Agent':'Mozilla/5.0'})
            sm.get('https://www.markdownur.com/',timeout=30)
            g=sm.get('https://www.markdownur.com/api/create',headers={'Accept':'application/json','Referer':'https://www.markdownur.com/'},timeout=30)
            print('MARKDOWNUR_GET',g.status_code,g.text[:800]); csrf=g.json().get('csrfToken','')
            r=sm.post('https://www.markdownur.com/api/create',json={'markdown':arts[1]},headers={'Content-Type':'application/json','x-csrf-token':csrf,'Referer':'https://www.markdownur.com/'},timeout=35)
            print('MARKDOWNUR_POST',r.status_code,r.text[:1000]); d=r.json(); u=d.get('url','')
            ok,final=verify(u) if u else (False,'')
            if ok: results.append(['markdownur.com',final])
          except Exception as e: print('MARKDOWNUR_ERR',repr(e))
          # mdshare.cc browser endpoint, no API key
          try:
            r=s.post('https://mdshare.cc/api/documents',json={'title':specs[2][0],'content':arts[2]},headers={'Content-Type':'application/json','Referer':'https://mdshare.cc/'},timeout=35)
            print('MDSHARECC_POST',r.status_code,r.text[:1200]); d=r.json(); sid=d.get('shareId','')
            u='https://mdshare.cc/view/'+sid if sid else d.get('url','')
            ok,final=verify(u) if u else (False,'')
            if ok: results.append(['mdshare.cc',final])
          except Exception as e: print('MDSHARECC_ERR',repr(e))
          print('VALID_RESULTS_JSON='+json.dumps(results))
          print('VALID_COUNT='+str(len(results)))
          PY
