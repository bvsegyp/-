name: Publish Different Domains Round 0856

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish different domains round 0856'
    runs-on: ubuntu-latest
    steps:
      - name: Publish long-form articles to different domains
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://raw.githubusercontent.com/bvsegyp/-/main/.github/workflows/publish-10-long-backlinks-now.yml' -o /tmp/base.yml
          python - <<'PY'
          import re, textwrap, requests, json, io

          y=open('/tmp/base.yml',encoding='utf-8').read()
          m=re.search(r"cat > /tmp/publish\.py <<'PY'\n(.*?)\n\s*PY\n\s*python /tmp/publish\.py", y, re.S)
          if not m:
              raise SystemExit('BASE_SCRIPT_NOT_FOUND')
          code=textwrap.dedent(m.group(1))
          gen=code.split('results=[]',1)[0]

          replacements={
            'A Complete Social Media Growth Framework for Agencies and Brands':'Social Media Growth Systems: A Long-Form Guide for Agencies and Modern Brands',
            'How to Build a Sustainable TikTok Growth System in 2026':'TikTok Growth Strategy in 2026: Creative Testing, Retention, and Audience Quality',
            'Instagram Growth Strategy: From Reach to Real Conversions':'Instagram Growth Operations: Reels, Stories, Trust Signals, and Conversion Paths',
            'How to Evaluate an SMM Panel Without Losing Sight of Strategy':'How to Evaluate Social Media Growth Services with Stronger Quality Controls',
            'A Practical Social Media Analytics and Promotion Playbook':'Social Media Analytics and Promotion: A Measurement-First Operating Playbook',
            'Multi-Platform Campaign Operations for Modern Marketing Teams':'Multi-Platform Campaign Management: Systems for Agencies and In-House Teams',
            'Combining Organic Content, Paid Media, and SMM Support':'Balancing Organic Content, Paid Distribution, and External Social Media Support',
            'How to Build a Social Media Funnel That Converts Attention':'Building a Social Media Funnel from Discovery to Qualified Conversion',
            'A Content Testing Framework for Faster Social Media Learning':'Creative Testing Frameworks for Faster Social Media Learning and Better Decisions',
            'Agency Automation and the Role of an SMM API in Campaign Workflows':'Agency Automation with SMM APIs: Governance, Reporting, and Scalable Workflows',
            'agency planning, client reporting, and multi-platform execution':'agency planning, client communication, multi-channel execution, reporting discipline, and operational quality',
            'TikTok content experimentation, retention, reach, and audience development':'TikTok creative experimentation, viewer retention, distribution signals, audience quality, and conversion paths',
            'Instagram positioning, Reels, Stories, profile optimization, and conversion':'Instagram positioning, Reels discovery, Stories engagement, profile trust, and conversion design',
            'provider evaluation, service quality, campaign fit, and risk control':'supplier due diligence, campaign fit, service quality, risk controls, and responsible testing',
            'measurement, reporting, attribution, and data-driven campaign decisions':'measurement architecture, reporting cadence, attribution limits, and evidence-based marketing decisions',
            'process design, scheduling, quality assurance, and team coordination':'campaign operations, editorial calendars, quality assurance, ownership, and team coordination',
            'channel mix, budget decisions, audience trust, and campaign balance':'channel strategy, budget tradeoffs, audience trust, promotional balance, and sustainable growth',
            'awareness, consideration, conversion, landing pages, and measurement':'full-funnel planning, awareness, consideration behavior, landing-page quality, and conversion measurement',
            'creative hypotheses, structured experiments, learning loops, and iteration':'creative research, hypothesis design, structured testing, learning loops, and faster iteration',
            'automation, order management, reporting, governance, and agency scale':'workflow automation, order controls, audit trails, reporting standards, governance, and scalable agency operations'
          }
          for a,b in replacements.items():
              gen=gen.replace(a,b)

          ns={}
          exec(gen,ns)
          arts=ns['articles']
          titles=ns['titles']
          md_to_html=ns['md_to_html']

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'})
          results=[]

          for i,a in enumerate(arts):
              wc=len(re.findall(r"\b[\w’'-]+\b", a))
              lc=a.count('https://smmfansfaster.com')
              print(f'ARTICLE_{i+1}_WORDS={wc}')
              print(f'ARTICLE_{i+1}_TARGET_LINKS={lc}')

          def verify(url):
              try:
                  r=s.get(url,timeout=35,allow_redirects=True)
                  hrefs=len(re.findall(r'href=["\']https://smmfansfaster\.com[^"\']*["\']',r.text,re.I))
                  total=r.text.count('smmfansfaster.com')
                  print('VERIFY',url,'STATUS',r.status_code,'HREFS',hrefs,'TOTAL',total)
                  return r.status_code < 400 and (hrefs >= 6 or total >= 6)
              except Exception as e:
                  print('VERIFY_ERR',url,repr(e))
                  return False

          def accept(domain,url):
              if url and verify(url):
                  results.append([domain,url])
                  print('ACCEPTED_URL='+url)
              else:
                  print('REJECTED_DOMAIN='+domain)

          # 1 PageDrop — permanent by default, no auth
          try:
              d=s.post('https://pagedrop.dev/api/v1/sites',json={'markdown':arts[0],'title':titles[0]},timeout=35).json()
              u=(d.get('data') or {}).get('url','')
              accept('pagedrop.dev',u)
          except Exception as e: print('PAGEDROP_ERR',repr(e))

          # 2 thethings.ai — anonymous public scratch page
          try:
              h=md_to_html(arts[1])
              d=s.post('https://thethings.ai/api/scratch/publish',json={'content':h,'content_type':'text/html','title':titles[1]},timeout=35).json()
              u=d.get('url','')
              accept('thethings.ai',u)
          except Exception as e: print('THETHINGS_ERR',repr(e))

          # 3 emdee.info — 7-day no-auth markdown host
          try:
              d=s.post('https://emdee.info/api/',json={'title':titles[2],'content':arts[2]},timeout=35).json()
              u=d.get('url','')
              accept('emdee.info',u)
          except Exception as e: print('EMDEE_ERR',repr(e))

          # 4 display.dev public artifact
          try:
              files={'file':('social-growth-guide.md',arts[3].encode('utf-8'),'text/markdown')}
              d=s.post('https://api.display.dev/v1/public/artifacts',files=files,data={'name':titles[3]},timeout=35).json()
              u=d.get('previewUrl') or d.get('url','')
              accept('display.dev',u)
          except Exception as e: print('DISPLAY_ERR',repr(e))

          # 5 mdshare.live — create view-only share link; never print admin key
          try:
              d=s.post('https://mdshare.live/api/documents',data=arts[4].encode('utf-8'),headers={'Content-Type':'text/markdown'},timeout=35).json()
              doc=d.get('document_id',''); key=d.get('admin_key',''); u=''
              if doc and key:
                  ld=s.post(f'https://mdshare.live/api/d/{doc}/links?key={key}',json={'permission':'view','label':'public-view'},timeout=35).json()
                  u=ld.get('url') or ld.get('share_url') or ld.get('link','')
              accept('mdshare.live',u)
          except Exception as e: print('MDSHARE_ERR',repr(e))

          # 6 unmarkdown.com
          try:
              d=s.post('https://api.unmarkdown.com/v1/demo/publish',json={'title':titles[5],'content':arts[5],'template_id':'github'},timeout=35).json()
              u=d.get('url','')
              accept('unmarkdown.com',u)
          except Exception as e: print('UNMARKDOWN_ERR',repr(e))

          # 7 leafmill.net
          try:
              d=s.post('https://leafmill.net/api/v1/publish',json={'title':titles[6],'body':arts[6]},timeout=35).json()
              u=d.get('url') or d.get('article_url','')
              accept('leafmill.net',u)
          except Exception as e: print('LEAFMILL_ERR',repr(e))

          # 8 pastebox.ai
          try:
              payload={'content':arts[7],'title':titles[7],'language':'markdown','content_type':'text','expiration':'1M','exposure':'public','source':'api'}
              d=s.post('https://lfdekutkxwsczpasjgsg.supabase.co/functions/v1/create-share',json=payload,timeout=35).json()
              u=d.get('url','')
              accept('pastebox.ai',u)
          except Exception as e: print('PASTEBOX_ERR',repr(e))

          # 9 md2pdf.studio share
          try:
              r=s.post('https://md2pdf.studio/api/save',data=arts[8].encode('utf-8'),headers={'Content-Type':'text/plain'},timeout=35)
              try: d=r.json(); u=d.get('url') or d.get('shareUrl','')
              except Exception: u=''
              accept('md2pdf.studio',u)
          except Exception as e: print('MD2PDF_ERR',repr(e))

          # 10 htmldrop.link
          try:
              h=md_to_html(arts[9])
              d=s.post('https://htmldrop.link/publish',json={'html':h,'title':titles[9]},timeout=35).json()
              u=d.get('url','')
              accept('htmldrop.link',u)
          except Exception as e: print('HTMLDROP_ERR',repr(e))

          # 11 Pastepile fallback — keyless create available on current date; don't print edit key
          try:
              payload={'title':'Social Media Campaign Quality and Sustainable Growth','content':arts[0],'language':'markdown','expiry':'1mo','visibility':'public'}
              d=s.post('https://www.pastepile.com/api/public/pastes',json=payload,timeout=35).json()
              u=d.get('url','')
              accept('pastepile.com',u)
          except Exception as e: print('PASTEPILE_ERR',repr(e))

          print('VALID_RESULTS_JSON='+json.dumps(results))
          print('VALID_COUNT='+str(len(results)))
          PY
