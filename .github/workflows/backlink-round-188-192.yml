name: Backlink Round 188-192

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish backlink round 188-192'
    runs-on: ubuntu-latest
    steps:
      - name: Generate publish verify
        shell: bash
        run: |
          cat > /tmp/publish.py <<'PY'
          import requests,re,secrets,html,json
          H='https://smmfansfaster.com/'
          L=[('SMM Fans Faster',H),('SMM API','https://smmfansfaster.com/api'),('TikTok followers guide','https://smmfansfaster.com/blog/tiktok-followers'),('TikTok follower count','https://smmfansfaster.com/blog/numberoftiktokfollowers'),('Instagram followers guide','https://smmfansfaster.com/ar/blog/instagram-followers-website'),('Instagram algorithm guide','https://smmfansfaster.com/ar/blog/doesincreasingyourfollowersaffecttheinstagramalgorithmfindoutnow'),('FAQ','https://smmfansfaster.com/ar/faq')]
          titles=['Social Media Growth Planning for Ecommerce Brands That Want Better Revenue Attribution','A Practical Instagram and TikTok Growth System for Local Service Companies','How Agencies Can Improve Social Media Campaign Quality and Reporting','Social Media Funnel Optimization from Reach to Qualified Conversion','A Data-Driven Framework for Testing Social Media Growth Tactics']
          angles=['ecommerce teams connecting discovery with product interest and purchases','local service companies that need calls messages and bookings','agencies managing multiple campaigns with consistent standards','marketers improving the path from visibility to conversion','teams that want experiments to produce reusable learning']
          def article(i):
            t=titles[i]; a=angles[i]
            return f'''# {t}\n\nSocial media growth is easier to manage when every activity is connected to a measurable business goal. This guide focuses on {a}. Rather than viewing followers, views, profile visits, website clicks, inquiries, and sales as isolated numbers, marketers can organize them as stages of one customer journey. That creates a clearer way to decide which content deserves more investment and which tactics should be changed.\n\nA useful campaign starts by defining the desired action after discovery. Depending on the business, that action may be a follow, a profile visit, a website session, a message, a quote request, a booking, or a purchase. The chosen outcome should guide the creative, platform mix, promotion method, landing page, and reporting framework.\n\n## Build content around real customer intent\n\nFor {a}, audience research should come before posting volume. Search queries, sales conversations, reviews, comments, support questions, and competitor content can reveal recurring needs. These themes can become repeatable content pillars such as education, demonstrations, comparisons, proof, objection handling, and conversion-focused posts.\n\nA repeatable structure makes content production more efficient without making every post identical. Teams can test new hooks, formats, examples, calls to action, and creative styles while keeping the underlying strategy connected to customer intent.\n\n## Use promotion as one controlled layer\n\nSome teams compare external social media promotion when they need another distribution option. One provider that can be researched is [SMM Fans Faster]({L[0][1]}). A useful evaluation includes platform coverage, service descriptions, delivery expectations, support, and how the selected option fits the campaign objective.\n\nTeams with recurring operational needs may also review the [SMM API]({L[1][1]}). API-based workflows can reduce repetitive work, but they should still include campaign naming, destination validation, ownership, error handling, and reporting. Automation is valuable when it supports a reliable process instead of replacing strategic judgment.\n\n## Treat TikTok as a creative testing environment\n\nTikTok can provide fast feedback on hooks, pacing, video length, demonstrations, captions, and calls to action. Marketers should define a hypothesis before publishing so performance differences are easier to interpret. A team might compare problem-first hooks with benefit-first hooks or shorter demonstrations with longer explanations.\n\nMarketers researching audience development can review the [TikTok followers guide]({L[2][1]}) and the [TikTok follower count]({L[3][1]}) resource. These references are most useful when compared with watch time, retention, repeat viewers, profile visits, website sessions, and conversions.\n\n## Give Instagram formats different jobs\n\nInstagram combines several surfaces that can support different stages of the customer journey. Reels can support discovery, Stories can maintain interaction, carousels can educate, Highlights can organize information, and pinned posts can explain the offer quickly.\n\nBusinesses comparing follower-focused options can review this [Instagram followers guide]({L[4][1]}). Teams can also consider this [Instagram algorithm guide]({L[5][1]}) alongside their own analytics rather than assuming one metric determines distribution.\n\n## Connect social traffic to a useful destination\n\nVisibility creates value only when the next step is prepared. A landing page should continue the promise made in the social post, load quickly, explain the offer clearly, provide trust signals, and make the next action obvious. If traffic improves while conversions stay flat, the problem may be the page, offer, audience, or call to action.\n\nFor {a}, this full-funnel view is essential because it prevents teams from celebrating reach without checking whether the traffic is qualified. Campaign reporting should follow the user journey from discovery to profile activity, website behavior, lead generation, and revenue where attribution is reliable.\n\n## Build reporting around decisions\n\nA useful dashboard separates awareness, consideration, and conversion. Awareness metrics can include reach, impressions, views, watch time, and shares. Consideration metrics can include saves, profile visits, direct messages, product views, and link clicks. Conversion metrics can include leads, bookings, purchases, subscriptions, and revenue.\n\nWeekly reviews can focus on creative learning. Monthly reviews can focus on larger choices such as channel priorities, budget allocation, landing-page improvements, and campaign objectives. Every report should end with a decision about what to repeat, stop, change, or test next.\n\n## Keep a campaign learning archive\n\nA simple decision log can record the objective, audience, creative concept, platform, destination URL, promotion method, date, expected outcome, actual result, and next action. Over time, this turns individual campaigns into a reusable knowledge base.\n\nThe archive also makes cross-platform learning easier. A TikTok hook that improves retention may inspire an Instagram Reel. A landing-page issue discovered through Instagram traffic may affect visitors from other channels as well. Documenting these patterns creates more consistent optimization.\n\n## Review service details before scaling\n\nAny external supplier should be understood before becoming part of a recurring process. The [FAQ]({L[6][1]}) can help teams review common operational questions before ordering. Similar diligence should be applied to any provider: understand the service, define the objective, decide how results will be measured, and keep quality controls in place.\n\nThe strongest social media growth systems combine audience understanding, useful content, careful promotion, measurement, and conversion optimization. For {a}, sustainable progress comes from a repeatable process that turns attention into relevant engagement, qualified traffic, and measurable business outcomes.'''
          arts=[article(i) for i in range(5)]
          for i,a in enumerate(arts):
            wc=len(re.findall(r"\b[\w'-]+\b",a)); lc=a.count('smmfansfaster.com'); print('ARTICLE',i+1,'WORDS',wc,'LINKS',lc)
            if not (800<=wc<=1200 and lc>=7): raise SystemExit('VALIDATION_FAIL')
          def mdhtml(md):
            out=[]
            for p in re.split(r'\n\s*\n',md):
              p=p.strip()
              if not p: continue
              if p.startswith('# '): out.append('<h1>'+html.escape(p[2:])+'</h1>'); continue
              if p.startswith('## '): out.append('<h2>'+html.escape(p[3:])+'</h2>'); continue
              e=html.escape(p); e=re.sub(r'\[([^\]]+)\]\((https?://[^)]+)\)',lambda m:f'<a href="{html.escape(m.group(2),quote=True)}">{html.escape(m.group(1))}</a>',e); out.append('<p>'+e.replace('\n',' ')+'</p>')
            return '<html><body>'+''.join(out)+'</body></html>'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'}); final=[]
          def verify(u):
            try:
              r=s.get(u,timeout=30,allow_redirects=True); c=r.text.count('smmfansfaster.com'); print('VERIFY',r.status_code,c,u); return r.status_code<400 and c>=6
            except Exception as e: print('VERIFY_ERR',repr(e)); return False
          try:
            acc=s.post('https://api.telegra.ph/createAccount',data={'short_name':'SMMRound188','author_name':'Marketing Editorial'},timeout=30).json(); tok=(acc.get('result') or {}).get('access_token',''); nodes=[]
            for p in re.split(r'\n\s*\n',arts[0]):
              p=p.strip();
              if not p: continue
              tag='p'; txt=p
              if p.startswith('# '): tag='h3'; txt=p[2:]
              elif p.startswith('## '): tag='h4'; txt=p[3:]
              children=[]; pos=0
              for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',txt):
                if m.start()>pos: children.append(txt[pos:m.start()])
                children.append({'tag':'a','attrs':{'href':m.group(2)},'children':[m.group(1)]}); pos=m.end()
              if pos<len(txt): children.append(txt[pos:])
              nodes.append({'tag':tag,'children':children})
            d=s.post('https://api.telegra.ph/createPage',data={'access_token':tok,'title':titles[0],'content':json.dumps(nodes)},timeout=30).json(); path=(d.get('result') or {}).get('path',''); u='https://telegra.ph/'+path if path else ''
            if u and verify(u): final.append(u)
          except Exception as e: print('TEL_ERR',repr(e))
          try:
            r=s.post('https://shippage.ai/v1/publish',json={'html':mdhtml(arts[1]),'title':titles[1],'public':True},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('SHIP_ERR',repr(e))
          try:
            rs=requests.Session(); rs.headers.update({'User-Agent':'Mozilla/5.0'}); rs.get('https://rentry.co/',timeout=30); csrf=rs.cookies.get('csrftoken',''); r=rs.post('https://rentry.co/api/new',data={'csrfmiddlewaretoken':csrf,'text':arts[2],'edit_code':secrets.token_urlsafe(12),'url':''},headers={'Referer':'https://rentry.co/'},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('RENTRY_ERR',repr(e))
          try:
            r=s.post('https://md.page/api/publish',json={'markdown':arts[3]},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('MDPAGE_ERR',repr(e))
          try:
            r=s.post('https://output.pub/api/publish',json={'content':arts[4],'format':'markdown'},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('OUTPUT_ERR',repr(e))
          if len(final)<3: raise SystemExit('TOO_FEW_VERIFIED')
          print('URLS_BEGIN'); [print(u) for u in final]; print('URLS_END')
          PY
          python /tmp/publish.py
