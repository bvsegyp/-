name: Publish NAREX anonymous backlinks batch 10
on:
  push:
    branches: [narex-publish-batch10-20260812]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish direct anonymous batch
        shell: bash
        run: |
          python3 -m pip -q install requests playwright
          python3 -m playwright install chromium --with-deps >/dev/null 2>&1
          python3 - <<'PY'
          import requests,re,json,csv,html,asyncio
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          HOME='https://narexx.com/'
          PRODUCT='https://narexx.com/ar/easy-wash/p754364761'
          WHY='https://narexx.com/en/%D9%84%D9%85%D8%A7%D8%B0%D8%A7-%D8%AA%D8%B3%D8%AA%D8%AE%D8%AF%D9%85-%D8%A7%D9%84%D9%85%D9%86%D8%AA%D8%AC/page-833898435'
          WHOLESALE='https://narexx.com/en/%D8%B7%D9%84%D8%A8%D8%A7%D8%AA-%D8%A7%D9%84%D8%AC%D9%85%D9%84%D9%87/page-768158116'
          COMPLAINTS='https://narexx.com/%D9%84%D9%84%D8%B4%D9%83%D8%A7%D9%88%D9%89-%D9%88-%D8%A7%D9%84%D8%A7%D9%82%D8%AA%D8%B1%D8%A7%D8%AD%D8%A7%D8%AA/page-50408011'
          RETURNS='https://narexx.com/ar/%D8%B3%D9%8A%D8%A7%D8%B3%D8%A9-%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%A8%D8%AF%D8%A7%D9%84-%D9%88%D8%A7%D9%84%D8%A5%D8%B3%D8%AA%D8%B1%D8%AC%D8%A7%D8%B9/page-1592231750'
          EN='https://narexx.com/en/'
          REFS=[('Easy Wash من NAREX',PRODUCT),('متجر NAREX',HOME),('لماذا تستخدم المنتج',WHY),('صفحة Easy Wash',PRODUCT),('NAREX السعودية',HOME),('سياسة الاستبدال والاسترجاع',RETURNS),('الشكاوى والاقتراحات',COMPLAINTS),('طلبات الجملة',WHOLESALE),('النسخة الإنجليزية',EN),('مناديل Easy Wash',PRODUCT),('منتجات NAREX',HOME),('حل حماية الألوان',PRODUCT),('NAREX للعناية بالغسيل',HOME),('Easy Wash الرسمي',PRODUCT),('المتجر الرسمي',HOME),('خدمة العملاء',COMPLAINTS),('حلول الغسيل',HOME),('Easy Wash للملابس الملونة',PRODUCT),('NAREX',HOME),('منتج منع انتقال الألوان',PRODUCT)]
          TOPICS=['مناديل منع انتقال ألوان الملابس في السعودية','طريقة منع اختلاط الألوان داخل الغسالة','حل نزيف لون الملابس الجديدة','حماية الملابس الملونة من الصبغات الزائدة','مناديل امتصاص الألوان أثناء الغسيل','أفضل روتين للحفاظ على ألوان الملابس','Easy Wash للعناية بالملابس الملونة','تقليل انتقال اللون بين قطع الغسيل','حلول NAREX لحماية ألوان الملابس']
          PARAS=[
            'انتقال الألوان بين الملابس قد يحدث عندما تطلق بعض الأقمشة جزءًا من صبغتها داخل ماء الغسيل، خاصة في القطع الجديدة أو الداكنة. وقد تستقر هذه الصبغات على قطعة أخرى فتغير مظهرها. لذلك يبدأ الروتين الجيد من فهم نوع القماش وقراءة تعليمات العناية واختيار درجة حرارة مناسبة بدل استخدام إعداد واحد لكل الحمولات.',
            'الفرز الذكي لا يعني تشغيل دورة مستقلة لكل درجة لونية. يمكن جمع الملابس المتقاربة عندما تكون تعليمات العناية متوافقة، مع فصل الأبيض شديد الحساسية والقطع الجديدة التي يشتبه في نزيف لونها. هذا الأسلوب يقلل عدد الدورات غير الضرورية ويحافظ في الوقت نفسه على مستوى جيد من الحذر والتنظيم.',
            'مناديل التقاط الصبغات مصممة للعمل داخل ماء الغسيل للمساعدة على جذب جزء من الألوان الزائدة. توضع الورقة داخل الحلة مع الملابس وتتحرك أثناء الدورة ثم يتم التخلص منها بعد الانتهاء. عدد المناديل المناسب يعتمد على حجم الحمولة وقوة الألوان، لذلك يفضل الرجوع إلى تعليمات المنتج الحالية.',
            'Easy Wash من NAREX يقدم هذا النوع من الحلول كخطوة مساعدة داخل روتين العناية بالملابس. الهدف ليس إلغاء الفرز أو تجاهل القطع الحساسة، بل تقليل فرصة انتقال الصبغات عندما يكون غسل مجموعة من الملابس المتقاربة مناسبًا. ويمكن أن يفيد الأسر التي تشغل الغسالة بصورة متكررة وتريد روتينًا أكثر عملية.',
            'اختيار البرنامج المناسب له أثر كبير في المحافظة على الملابس. الحرارة العالية ليست مطلوبة لكل الأقمشة، وتحميل الغسالة فوق طاقتها يقلل حركة الماء والمنظف. من الأفضل ترك مساحة داخل الحلة واستخدام كمية منظف معتدلة وبرنامج يناسب نوع القماش ودرجة الاتساخ للحصول على تنظيف متوازن دون إجهاد غير ضروري للألوان.',
            'الملابس الداكنة الجديدة تستحق اهتمامًا إضافيًا في المرات الأولى. إذا كان هناك شك في ثبات الصبغة يمكن غسل القطعة منفردة أول مرة أو اختبارها قبل إدخالها مع حمولة أخرى. وبعد معرفة سلوك القماش يصبح التعامل معها أكثر مرونة، كما يمكن قلب بعض القطع من الداخل للخارج لتقليل الاحتكاك المباشر بسطحها الخارجي.',
            'تنظيم روتين الغسيل يوفر الوقت عندما يتم تحديد القطع التي تحتاج فعلًا إلى فصل بدل تقسيم كل حمولة بصورة مبالغ فيها. بعد معرفة الملابس الحساسة يمكن التعامل مع بقية القطع بمرونة أكبر، مع إضافة منتج مساعد لالتقاط الصبغات عندما يكون مناسبًا لطبيعة الحمولة والألوان الموجودة داخل الغسالة.',
            'العناية بالملابس لا تنتهي عند توقف الغسالة. يفضل إخراج القطع بعد انتهاء الدورة وعدم تركها مبللة لفترة طويلة ثم تجفيفها بالطريقة المناسبة لنوع القماش. كما يساعد التعامل السريع مع البقع وتجنب الغسيل القاسي المتكرر على الحفاظ على جودة الأنسجة والألوان مع مرور الوقت.',
            'قبل شراء منتج للعناية بالملابس عبر الإنترنت من المفيد مراجعة وصف المنتج وطريقة الاستخدام وسياسات المتجر وقنوات التواصل. للمستخدم في السعودية، معرفة سياسة الاستبدال والاسترجاع وخيارات التواصل وطلبات الجملة تجعل قرار الشراء أكثر وضوحًا وتساعد على اختيار الكمية المناسبة للاستخدام المنزلي أو التجاري.',
            'أفضل حماية للألوان تأتي من روتين متكامل يجمع بين الفرز المنطقي والبرنامج المناسب ودرجة الحرارة الملائمة والكمية الصحيحة من المنظف والعناية بالقطع الجديدة. ويمكن إضافة مناديل التقاط الصبغات كخطوة مساعدة عند الحاجة، ما يجعل الغسيل الملون أكثر تنظيمًا ويقلل المفاجآت الناتجة عن انتقال اللون.'
          ]
          def article(title):
            out=[f'# {title}']
            for i,p in enumerate(PARAS):
              a,b=REFS[2*i],REFS[2*i+1]
              out += [f'## نصيحة {i+1}',p+f' للمزيد راجع [{a[0]}]({a[1]}) و[{b[0]}]({b[1]}).']
            return '\n\n'.join(out)
          def hst(u):
            try:return (urlparse(u).hostname or '').lower().lstrip('www.')
            except:return ''
          async def browser_verify(u,allowed):
            if not u or not u.startswith('http'): return False
            h=hst(u)
            if h=='narexx.com' or h.endswith('.narexx.com'): return False
            if any(x in u.lower() for x in ['/edit/','/admin/','dashboard','token=']): return False
            if allowed and not any(h==d or h.endswith('.'+d) for d in allowed): return False
            try:
              async with async_playwright() as p:
                b=await p.chromium.launch(headless=True);pg=await b.new_page();await pg.goto(u,wait_until='domcontentloaded',timeout=35000);await pg.wait_for_timeout(2500);txt=(await pg.content()).lower();await b.close();return txt.count('narexx.com')>=7
            except:return False
          def verify_req(u,allowed):
            if not u or not u.startswith('http'):return False
            h=hst(u)
            if h=='narexx.com' or h.endswith('.narexx.com') or any(x in u.lower() for x in ['/edit/','/admin/','dashboard','token=']):return False
            if allowed and not any(h==d or h.endswith('.'+d) for d in allowed):return False
            try:
              r=requests.get(u,timeout=30,allow_redirects=True,headers={'User-Agent':'Mozilla/5.0'});return r.status_code<400 and r.text.lower().count('narexx.com')>=7
            except:return False
          rows=[]
          def row(site,u,title,count,status):rows.append([site,u,title,count,status]);print('RESULT|'+site+'|'+u+'|links='+str(count)+'|'+status,flush=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 NAREXPublisher/10.0'})

          # 1 mdlib.dev
          title=TOPICS[0];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            r=s.post('https://mdlib.dev/v1/docs',json={'markdown':a,'title':title,'is_public':True},timeout=35);d=r.json();u=d.get('url','')
          except Exception as e:err=repr(e)
          row('mdlib.dev',u if verify_req(u,['mdlib.dev']) else '',title,c,'published' if verify_req(u,['mdlib.dev']) else 'FAILED')

          # 2 paste.rs
          title=TOPICS[1];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            r=s.post('https://paste.rs/',data=a.encode(),timeout=35);base=r.text.strip().splitlines()[0] if r.ok else '';u=base+'.md' if base.startswith('http') else ''
          except Exception:pass
          row('paste.rs',u if verify_req(u,['paste.rs']) else '',title,c,'published' if verify_req(u,['paste.rs']) else 'FAILED')

          # 3 dpaste multipart
          title=TOPICS[2];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            files={'content':(None,a),'format':(None,'json'),'lexer':(None,'_markdown'),'expires':(None,'never')};r=s.post('https://dpaste.org/api/',files=files,timeout=35);d=r.json();u=d.get('url','')
          except Exception:pass
          row('dpaste.org',u if verify_req(u,['dpaste.org']) else '',title,c,'published' if verify_req(u,['dpaste.org']) else 'FAILED')

          # 4 display.dev -> public.dsp.so, ASCII name
          title=TOPICS[3];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            files={'file':('narex-color-guide.md',a.encode(),'text/markdown')};r=s.post('https://api.display.dev/v1/public/artifacts',files=files,data={'name':'narex-color-guide'},timeout=45);d=r.json();u=d.get('previewUrl') or d.get('url','')
          except Exception:pass
          ok=verify_req(u,['dsp.so','display.dev']);row('public.dsp.so',u if ok else '',title,c,'published' if ok else 'FAILED')

          # 5 pastebox.ai
          title=TOPICS[4];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            r=s.post('https://lfdekutkxwsczpasjgsg.supabase.co/functions/v1/create-share',json={'content':a,'title':title,'language':'markdown','content_type':'text','expiration':'1M','exposure':'public','source':'api'},timeout=35);d=r.json();u=d.get('url','')
          except Exception:pass
          ok=asyncio.run(browser_verify(u,['pastebox.ai']));row('pastebox.ai',u if ok else '',title,c,'published' if ok else 'FAILED')

          # 6 md2pdf.studio
          title=TOPICS[5];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            r=s.post('https://md2pdf.studio/api/save',data=a.encode(),headers={'Content-Type':'text/plain'},timeout=35);d=r.json();u=d.get('url') or d.get('shareUrl','')
          except Exception:pass
          ok=asyncio.run(browser_verify(u,['md2pdf.studio']));row('md2pdf.studio',u if ok else '',title,c,'published' if ok else 'FAILED')

          # 7 plsreadme.com demo grant + create-link, same session
          title=TOPICS[6];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            ps=requests.Session();ps.headers.update({'User-Agent':'Mozilla/5.0'});ps.get('https://plsreadme.com/',timeout=30);g=ps.get('https://plsreadme.com/api/auth/demo-grant',headers={'Accept':'application/json','Referer':'https://plsreadme.com/'},timeout=30);r=ps.post('https://plsreadme.com/api/create-link',json={'markdown':a},headers={'Referer':'https://plsreadme.com/'},timeout=35);d=r.json();u=d.get('url','')
          except Exception:pass
          ok=asyncio.run(browser_verify(u,['plsreadme.com']));row('plsreadme.com',u if ok else '',title,c,'published' if ok else 'FAILED')

          # 8 pastepile markdown public
          title=TOPICS[7];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            r=s.post('https://www.pastepile.com/api/public/pastes',json={'title':title,'content':a,'language':'markdown','expiry':'1mo','visibility':'public'},timeout=35);d=r.json();u=d.get('url','')
          except Exception:pass
          ok=asyncio.run(browser_verify(u,['pastepile.com']));row('pastepile.com',u if ok else '',title,c,'published' if ok else 'FAILED')

          # 9 emdee JSON historical shape
          title=TOPICS[8];a=article(title);c=a.count('https://narexx.com');u=''
          try:
            r=s.post('https://emdee.info/api/',json={'title':title,'content':a},timeout=35);d=r.json();u=d.get('url') or d.get('share_url','')
          except Exception:pass
          ok=verify_req(u,['emdee.info']);row('emdee.info',u if ok else '',title,c,'published' if ok else 'FAILED')

          with open('narex-batch10.csv','w',newline='',encoding='utf-8-sig') as f:csv.writer(f).writerows([['platform','published_url','title','narex_links','status']]+rows)
          print('SUCCESS_COUNT='+str(len([r for r in rows if r[1]])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: narex-batch10-results
          path: narex-batch10.csv
