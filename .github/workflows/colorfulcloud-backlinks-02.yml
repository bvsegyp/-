name: Colorful Cloud Backlinks 02
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run Colorful Cloud backlink batch 02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Publish batch 02
        run: python scripts/colorfulcloud_backlinks_02.py
