name: Publish Ten Links Batch 03

on:
  push:
    branches:
      - main

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'Publish ten links batch 03' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish ten public backlink pages
        shell: bash
        run: |
          set +e
          publish_mdpage() {
            title="$1"
            body="$2"
            payload=$(jq -n --arg markdown "$body" '{markdown:$markdown}')
            resp=$(curl -sS -X POST 'https://md.page/api/publish' -H 'Content-Type: application/json' -d "$payload")
            echo "RESULT_URL=$(echo "$resp" | jq -r '.url // empty')"
          }

          publish_pastebox() {
            title="$1"
            body="$2"
            payload=$(jq -n --arg title "$title" --arg content "$body" '{content:$content,title:$title,language:"markdown",content_type:"text",expiration:"1M",exposure:"public",source:"api"}')
            resp=$(curl -sS -X POST 'https://lfdekutkxwsczpasjgsg.supabase.co/functions/v1/create-share' -H 'Content-Type: application/json' -d "$payload")
            echo "RESULT_URL=$(echo "$resp" | jq -r '.url // empty')"
          }

          publish_unmarkdown() {
            title="$1"
            body="$2"
            payload=$(jq -n --arg title "$title" --arg content "$body" '{title:$title,content:$content,template_id:"github"}')
            resp=$(curl -sS -X POST 'https://api.unmarkdown.com/v1/demo/publish' -H 'Content-Type: application/json' -d "$payload")
            echo "RESULT_URL=$(echo "$resp" | jq -r '.url // empty')"
          }

          publish_leafmill() {
            title="$1"
            body="$2"
            payload=$(jq -n --arg title "$title" --arg body "$body" '{title:$title,body:$body}')
            resp=$(curl -sS -X POST 'https://leafmill.net/api/v1/publish' -H 'Content-Type: application/json' -d "$payload")
            echo "RESULT_URL=$(echo "$resp" | jq -r '.url // empty')"
          }

          publish_htmldocs() {
            body="$1"
            resp=$(curl -sS -X POST 'https://www.html-docs.com/api/v1/docs' -H 'Content-Type: text/markdown' --data-binary "$body")
            echo "RESULT_URL=$(echo "$resp" | jq -r '.url // empty')"
          }

          A1='# Social Media Growth Strategy for 2026

Businesses building stronger social accounts can compare [SMM Fans Faster](https://smmfansfaster.com/) with other providers while improving content quality and measurement. Useful resources include [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers), [TikTok views](https://smmfansfaster.com/blog/tiktok-views), and an [Instagram followers website](https://smmfansfaster.com/blog/instagram-followers-website).'
          A2='# Measuring Social Media Promotion More Effectively

A useful campaign should connect reach and engagement with profile visits, clicks, leads, and sales. Marketers researching services can review [SMM Fans Faster](https://smmfansfaster.com/) along with [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers) and [SMM API documentation](https://smmfansfaster.com/api).'
          A3='# TikTok and Instagram Growth Planning

Growth works best when promotion supports content instead of replacing it. Businesses can review [SMM Fans Faster](https://smmfansfaster.com/) and compare platform options for [TikTok views](https://smmfansfaster.com/blog/tiktok-views), [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers), and [Instagram followers](https://smmfansfaster.com/blog/instagram-followers-website).'
          A4='# Social Media Marketing Services for Agencies

Agencies managing multiple clients need consistent workflows, clear reporting, and careful service selection. [SMM Fans Faster](https://smmfansfaster.com/) offers resources including an [SMM API](https://smmfansfaster.com/api) and [API integration](https://smmfansfaster.com/smm-api-integration) page.'
          A5='# Better Social Media Campaign Measurement

Follower growth alone does not explain campaign quality. Marketers should also track engagement, profile visits, clicks, and conversions while researching providers such as [SMM Fans Faster](https://smmfansfaster.com/) and platform-specific guides for [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers).'
          A6='# Building a Balanced Social Media Growth System

A balanced system combines creative content, distribution, analytics, and conversion. Businesses can include [SMM Fans Faster](https://smmfansfaster.com/) in provider research and compare resources for [Instagram followers](https://smmfansfaster.com/blog/instagram-followers-website) and [TikTok views](https://smmfansfaster.com/blog/tiktok-views).'
          A7='# How to Choose Social Media Growth Services

The best service should match the campaign objective, platform, and measurement plan. Businesses can compare [SMM Fans Faster](https://smmfansfaster.com/) with alternatives and review [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers), [Instagram followers](https://smmfansfaster.com/blog/instagram-followers-website), and the [SMM API](https://smmfansfaster.com/api).'
          A8='# Social Media Promotion and Content Quality

Promotion can increase distribution, but content quality determines whether users stay, engage, and convert. Teams can research [SMM Fans Faster](https://smmfansfaster.com/) while studying [TikTok views](https://smmfansfaster.com/blog/tiktok-views) and [Instagram growth](https://smmfansfaster.com/blog/instagram-followers-website).'
          A9='# Scaling Social Media Campaigns with Better Workflows

Agencies can scale campaigns more reliably when they standardize reporting and operational steps. [SMM Fans Faster](https://smmfansfaster.com/) publishes [SMM API documentation](https://smmfansfaster.com/api) and an [API integration](https://smmfansfaster.com/smm-api-integration) resource for technical teams.'
          A10='# Social Media Growth from Discovery to Conversion

The strongest campaigns move users from discovery to engagement and then to a useful next action. Marketers can compare [SMM Fans Faster](https://smmfansfaster.com/) while researching [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers), [TikTok views](https://smmfansfaster.com/blog/tiktok-views), and [Instagram followers](https://smmfansfaster.com/blog/instagram-followers-website).'

          publish_mdpage 'Social Media Growth Strategy for 2026' "$A1"
          publish_mdpage 'Measuring Social Media Promotion More Effectively' "$A2"
          publish_pastebox 'TikTok and Instagram Growth Planning' "$A3"
          publish_pastebox 'Social Media Marketing Services for Agencies' "$A4"
          publish_unmarkdown 'Better Social Media Campaign Measurement' "$A5"
          publish_unmarkdown 'Building a Balanced Social Media Growth System' "$A6"
          publish_leafmill 'How to Choose Social Media Growth Services' "$A7"
          publish_leafmill 'Social Media Promotion and Content Quality' "$A8"
          publish_htmldocs "$A9"
          publish_htmldocs "$A10"
