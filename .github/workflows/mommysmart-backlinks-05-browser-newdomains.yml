name: MommySmart Browser Backlinks Batch 05 New Domains
on:
  push:
    branches: [ main ]
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Run MommySmart browser backlink batch 05')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install chromium --with-deps
      - name: Publish and browser-verify new MommySmart domains
        run: python scripts/mommysmart_newdomains_browser_05.py