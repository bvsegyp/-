name: Publish Unique PagePaste Backlink
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique PagePaste backlink'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish PagePaste article
        run: python3 scripts/publish_pagepaste_unique.py | tee publish.log
      - name: Show URL
        run: grep '^RESULT_URL=https://' publish.log || true
