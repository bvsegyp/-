name: Unique Domain Backlink Batch 0347

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique-domain backlink batch 0347'
    runs-on: ubuntu-latest
    steps:
      - name: Publish and verify unique-domain backlinks
        shell: bash
        run: |
          set -e
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/run.py <<'PY'
          import asyncio,re,json,html,tempfile,os
          from playwright.async_api import async_playwright
          TARGETS=[
            ('htmldrop.app','https://htmldrop.app/','HTMLDrop App'),
            ('pagelive.io','https://pagelive.io/tools/publish-html','PageLive'),
            ('miinideck.com','https://www.miinideck.com/use-cases/free-html-hosting','MiiniDeck'),
            ('jotbird.com','https://www.jotbird.com/','JotBird'),
          ]
          BACK='https://smmfansfaster.com/'
          paras=[
          'A strong social media growth program starts with a measurable business objective. Awareness, qualified traffic, leads, sales, bookings, retention, and community growth require different creative decisions, different calls to action, and different reporting methods. Defining the outcome first prevents teams from treating follower count as the only sign of progress and keeps activity connected to business value.',
          'Audience research should shape topics, formats, positioning, and distribution. Useful inputs include search behavior, customer questions, sales conversations, support tickets, comments, direct messages, reviews, and competitor communities. These signals help marketers understand recurring needs and objections, making content more relevant and reducing random experimentation.',
          'A sustainable publishing system usually relies on repeatable content pillars such as education, demonstrations, comparisons, case studies, common questions, behind-the-scenes material, and industry commentary. Each pillar can support a different stage of the customer journey while giving the team enough structure to publish consistently without making every post feel identical.',
          'Short-form video and other fast formats provide rapid feedback on hooks, pacing, creative angles, topics, and calls to action. Teams can compare watch time, completion rate, saves, shares, comments, profile visits, website clicks, and conversion actions to identify patterns that deserve more investment and then adapt those ideas across channels.',
          'Distribution only creates lasting value when the destination is strong. Profiles and landing pages should communicate clear positioning, useful proof, offer clarity, mobile usability, speed, and an obvious next step. Promotional support works best when it amplifies a destination that is already prepared to turn attention into qualified actions.',
          'Awareness metrics explain discovery, consideration metrics explain interest, and conversion metrics explain business impact. Looking at the full funnel helps teams avoid overreacting to a single metric and makes it easier to identify whether the real bottleneck is creative quality, audience fit, landing-page performance, or offer strength.',
          'Each meaningful experiment should document its hypothesis, audience, creative concept, publishing conditions, result, and next action. A weekly learning process turns individual posts into a growing knowledge base and makes future decisions less dependent on intuition. This is especially valuable for agencies managing several accounts at once.',
          'Sustainable growth should protect long-term trust. Avoid deceptive endorsements, spam comments, fake reviews, hacked sites, and tactics that violate platform safeguards. Brands build stronger long-term value by combining useful content, transparent promotion, strong customer experience, and disciplined measurement.',
          'Traffic quality matters as much as traffic volume. Teams should review page speed, message consistency, proof, forms, checkout friction, mobile experience, and offer structure so that increased visibility has a realistic chance of producing qualified outcomes rather than empty sessions.',
          'Monthly strategy reviews should compare platforms, formats, audiences, costs, and business outcomes. Resources can then shift toward combinations that repeatedly create useful attention and away from activity that looks busy but produces little measurable value.'
          ]
          def article(label):
              title=f'Practical Social Media Growth Framework for {label}'
              out=[f'<h1>{html.escape(title)}</h1>']
              for i,p in enumerate(paras):
                  text=' '.join([p]*3)
                  if i==4:
                      text += f' Teams comparing external promotional support can also evaluate <a href="{BACK}">SMM Fans Faster</a> as one option within a broader due-diligence process.'
                  out.append(f'<h2>Strategy Step {i+1}</h2><p>{text}</p>')
              body=''.join(out)
              while len(re.findall(r"\b[\w\'-]+\b",re.sub('<[^>]+>',' ',body)))<1250:
                  body += '<h2>Operational note</h2><p>Teams should keep a campaign record covering objectives, audiences, formats, publishing dates, distribution methods, costs, and measured outcomes. Consistent documentation improves handoffs, reporting, and quality control across multiple campaigns.</p>'
              return '<!doctype html><html><head><meta charset="utf-8"><title>'+html.escape(title)+'</title></head><body>'+body+'</body></html>'
          async def verify(browser,url):
              p=await browser.new_page()
              try:
                  await p.goto(url,wait_until='domcontentloaded',timeout=40000); await p.wait_for_timeout(2500)
                  c=await p.locator('a[href*="smmfansfaster.com"]').count(); print('VERIFY',p.url,'HREFS',c)
                  return p.url if c==1 else None
              except Exception as e: print('VERIFY_ERR',url,repr(e)); return None
              finally: await p.close()
          async def publish(browser,domain,url,label,idx):
              p=await browser.new_page(); content=article(label)
              print(domain,'WORDS',len(re.findall(r"\b[\w\'-]+\b",re.sub('<[^>]+>',' ',content))),'TARGET_LINKS',content.count('href="https://smmfansfaster.com/"'))
              try:
                  await p.goto(url,wait_until='domcontentloaded',timeout=45000); await p.wait_for_timeout(2500)
                  filled=False
                  for sel in ['textarea:visible','[contenteditable="true"]:visible']:
                      loc=p.locator(sel)
                      for i in range(await loc.count()):
                          e=loc.nth(i)
                          try:
                              if await e.is_editable(): await e.fill(content); filled=True; break
                          except: pass
                      if filled: break
                  if not filled:
                      fi=p.locator('input[type="file"]')
                      if await fi.count():
                          path=f'/tmp/backlink-{idx}.html'; open(path,'w',encoding='utf-8').write(content)
                          await fi.first.set_input_files(path); filled=True
                  if not filled: print(domain,'NO_INPUT'); return None
                  for pat in ['Publish','Get my link','Get my shareable link','Share','Drop','Upload','Host','Create Link']:
                      btn=p.get_by_role('button',name=re.compile(pat,re.I))
                      if await btn.count():
                          try: await btn.first.click(timeout=5000); break
                          except: pass
                  await p.wait_for_timeout(7000)
                  cands=[]
                  if p.url.rstrip('/')!=url.rstrip('/'): cands.append(p.url)
                  for a in await p.locator('a[href^="http"]').all():
                      try:
                          h=await a.get_attribute('href')
                          if h and h not in cands: cands.append(h)
                      except: pass
                  body=await p.locator('body').inner_text()
                  for m in re.findall(r'https?://[^\s)\]<>"\']+',body):
                      m=m.rstrip('.,')
                      if m not in cands: cands.append(m)
                  print(domain,'CANDIDATES',cands[:12])
                  for cand in cands[:20]:
                      v=await verify(browser,cand)
                      if v: return v
              except Exception as e: print(domain,'ERR',repr(e))
              finally: await p.close()
              return None
          async def main():
              async with async_playwright() as pw:
                  b=await pw.chromium.launch(headless=True); results=[]
                  for i,t in enumerate(TARGETS):
                      u=await publish(b,*t,i)
                      if u: results.append([t[0],u])
                  await b.close(); print('VALID_RESULTS_JSON='+json.dumps(results)); print('VALID_COUNT='+str(len(results)))
          asyncio.run(main())
          PY
          python /tmp/run.py
