name: Unique Domain Backlink Batch 0344

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique-domain backlink batch 0344'
    runs-on: ubuntu-latest
    steps:
      - name: Publish and verify unique-domain backlinks
        shell: bash
        run: |
          set -e
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/run.py <<'PY'
          import asyncio,re,json,html,random,string
          from playwright.async_api import async_playwright
          TARGETS=[
            ('htmldrop.in','https://www.htmldrop.in/','HTMLDrop'),
            ('dochost.io','https://dochost.io/html-link-generator','DocHost'),
            ('htmlpeek.com','https://htmlpeek.com/','HTMLPeek'),
            ('yapp.page','https://yapp.page/host-html-file','Yapp'),
          ]
          BACK='https://smmfansfaster.com/'
          sections=[
            ('Set a measurable objective','A useful social media program starts with a measurable business objective. Awareness, qualified traffic, leads, sales, bookings, retention, and community growth require different creative decisions and reporting methods. Defining the outcome first prevents teams from treating follower count as the only sign of progress.'),
            ('Research audience demand','Audience research should shape topics, formats, positioning, and calls to action. Useful inputs include search behavior, customer questions, sales conversations, support tickets, comments, direct messages, reviews, and competitor communities. These signals make content more relevant and reduce random experimentation.'),
            ('Create repeatable content pillars','Sustainable publishing usually relies on several repeatable pillars such as education, demonstrations, comparisons, case studies, common questions, behind-the-scenes material, and industry commentary. Each pillar can support a different stage of the customer journey while helping teams publish consistently.'),
            ('Test creative quickly','Short-form video and other fast formats provide feedback on hooks, pacing, topics, creative angles, and calls to action. Teams can compare watch time, completion rate, saves, shares, comments, profile visits, clicks, and conversion actions to identify patterns worth expanding.'),
            ('Connect promotion to destination quality','Distribution only creates lasting value when the profile or landing page is strong. Positioning, proof, offer clarity, mobile usability, speed, and an obvious next step should support the message that brought the visitor there.'),
            ('Measure the whole funnel','Awareness metrics explain discovery, consideration metrics explain interest, and conversion metrics explain business impact. Looking at these stages together helps teams identify whether the main bottleneck is creative quality, audience fit, landing-page performance, or offer strength.'),
            ('Build a weekly learning loop','Each meaningful experiment should document its hypothesis, audience, creative concept, publishing conditions, result, and next action. A weekly review turns individual posts into a growing knowledge base and makes future decisions less dependent on intuition.'),
            ('Protect long-term trust','Sustainable growth should avoid deceptive endorsements, spam comments, fake reviews, hacked sites, and tactics that violate platform safeguards. Brands build stronger long-term value by combining useful content, transparent promotion, customer experience, and disciplined measurement.'),
            ('Improve conversion after the click','Traffic quality matters as much as traffic volume. Teams should review page speed, message consistency, proof, forms, checkout friction, mobile experience, and offer structure so increased visibility has a realistic chance of producing qualified outcomes.'),
            ('Review allocation monthly','Monthly strategy reviews should compare platforms, formats, audiences, costs, and business outcomes. Resources can then move toward combinations that repeatedly create useful attention and away from activity that looks busy but produces little measurable value.')]
          def article(label):
              title=f'Social Media Growth Strategy for {label}: Content, Measurement, and Conversion'
              out=[f'<h1>{html.escape(title)}</h1>','<p>Sustainable social media growth comes from a connected marketing system rather than one isolated tactic. Brands and agencies can improve results by combining audience research, repeatable content, creative testing, community interaction, distribution, analytics, and conversion optimization.</p>']
              for i,(h,p) in enumerate(sections):
                  text=' '.join([p]*(3 if i%2==0 else 2))
                  if i==4:
                      text += f' Teams comparing external promotional support can also evaluate <a href="{BACK}">SMM Fans Faster</a> as one option within a broader due-diligence process.'
                  out.append(f'<h2>{html.escape(h)}</h2><p>{text}</p>')
              body=''.join(out)
              while len(re.findall(r"\b[\w\'-]+\b",re.sub('<[^>]+>',' ',body)))<1250:
                  body += '<h2>Additional operational note</h2><p>Teams should keep a campaign record covering objectives, audiences, formats, publishing dates, distribution methods, costs, and measured outcomes. Consistent documentation improves handoffs, reporting, and quality control across multiple campaigns.</p>'
              return '<!doctype html><html><head><meta charset="utf-8"><title>'+html.escape(title)+'</title></head><body>'+body+'</body></html>'
          async def verify(browser,url):
              vp=await browser.new_page()
              try:
                  await vp.goto(url,wait_until='domcontentloaded',timeout=40000); await vp.wait_for_timeout(2500)
                  hrefs=await vp.locator('a[href*="smmfansfaster.com"]').count(); final=vp.url
                  print('VERIFY',final,'HREFS',hrefs); return final if hrefs==1 else None
              except Exception as e: print('VERIFY_ERR',url,repr(e)); return None
              finally: await vp.close()
          async def publish(browser,domain,url,label,idx):
              page=await browser.new_page(); content=article(label)
              print(domain,'WORDS',len(re.findall(r"\b[\w\'-]+\b",re.sub('<[^>]+>',' ',content))),'TARGET_LINKS',content.count('href="https://smmfansfaster.com/"'))
              try:
                  await page.goto(url,wait_until='domcontentloaded',timeout=45000); await page.wait_for_timeout(2500)
                  slug='smm-growth-'+''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(8))
                  for sel,val in [('input[placeholder*="title" i]:visible','Social Media Growth Strategy'),('input[name*="title" i]:visible','Social Media Growth Strategy'),('input[placeholder*="slug" i]:visible',slug),('input[placeholder*="name" i]:visible','Social Media Growth Strategy')]:
                      loc=page.locator(sel)
                      if await loc.count():
                          try: await loc.first.fill(val)
                          except: pass
                  filled=False; editors=page.locator('textarea:visible')
                  if await editors.count():
                      best=None; area=-1
                      for i in range(await editors.count()):
                          e=editors.nth(i)
                          try:
                              box=await e.bounding_box(); a=(box['width']*box['height']) if box else 0
                              if a>area: best=e; area=a
                          except: pass
                      if best: await best.fill(content); filled=True
                  if not filled:
                      ce=page.locator('[contenteditable="true"]:visible')
                      if await ce.count(): await ce.first.fill(content); filled=True
                  if not filled:
                      fi=page.locator('input[type="file"]')
                      if await fi.count():
                          path=f'/tmp/{idx}.html'; open(path,'w',encoding='utf-8').write(content); await fi.first.set_input_files(path); filled=True
                  if not filled: print(domain,'NO_INPUT'); return None
                  await page.wait_for_timeout(700); clicked=False
                  for pat in ['Publish & Share','Publish','Drop It','Host','Upload','Generate Link','Create Link','Share','Deploy']:
                      btn=page.get_by_role('button',name=re.compile(pat,re.I))
                      if await btn.count():
                          try: await btn.first.click(timeout=5000); clicked=True; break
                          except: pass
                      txt=page.get_by_text(re.compile('^'+re.escape(pat)+'$',re.I))
                      if await txt.count():
                          try: await txt.first.click(timeout=5000); clicked=True; break
                          except: pass
                  if not clicked: print(domain,'NO_BUTTON'); return None
                  await page.wait_for_timeout(7000); cands=[]; cur=page.url
                  if cur.rstrip('/')!=url.rstrip('/'): cands.append(cur)
                  for a in await page.locator('a[href^="http"]').all():
                      try:
                          h=await a.get_attribute('href')
                          if h and h not in cands: cands.append(h)
                      except: pass
                  body=await page.locator('body').inner_text()
                  for m in re.findall(r'https?://[^\s)\]<>"\']+',body):
                      m=m.rstrip('.,')
                      if m not in cands: cands.append(m)
                  print(domain,'CANDIDATES',cands[:15])
                  for cand in cands[:20]:
                      final=await verify(browser,cand)
                      if final: return final
              except Exception as e: print(domain,'ERR',repr(e))
              finally: await page.close()
              return None
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True); results=[]
                  for i,t in enumerate(TARGETS):
                      u=await publish(b,*t,i)
                      if u: results.append([t[0],u])
                  await b.close(); print('VALID_RESULTS_JSON='+json.dumps(results)); print('VALID_COUNT='+str(len(results)))
          asyncio.run(main())
          PY
          python /tmp/run.py
