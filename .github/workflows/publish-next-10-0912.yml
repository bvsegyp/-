name: Publish Next 10 Backlinks 0912

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish next 10 backlinks 0912'
    runs-on: ubuntu-latest
    steps:
      - name: Publish 10 long-form backlink articles
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://raw.githubusercontent.com/bvsegyp/-/main/.github/workflows/publish-10-long-backlinks-now.yml' -o /tmp/base.yml
          python - <<'PY'
          import re,textwrap,requests,json,html,secrets
          y=open('/tmp/base.yml',encoding='utf-8').read()
          m=re.search(r"cat > /tmp/publish\.py <<'PY'\n(.*?)\n\s*PY\n\s*python /tmp/publish\.py",y,re.S)
          if not m: raise SystemExit('BASE_SCRIPT_NOT_FOUND')
          code=textwrap.dedent(m.group(1)); gen=code.split('results=[]',1)[0]
          repl={
            'A Complete Social Media Growth Framework for Agencies and Brands':'Social Media Growth Architecture: A Long-Form Guide for Sustainable Reach and Conversion',
            'How to Build a Sustainable TikTok Growth System in 2026':'TikTok Growth Operations in 2026: Creative Testing, Retention, and Audience Quality',
            'Instagram Growth Strategy: From Reach to Real Conversions':'Instagram Growth Systems: Reels, Stories, Trust, and Conversion Measurement',
            'How to Evaluate an SMM Panel Without Losing Sight of Strategy':'How to Compare Social Media Growth Providers with Better Due Diligence',
            'A Practical Social Media Analytics and Promotion Playbook':'Social Media Analytics Playbook: Measuring Reach, Engagement, Traffic, and Sales',
            'Multi-Platform Campaign Operations for Modern Marketing Teams':'Multi-Platform Campaign Operations: A Detailed Guide for Marketing Teams',
            'Combining Organic Content, Paid Media, and SMM Support':'Balancing Organic Content, Paid Distribution, and Social Media Growth Services',
            'How to Build a Social Media Funnel That Converts Attention':'Building a Social Media Funnel from Discovery to Qualified Conversion',
            'A Content Testing Framework for Faster Social Media Learning':'Creative Testing Systems for Faster Social Media Learning and Better Decisions',
            'Agency Automation and the Role of an SMM API in Campaign Workflows':'Agency Automation with SMM APIs: Governance, Reporting, and Scalable Workflows',
            'agency planning, client reporting, and multi-platform execution':'agency strategy, audience development, client reporting, quality control, and multi-platform execution',
            'TikTok content experimentation, retention, reach, and audience development':'TikTok creative testing, retention, discovery, audience quality, and conversion measurement',
            'Instagram positioning, Reels, Stories, profile optimization, and conversion':'Instagram editorial systems, Reels discovery, Stories engagement, profile trust, and conversion',
            'provider evaluation, service quality, campaign fit, and risk control':'provider due diligence, campaign fit, service transparency, quality control, and risk management',
            'measurement, reporting, attribution, and data-driven campaign decisions':'measurement systems, reporting cadence, attribution limits, and evidence-based campaign decisions',
            'process design, scheduling, quality assurance, and team coordination':'workflow design, publishing systems, quality assurance, ownership, and team coordination',
            'channel mix, budget decisions, audience trust, and campaign balance':'channel strategy, budget tradeoffs, audience trust, distribution balance, and sustainable growth',
            'awareness, consideration, conversion, landing pages, and measurement':'full-funnel planning, awareness, consideration, landing-page quality, conversion, and measurement',
            'creative hypotheses, structured experiments, learning loops, and iteration':'creative research, hypothesis design, structured experiments, learning loops, and iteration',
            'automation, order management, reporting, governance, and agency scale':'workflow automation, order controls, audit trails, reporting standards, governance, and agency scale'
          }
          for a,b in repl.items(): gen=gen.replace(a,b)
          ns={}; exec(gen,ns)
          arts=ns['articles']; titles=ns['titles']; md_to_html=ns['md_to_html']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'})
          results=[]
          for i,a in enumerate(arts):
              wc=len(re.findall(r"\b[\w’'-]+\b",a)); lc=a.count('https://smmfansfaster.com')
              print(f'ARTICLE_{i+1}_WORDS={wc}'); print(f'ARTICLE_{i+1}_TARGET_LINKS={lc}')
              if wc<1200 or lc<6: raise SystemExit('ARTICLE_TOO_SHORT')
          def verify(url):
              try:
                  r=s.get(url,timeout=35,allow_redirects=True)
                  hrefs=len(re.findall(r'href=["\']https://smmfansfaster\.com[^"\']*["\']',r.text,re.I)); total=r.text.count('smmfansfaster.com')
                  print('VERIFY',url,'STATUS',r.status_code,'HREFS',hrefs,'TOTAL',total)
                  return r.status_code<400 and (hrefs>=6 or total>=6)
              except Exception as e: print('VERIFY_ERR',url,repr(e)); return False
          def accept(domain,url):
              if url and verify(url): results.append([domain,url]); print('ACCEPTED_URL='+url)
              else: print('REJECTED_DOMAIN='+domain)

          # 1 output.pub
          try:
              d=s.post('https://output.pub/api/publish',json={'content':arts[0],'format':'markdown'},timeout=35).json(); accept('output.pub',d.get('url',''))
          except Exception as e: print('OUTPUT_ERR',repr(e))

          # 2 write.as
          try:
              d=s.post('https://write.as/api/posts',json={'body':arts[1],'title':titles[1],'font':'serif','lang':'en','rtl':False},timeout=35).json(); pid=(d.get('data') or {}).get('id',''); accept('write.as','https://write.as/'+pid if pid else '')
          except Exception as e: print('WRITEAS_ERR',repr(e))

          # 3 telegra.ph
          try:
              acc=s.post('https://api.telegra.ph/createAccount',data={'short_name':'SMMEditorial','author_name':'Digital Marketing Editorial','author_url':'https://smmfansfaster.com/'},timeout=35).json(); tok=(acc.get('result') or {}).get('access_token','')
              nodes=[]
              for para in re.split(r'\n\s*\n',arts[2]):
                  para=para.strip()
                  if not para: continue
                  tag='p'; txt=para
                  if para.startswith('# '): tag='h3'; txt=para[2:]
                  elif para.startswith('## '): tag='h4'; txt=para[3:]
                  children=[]; pos=0
                  for mm in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',txt):
                      if mm.start()>pos: children.append(txt[pos:mm.start()])
                      children.append({'tag':'a','attrs':{'href':mm.group(2)},'children':[mm.group(1)]}); pos=mm.end()
                  if pos<len(txt): children.append(txt[pos:])
                  nodes.append({'tag':tag,'children':children or [txt]})
              d=s.post('https://api.telegra.ph/createPage',data={'access_token':tok,'title':titles[2],'author_name':'Digital Marketing Editorial','author_url':'https://smmfansfaster.com/','content':json.dumps(nodes),'return_content':'true'},timeout=35).json(); accept('telegra.ph',(d.get('result') or {}).get('url',''))
          except Exception as e: print('TELEGRAPH_ERR',repr(e))

          # 4 shippage.ai
          try:
              h=md_to_html(arts[3]); d=s.post('https://shippage.ai/v1/publish',json={'html':h,'title':titles[3],'public':True},timeout=35).json(); accept('shippage.ai',d.get('url',''))
          except Exception as e: print('SHIPPAGE_ERR',repr(e))

          # 5 markdown.page
          try:
              r=s.post('https://markdown.page/api/publish',data=arts[4].encode('utf-8'),timeout=35); u=r.text.strip().strip('"'); accept('markdown.page',u)
          except Exception as e: print('MARKDOWNPAGE_ERR',repr(e))

          # 6 rentry.co
          try:
              home=s.get('https://rentry.co/',timeout=35); csrf=s.cookies.get('csrftoken',''); edit=secrets.token_urlsafe(12)
              d=s.post('https://rentry.co/api/new',data={'csrfmiddlewaretoken':csrf,'text':arts[5],'edit_code':edit,'url':''},headers={'Referer':'https://rentry.co/'},timeout=35).json(); accept('rentry.co',d.get('url',''))
          except Exception as e: print('RENTRY_ERR',repr(e))

          # 7 paste.rs markdown
          try:
              r=s.post('https://paste.rs/',data=arts[6].encode('utf-8'),headers={'Content-Type':'text/markdown'},timeout=35); base=r.text.strip(); u=(base+'.md') if base.startswith('http') and not base.endswith('.md') else base; accept('paste.rs',u)
          except Exception as e: print('PASTERS_ERR',repr(e))

          # 8 mdless.net
          try:
              r=s.post('https://mdless.net/api/link',data=arts[7].encode('utf-8'),timeout=35)
              try: d=r.json(); u=d.get('url','')
              except Exception: u=r.text.strip().strip('"')
              accept('mdless.net',u)
          except Exception as e: print('MDLESS_ERR',repr(e))

          # 9 html-docs.com
          try:
              r=s.post('https://www.html-docs.com/api/v1/docs',data=arts[8].encode('utf-8'),headers={'Content-Type':'text/markdown'},timeout=35); d=r.json(); accept('html-docs.com',d.get('url',''))
          except Exception as e: print('HTMLDOCS_ERR',repr(e))

          # 10 md.page
          try:
              d=s.post('https://md.page/api/publish',json={'markdown':arts[9]},timeout=35).json(); accept('md.page',d.get('url',''))
          except Exception as e: print('MDPAGE_ERR',repr(e))

          print('VALID_RESULTS_JSON='+json.dumps(results))
          print('VALID_COUNT='+str(len(results)))
          PY
