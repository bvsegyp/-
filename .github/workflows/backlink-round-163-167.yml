      - name: Publish to five compliant anonymous platforms
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/urls.txt

          R=$(jq -Rs '{content: ., format:"markdown"}' < /tmp/a1.md | curl -fsS -X POST https://output.pub/api/publish -H 'Content-Type: application/json' -d @-)
          U=$(printf '%s' "$R" | jq -r '.url')
          echo "OUTPUT_PUB=$U" | tee -a /tmp/urls.txt

          R=$(jq -Rs '{markdown: .}' < /tmp/a2.md | curl -fsS -X POST https://md.page/api/publish -H 'Content-Type: application/json' -d @-)
          U=$(printf '%s' "$R" | jq -r '.url')
          echo "MD_PAGE=$U" | tee -a /tmp/urls.txt

          U=$(curl -fsS -H 'Accept: text/plain' https://markdown.page/api/publish --data-binary @/tmp/a3.md | tr -d '\r\n')
          echo "MARKDOWN_PAGE=$U" | tee -a /tmp/urls.txt

          R=$(jq -Rs '{content: .}' < /tmp/a4.md | curl -fsS -X POST https://yeet.md/api/share -H 'Content-Type: application/json' -d @-)
          U=$(printf '%s' "$R" | jq -r '.url')
          echo "YEET_MD=$U" | tee -a /tmp/urls.txt

          R=$(jq -Rs '{title:"Turning Social Media Visibility Into Website Traffic and Conversions",content:.,expiresInDays:30}' < /tmp/a5.md | curl -fsS -X POST https://mdview.io/api/public/publish -H 'Content-Type: application/json' -d @-)
          U=$(printf '%s' "$R" | jq -r '.shareUrl // .viewerUrl')
          echo "MDVIEW=$U" | tee -a /tmp/urls.txt

      - name: Verify every live page contains contextual target links
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r name url; do
            test -n "$url"
            body=$(curl -fsSL "$url")
            count=$(printf '%s' "$body" | grep -o 'smmfansfaster.com' | wc -l)
            echo "$name count=$count url=$url"
            test "$count" -ge 6
          done < /tmp/urls.txt

      - name: Save verified URLs
        uses: actions/upload-artifact@v4
        with:
          name: verified-backlink-urls-163-167
          path: /tmp/urls.txt
          retention-days: 7
