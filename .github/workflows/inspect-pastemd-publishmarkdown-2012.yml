name: Inspect PasteMD PublishMarkdown 2012
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: github.event.head_commit.message == 'Run PasteMD PublishMarkdown Inspect 2012'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public publishing paths
        run: python3 scripts/inspect_pastemd_publishmarkdown_2012.py
