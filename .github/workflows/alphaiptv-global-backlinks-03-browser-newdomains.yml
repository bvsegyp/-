name: AlphaIPTV Global English Backlinks Batch 03 Browser New Domains
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run AlphaIPTV global English backlink batch 03 browser newdomains'
    runs-on: ubuntu-latest
    steps:
      - name: Install browser tools
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
      - name: Publish and verify AlphaIPTV backlinks on new domains
        shell: bash
        run: |
          python - <<'PY'
          import asyncio,re,html,requests,json,secrets,os
          from playwright.async_api import async_playwright
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 AlphaIPTVSEO/3.0'})
          SITE='https://alphaiptv.tn/'
          ANCHOR='Legal IPTV Subscription'
          LINKS=[('Legal IPTV Subscription',SITE),('IPTV Subscription',SITE),('Legal IPTV Service',SITE),('Worldwide IPTV Service',SITE),('IPTV Service Provider',SITE)]
          TITLES=[
            'Legal IPTV Subscription: What Global Viewers Should Compare',
            'IPTV Subscription Guide for Smart TVs and Streaming Devices',
            'How to Review a Legal IPTV Service Before Subscribing',
            'Worldwide IPTV Service: Devices, Connections and Support',
            'IPTV Service Provider Checklist for International Viewers',
            'Legal IPTV Subscription Guide for Multiple Devices',
            'How to Compare IPTV Providers Without Relying on Channel Counts',
            'IPTV Subscription Buying Guide for Global Households']
          SECS=[
            ('Verify licensing and regional availability','A responsible IPTV choice starts with confirming that the provider has the appropriate rights to distribute the content it offers in the locations where the service will be used. Availability can differ by country, so published terms and independently verifiable licensing information matter.'),
            ('Check device compatibility','Smart TVs, Android TV devices, streaming sticks, phones, tablets and computers may require different apps or setup methods. Confirming compatibility before payment can prevent activation problems and unnecessary purchases.'),
            ('Compare simultaneous connections','Households using multiple screens should review how many streams can run at the same time and whether device, account or household limits apply.'),
            ('Evaluate streaming quality realistically','Picture quality depends on the source, provider infrastructure, internet connection and device performance. HD or 4K labels should be considered together with realistic technical requirements.'),
            ('Review internet requirements','Stable internet is essential for IPTV. Congested Wi-Fi or weak coverage can cause buffering even when advertised broadband speeds appear high.'),
            ('Look at customer support','Clear contact options and practical response times matter when activation, compatibility or playback issues occur.'),
            ('Compare pricing and plan length','A low price alone does not determine value. Buyers should compare subscription length, connection limits, support, cancellation conditions and refund terms.'),
            ('Read billing and refund terms','Transparent billing, cancellation and refund policies help users understand what happens if a service does not meet expectations.'),
            ('Consider travel and regional restrictions','People who travel frequently should check whether the service is intended for use outside their home country and whether licensing restrictions affect availability abroad.'),
            ('Conclusion','A careful IPTV comparison balances licensing, device support, streaming quality, connection limits, customer support, pricing and transparent terms rather than relying on a single promotional claim.')]
          def make(i):
            parts=[f'<h1>{html.escape(TITLES[i])}</h1>','<p>IPTV can offer flexible viewing across many devices, but choosing a provider responsibly requires more than comparing price or a channel count. Global viewers should review licensing, compatibility, connection limits, quality, support and service terms before subscribing.</p>']
            secs=SECS[i:]+SECS[:i]
            for n,(h,p) in enumerate(secs):
              parts += [f'<h2>{html.escape(h)}</h2>',f'<p>{html.escape(p)}</p>']
              if n<5:
                a,u=LINKS[n]
                phrases=[
                  f'Viewers researching a <a href="{u}">{a}</a> can review Alpha IPTV as one option while independently confirming licensing, regional availability and service conditions.',
                  f'When comparing an <a href="{u}">{a}</a>, check device support, simultaneous connections and published terms before payment.',
                  f'Anyone considering a <a href="{u}">{a}</a> should verify content rights, supported devices and regional restrictions that apply to their location.',
                  f'For users comparing a <a href="{u}">{a}</a>, Alpha IPTV can be assessed alongside other providers based on compatibility, support and transparent terms.',
                  f'A buyer evaluating an <a href="{u}">{a}</a> should compare licensing information, connection limits, pricing and cancellation conditions.'
                ]
                parts.append('<p>'+phrases[n]+'</p>')
            return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+html.escape(TITLES[i])+'</title></head><body><main style="max-width:920px;margin:40px auto;padding:20px;font-family:Arial,sans-serif;line-height:1.8;color:#222">'+''.join(parts)+'</main></body></html>'
          H=[make(i) for i in range(8)]
          def verify(name,u):
            if not u:return None
            try:
              r=S.get(u,timeout=45,allow_redirects=True)
              src=html.unescape(r.content.decode('utf-8','ignore'))
              hrefs=len(re.findall(r'href=["\'][^"\']*https?://(?:www\.)?alphaiptv\.tn',src,re.I))
              exact=ANCHOR.lower() in re.sub(r'<[^>]+>',' ',src).lower()
              robots=' '.join(re.findall(r'<meta[^>]+(?:name=["\'](?:robots|googlebot)["\'])[^>]*content=["\']([^"\']*)',src,re.I)).lower()
              noindex='noindex' in robots or 'noindex' in r.headers.get('x-robots-tag','').lower()
              print('VERIFY',name,r.status_code,r.url,'HREFS',hrefs,'EXACT',int(exact),'NOINDEX',int(noindex))
              return r.url if r.status_code<400 and hrefs>=5 and exact and not noindex else None
            except Exception as e:print('VERIFY_ERR',name,repr(e));return None
          async def run():
            out=[]
            targets=[
              ('Notesh','notesh.ink','https://notesh.ink/',0,['Publish','Share','Create','Generate']),
              ('Yapp','yapp.page','https://yapp.page/',1,['Publish','Deploy','Create','Generate']),
              ('PublishMarkdown','publishmarkdown.com','https://publishmarkdown.com/',2,['Publish','Create','Share']),
              ('MarkdShare','markdshare.com','https://markdshare.com/',3,['Publish','Share','Create']),
              ('PageGate','pagegate.app','https://pagegate.app/',4,['Publish','Create','Deploy','Share']),
              ('PagePaste','pagepaste.com','https://pagepaste.com/',5,['Get my shareable link','Publish','Create']),
              ('PagedNet','paged.net','https://paged.net/',6,['Deploy Site','Deploy','Upload']),
              ('Fylo','fylo.host','https://fylo.host/html-viewer-online',7,['Publish & Share','Publish'])]
            async with async_playwright() as pw:
              b=await pw.chromium.launch(headless=True)
              for name,domain,start,i,buttons in targets:
                ctx=await b.new_context();p=await ctx.new_page();network=[];fn=f'/tmp/alpha3-{i}.html';open(fn,'w',encoding='utf-8').write(H[i])
                async def capture(resp):
                  try:
                    if resp.request.method in ('POST','PUT'):
                      txt=await resp.text()
                      if 'http' in txt:network.append(txt[:12000])
                  except:pass
                p.on('response',capture)
                try:
                  await p.goto(start,wait_until='domcontentloaded',timeout=45000);await p.wait_for_timeout(1200);print('PAGE',name,p.url,await p.title())
                  used=False
                  fis=p.locator('input[type=file]')
                  if await fis.count():
                    for k in range(await fis.count()):
                      try:await fis.nth(k).set_input_files(fn);used=True;print('FILE',name,k);break
                      except:pass
                  if not used:
                    for sel in ['textarea:visible','[contenteditable=true]:visible','.monaco-editor textarea','textarea','[contenteditable=true]']:
                      loc=p.locator(sel)
                      if await loc.count():
                        try:await loc.first.fill(H[i]);used=True;print('CONTENT',name,sel);break
                        except:pass
                  slug='alpha-iptv-'+secrets.token_hex(3)
                  for sel,val in [('input[placeholder*="title" i]',TITLES[i]),('input[name*="title" i]',TITLES[i]),('input[placeholder*="slug" i]',slug),('input[name*="slug" i]',slug),('input[placeholder*="name" i]',slug)]:
                    loc=p.locator(sel)
                    if await loc.count():
                      try:await loc.first.fill(val)
                      except:pass
                  await p.wait_for_timeout(700);clicked=False
                  for pat in buttons:
                    for role in ['button','link']:
                      loc=p.get_by_role(role,name=re.compile(pat,re.I))
                      if await loc.count():
                        try:await loc.first.click(timeout=8000);clicked=True;print('CLICK',name,pat);break
                        except Exception as e:print('CLICK_ERR',name,pat,str(e)[:100])
                    if clicked:break
                  await p.wait_for_timeout(5500)
                  cand=[]
                  if ((domain in p.url) or (name=='Fylo' and 'fylo.live' in p.url)) and p.url.rstrip('/')!=start.rstrip('/'):cand.append(p.url)
                  try:cand += await p.locator('a[href]').evaluate_all('els=>els.map(e=>e.href)')
                  except:pass
                  try:cand += await p.locator('input').evaluate_all('els=>els.map(e=>e.value).filter(v=>v && v.startsWith("http"))')
                  except:pass
                  try:cand += re.findall(r'https?://[^\s<>"\']+',await p.locator('body').inner_text())
                  except:pass
                  for t in network:cand += re.findall(r'https?://[^\s<>"\\]+',t)
                  print('CAND',name,cand[:25]);seen=set()
                  for u in cand:
                    u=u.strip().rstrip('.,);]}')
                    if u in seen:continue
                    seen.add(u)
                    allowed=(domain in u) or (name=='Fylo' and 'fylo.live' in u)
                    if not allowed:continue
                    if any(x in u for x in ['/login','/signup','/pricing','/privacy','/terms','/docs','/features','/contact']):continue
                    v=verify(name,u)
                    if v:out.append((name,v));break
                except Exception as e:print('BROWSER_ERR',name,repr(e))
                await ctx.close()
              await b.close()
            return out
          res=asyncio.run(run())
          print('ALPHA3_RESULTS_BEGIN')
          for n,u in res:print(n+'\t'+u)
          print('ALPHA3_RESULTS_END')
          print('ALPHA3_VALID_COUNT='+str(len(res)))
          print('ALPHA3_RESULTS_JSON='+json.dumps(res,ensure_ascii=False))
          PY