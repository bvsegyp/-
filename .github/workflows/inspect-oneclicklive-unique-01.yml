name: Inspect OneClickLive Endpoint
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: github.event.head_commit.message == 'Run OneClickLive endpoint inspection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_oneclicklive_unique.py
