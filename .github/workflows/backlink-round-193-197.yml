name: Backlink Round 193-197

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish backlink round 193-197'
    runs-on: ubuntu-latest
    steps:
      - name: Generate publish verify
        shell: bash
        run: |
          cat > /tmp/publish.py <<'PY'
          import requests,re,secrets,html,json
          H='https://smmfansfaster.com/'
          L=[('SMM Fans Faster',H),('SMM API','https://smmfansfaster.com/api'),('TikTok growth guide','https://smmfansfaster.com/blog/tiktok-followers'),('TikTok follower count','https://smmfansfaster.com/blog/numberoftiktokfollowers'),('Instagram followers guide','https://smmfansfaster.com/ar/blog/instagram-followers-website'),('Instagram algorithm guide','https://smmfansfaster.com/ar/blog/doesincreasingyourfollowersaffecttheinstagramalgorithmfindoutnow'),('FAQ','https://smmfansfaster.com/ar/faq')]
          titles=['How Creators Can Build a Stronger Social Media Growth Flywheel','A Practical Social Media Growth Strategy for Small Ecommerce Stores','How Local Businesses Can Measure Social Media Marketing More Effectively','A Better Social Media Testing Process for Marketing Teams','How Agencies Can Connect Social Promotion with Client Business Goals']
          angles=['creators balancing audience growth engagement and monetization','small ecommerce stores improving discovery product interest and sales','local businesses connecting content with calls messages and bookings','marketing teams running structured creative and distribution experiments','agencies aligning campaign activity with measurable client outcomes']
          def article(i):
            t=titles[i]; a=angles[i]
            body=f'''# {t}\n\nSocial media growth becomes more useful when it is designed around a measurable objective. This guide focuses on {a}. Instead of judging success through one visible number, teams can connect reach, engagement, profile activity, website traffic, inquiries, and conversion as stages in a single journey. That makes campaign decisions easier to explain and easier to improve.\n\nA strong plan begins by deciding what action matters after discovery. Depending on the account, that may be a follow, profile visit, direct message, product view, quote request, booking, or purchase. The chosen action should shape creative, platform mix, promotional support, destination pages, and reporting.\n\n## Start with audience intent\n\nFor {a}, useful content begins with real customer or audience needs. Search behavior, comments, reviews, sales questions, support requests, and competitor content can reveal recurring problems. These problems can be organized into repeatable content pillars such as education, demonstration, comparison, proof, objection handling, and conversion-focused communication.\n\nA repeatable content system reduces random posting while leaving room for experimentation. Teams can test different hooks, formats, examples, calls to action, and storytelling approaches without losing the strategic connection to audience intent.\n\n## Evaluate promotion as part of a wider system\n\nSome marketers compare third-party promotional services when they need another distribution layer. [SMM Fans Faster]({L[0][1]}) is one provider that can be researched. A sensible review should include service descriptions, supported platforms, delivery expectations, support, and how the service fits the campaign objective.\n\nTeams that handle recurring campaign activity may also review the [SMM API]({L[1][1]}). Automation can reduce repetitive work, but it should still include clear campaign naming, destination validation, ownership, error handling, and reporting.\n\n## Test TikTok with clear hypotheses\n\nTikTok can help teams learn quickly because creative performance is visible through retention, watch time, shares, profile activity, and repeat viewing. A strong test begins with a hypothesis. Marketers can compare hook styles, pacing, video length, demonstrations, captions, and calls to action while changing only a few variables at once.\n\nTeams researching audience-building approaches can review the [TikTok growth guide]({L[2][1]}) and the [TikTok follower count]({L[3][1]}) resource. These should be interpreted alongside first-party analytics so follower growth remains connected to useful audience behavior.\n\n## Use Instagram as a multi-format journey\n\nInstagram gives marketers several surfaces with different strengths. Reels can support discovery, Stories can maintain interaction, carousels can educate, Highlights can organize recurring information, and pinned posts can explain the offer. These formats work better when each has a defined role.\n\nBusinesses comparing follower-related options can review the [Instagram followers guide]({L[4][1]}). Teams can also consider the [Instagram algorithm guide]({L[5][1]}) alongside their own account data instead of assuming one metric alone controls distribution.\n\n## Improve the destination after increasing visibility\n\nMore attention does not automatically create more business value. Landing pages, profiles, product pages, and contact paths should continue the same promise made in the social content. The destination should load quickly, explain value clearly, provide trust signals, and make the next action easy to understand.\n\nFor {a}, this full-funnel view prevents marketers from overvaluing reach when the downstream experience is weak. If traffic increases but conversions remain flat, the team should review audience relevance, message continuity, offer clarity, page speed, trust, and calls to action.\n\n## Report by funnel stage\n\nAwareness metrics can include reach, impressions, views, retention, and shares. Consideration metrics can include profile visits, saves, direct messages, product views, and link clicks. Conversion metrics can include leads, bookings, purchases, subscriptions, and revenue where attribution is reliable.\n\nWeekly reviews can focus on creative performance and monthly reviews can focus on larger resource decisions. Every report should produce a next action: repeat a strong format, stop a weak test, change an audience, improve a destination, or adjust campaign allocation.\n\n## Keep a decision log\n\nA campaign decision log can record objective, audience, creative concept, platform, destination URL, promotion method, date, expected result, actual result, and next step. This creates a reusable learning archive that reduces repeated mistakes and improves team continuity.\n\nCross-platform insights also become easier to identify. A TikTok hook that improves retention may inspire an Instagram Reel. A landing-page problem discovered from Instagram traffic may affect users from other channels too. Documenting these patterns creates a stronger marketing system.\n\n## Review operational details before scaling\n\nAny third-party supplier should be understood before becoming part of a repeatable workflow. The [FAQ]({L[6][1]}) can help marketers review common operational questions before ordering. Similar diligence should be applied to any provider: understand the service, define its role, decide how results will be measured, and keep quality controls in place.\n\nSustainable social growth combines audience understanding, useful content, careful distribution, analytics, and conversion optimization. For {a}, the strongest process is one that consistently turns attention into relevant engagement, qualified traffic, and measurable outcomes.'''
            return body
          arts=[article(i) for i in range(5)]
          for i,a in enumerate(arts):
            wc=len(re.findall(r"\b[\w'-]+\b",a)); lc=a.count('smmfansfaster.com'); print('ARTICLE',i+1,'WORDS',wc,'LINKS',lc)
            if not (800<=wc<=1200 and lc>=7): raise SystemExit('VALIDATION_FAIL')
          def mdhtml(md):
            out=[]
            for p in re.split(r'\n\s*\n',md):
              p=p.strip()
              if not p: continue
              if p.startswith('# '): out.append('<h1>'+html.escape(p[2:])+'</h1>'); continue
              if p.startswith('## '): out.append('<h2>'+html.escape(p[3:])+'</h2>'); continue
              e=html.escape(p); e=re.sub(r'\[([^\]]+)\]\((https?://[^)]+)\)',lambda m:f'<a href="{html.escape(m.group(2),quote=True)}">{html.escape(m.group(1))}</a>',e); out.append('<p>'+e.replace('\n',' ')+'</p>')
            return '<html><body>'+''.join(out)+'</body></html>'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'}); final=[]
          def verify(u):
            try:
              r=s.get(u,timeout=30,allow_redirects=True); c=r.text.count('smmfansfaster.com'); print('VERIFY',r.status_code,c,u); return r.status_code<400 and c>=6
            except Exception as e: print('VERIFY_ERR',repr(e)); return False
          try:
            r=s.post('https://md.page/api/publish',json={'markdown':arts[0]},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('MDPAGE_ERR',repr(e))
          try:
            r=s.post('https://markdown.page/api/publish',data=arts[1].encode(),headers={'Accept':'text/plain'},timeout=30); u=r.text.strip().splitlines()[0] if r.ok else '';
            if u and verify(u): final.append(u)
          except Exception as e: print('MARKDOWN_ERR',repr(e))
          try:
            r=s.post('https://yeet.md/api/share',json={'content':arts[2]},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('YEET_ERR',repr(e))
          try:
            r=s.post('https://mdview.io/api/public/publish',json={'title':titles[3],'content':arts[3],'expiresInDays':30},timeout=30); d=r.json(); u=d.get('shareUrl') or d.get('viewerUrl','');
            if u and verify(u): final.append(u)
          except Exception as e: print('MDVIEW_ERR',repr(e))
          try:
            r=s.post('https://output.pub/api/publish',json={'content':arts[4],'format':'markdown'},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('OUTPUT_ERR',repr(e))
          if len(final)<3: raise SystemExit('TOO_FEW_VERIFIED')
          print('URLS_BEGIN'); [print(u) for u in final]; print('URLS_END')
          PY
          python /tmp/publish.py
