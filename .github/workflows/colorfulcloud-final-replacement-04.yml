name: Colorful Cloud Final Replacement 04
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run Colorful Cloud final replacement 04'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify replacements
        run: python scripts/colorfulcloud_final_replacement_04.py
