name: Publish ShareHTML and Inspect Dochost 2012
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run ShareHTML Dochost 2012'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and inspect
        run: python3 scripts/publish_sharehtml_inspect_dochost_2012.py | tee publish.log
      - name: Show URLs
        run: grep '^RESULT_URL=https://' publish.log || true
