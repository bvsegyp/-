name: BVS Money Counting Domains 03 Fast
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run BVS fast money counting backlink batch 03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
      - name: Publish and verify in parallel
        run: python scripts/bvs_money_counting_domains_03_fast.py
