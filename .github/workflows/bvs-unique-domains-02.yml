name: BVS Unique Domains 02

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run BVS unique domains 02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Publish and verify BVS second unique-domain batch
        run: python scripts/bvs_unique_domains_02.py
