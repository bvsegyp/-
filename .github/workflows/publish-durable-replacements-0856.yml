name: Publish Durable Replacements 0856

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish durable replacements 0856'
    runs-on: ubuntu-latest
    steps:
      - name: Publish durable long-form replacements
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://raw.githubusercontent.com/bvsegyp/-/main/.github/workflows/publish-10-long-backlinks-now.yml' -o /tmp/base.yml
          python - <<'PY'
          import re,textwrap,requests,json
          y=open('/tmp/base.yml',encoding='utf-8').read()
          m=re.search(r"cat > /tmp/publish\.py <<'PY'\n(.*?)\n\s*PY\n\s*python /tmp/publish\.py",y,re.S)
          code=textwrap.dedent(m.group(1)); gen=code.split('results=[]',1)[0]
          gen=gen.replace('A Complete Social Media Growth Framework for Agencies and Brands','Long-Form Social Media Strategy: Measurement, Quality, and Sustainable Growth')
          gen=gen.replace('How to Build a Sustainable TikTok Growth System in 2026','TikTok Growth Management: A Long-Form Guide for Marketing Teams')
          gen=gen.replace('Instagram Growth Strategy: From Reach to Real Conversions','Instagram Growth Management: Discovery, Engagement, and Conversion Systems')
          ns={}; exec(gen,ns); arts=ns['articles']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'})
          def check(url):
              try:
                  r=s.get(url,timeout=30,allow_redirects=True)
                  hrefs=len(re.findall(r'href=["\']https://smmfansfaster\.com[^"\']*["\']',r.text,re.I)); total=r.text.count('smmfansfaster.com')
                  print('VERIFY',url,'STATUS',r.status_code,'HREFS',hrefs,'TOTAL',total)
                  return r.status_code<400 and (hrefs>=6 or total>=6)
              except Exception as e: print('VERIFY_ERR',url,repr(e)); return False
          results=[]
          # paster.sh - no auth, never expiry
          try:
              r=s.post('https://api.paster.sh/v1/create',json={'content':arts[0],'title':'Long-Form Social Media Strategy: Measurement, Quality, and Sustainable Growth','visibility':'public','syntax':'markdown','expiration':'never'},timeout=30)
              print('PASTER_RAW',r.text[:500]); d=r.json(); u=d.get('url',''); print('PASTER_URL='+u)
              if u and check(u): results.append(['paster.sh',u])
          except Exception as e: print('PASTER_ERR',repr(e))
          # markdshare new domain candidate
          try:
              r=s.post('https://markdshare.com/api/share',json={'title':'TikTok Growth Management: A Long-Form Guide for Marketing Teams','markdown':arts[1]},timeout=30)
              print('MARKDSHARE_RAW',r.text[:500]); d=r.json(); u=d.get('url') or d.get('shareUrl',''); print('MARKDSHARE_URL='+u)
              if u and check(u): results.append(['markdshare.com',u])
          except Exception as e: print('MARKDSHARE_ERR',repr(e))
          # html-docs fallback, previously used domain but durable anonymous share
          try:
              r=s.post('https://www.html-docs.com/api/v1/docs',data=arts[2].encode('utf-8'),headers={'Content-Type':'text/markdown'},timeout=30)
              print('HTMLDOCS_RAW',r.text[:500]); d=r.json(); u=d.get('url',''); print('HTMLDOCS_URL='+u)
              if u and check(u): results.append(['html-docs.com',u])
          except Exception as e: print('HTMLDOCS_ERR',repr(e))
          print('VALID_RESULTS_JSON='+json.dumps(results)); print('VALID_COUNT='+str(len(results)))
          PY
