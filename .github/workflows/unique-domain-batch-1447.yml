name: Unique Domain Backlink Batch 1447

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique-domain backlink batch 1447'
    runs-on: ubuntu-latest
    steps:
      - name: Publish and verify unique-domain backlinks
        shell: bash
        run: |
          set -e
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/run.py <<'PY'
          import asyncio,re,json,html,random,string
          from playwright.async_api import async_playwright

          TARGETS=[
            ('htmlput.com','https://htmlput.com/','HTMLPUT'),
            ('pagepaste.com','https://pagepaste.com/','PagePaste'),
            ('showyourcode.app','https://www.showyourcode.app/','ShowYourCode'),
            ('pagegate.app','https://pagegate.app/','PageGate'),
            ('yapp.page','https://yapp.page/','Yapp'),
          ]
          BACK='https://smmfansfaster.com/'
          paras=[
          ('Start with a measurable objective','Social media growth works best when the business goal is explicit. Awareness, qualified traffic, lead generation, sales, bookings, and retention each require different creative choices and reporting methods. Teams that define the outcome first can choose better channels and avoid treating follower counts as the only meaningful result.'),
          ('Research audience intent','Useful content starts with real audience signals. Search queries, direct messages, support questions, sales conversations, competitor comments, and frequently asked questions all reveal recurring needs. Those insights help marketers create more relevant topics, stronger hooks, and clearer calls to action.'),
          ('Build repeatable content pillars','A sustainable publishing system usually relies on a few recurring themes such as education, comparisons, demonstrations, customer questions, case studies, and behind-the-scenes material. Each pillar should have a role in the buyer journey so that the content calendar remains structured without becoming repetitive.'),
          ('Use short-form video for testing','Short-form video can quickly reveal which hooks, formats, and angles deserve more investment. Watch time, completion rate, saves, shares, profile visits, clicks, and downstream conversions provide a useful feedback loop for improving creative decisions over time.'),
          ('Connect reach to a strong destination','Extra reach only creates business value when the profile or landing page is ready to convert attention into action. Clear positioning, proof, fast loading, strong mobile usability, and a simple next step all matter. Marketers comparing external support options can also evaluate <a href="https://smmfansfaster.com/">SMM Fans Faster</a> as one provider within a broader due-diligence process.'),
          ('Measure the complete funnel','Awareness metrics explain discovery, consideration metrics explain interest, and conversion metrics explain business impact. Looking at all three stages prevents teams from overreacting to one isolated number and makes it easier to find the true bottleneck in the customer journey.'),
          ('Document experiments','Every meaningful test should record the hypothesis, audience, creative format, publishing conditions, result, and next action. Consistent documentation makes monthly reviews more useful and helps teams build a reusable knowledge base rather than relying on memory.'),
          ('Protect long-term trust','Growth tactics should not depend on deceptive endorsements, fake reviews, hacked websites, or spam comments. Sustainable performance comes from useful content, transparent promotion, strong customer experience, and disciplined measurement.'),
          ('Improve conversion after the click','Traffic quality matters as much as traffic volume. Teams should review message consistency, page speed, proof, forms, checkout friction, and mobile experience so that increased visibility has a realistic chance of producing business outcomes.'),
          ('Review allocation regularly','Monthly strategy reviews should compare channels, formats, audiences, costs, and outcomes. Resources can then move toward the combinations that repeatedly create useful attention and away from activity that produces little measurable value.')]

          def article(label):
              out=[f'# Social Media Growth Strategy for {label}: Content, Reach, and Conversion','', 'Sustainable social media growth comes from a connected system rather than one isolated tactic. This guide explains a practical framework for brands and agencies that want to improve visibility while keeping business outcomes, measurement, and trust at the center of the strategy.','']
              for i,(h,p) in enumerate(paras):
                  out += [f'## {h}','']
                  text=(p+' '+p+' '+p) if i%2==0 else (p+' '+p)
                  out += [text,'']
              out += ['## Final perspective','', 'A durable growth program connects clear objectives, audience understanding, repeatable content, structured testing, disciplined reporting, and a strong conversion destination. External tools can support that work, but the lasting advantage comes from learning faster and improving from evidence.']
              text='\n'.join(out)
              while len(re.findall(r"\b[\w'-]+\b",text))<1250:
                  text += '\n\n## Additional operational note\n\nTeams should keep a simple campaign record covering objectives, audiences, formats, publishing dates, distribution methods, costs, and measured outcomes. That record improves handoffs, reporting, and quality control across multiple campaigns.'
              return text

          def to_html(mark):
              parts=[]
              for line in mark.splitlines():
                  if line.startswith('# '): parts.append('<h1>'+html.escape(line[2:])+'</h1>')
                  elif line.startswith('## '): parts.append('<h2>'+html.escape(line[3:])+'</h2>')
                  elif line.strip():
                      safe=html.escape(line,quote=False)
                      safe=safe.replace('&lt;a href="https://smmfansfaster.com/"&gt;SMM Fans Faster&lt;/a&gt;','<a href="https://smmfansfaster.com/">SMM Fans Faster</a>')
                      parts.append('<p>'+safe+'</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><title>Social Media Growth Strategy</title></head><body>'+''.join(parts)+'</body></html>'

          async def publish(browser,domain,url,label,idx):
              page=await browser.new_page()
              content=to_html(article(label))
              print(domain,'WORDS',len(re.findall(r"\b[\w'-]+\b",content)),'TARGET_LINKS',content.count('href="https://smmfansfaster.com/"'))
              try:
                  await page.goto(url,wait_until='domcontentloaded',timeout=45000)
                  await page.wait_for_timeout(2500)
                  # optional paste/code mode
                  for pat in ['Paste HTML','paste HTML','Paste Code','or paste HTML code','paste your HTML']:
                      el=page.get_by_text(re.compile(pat,re.I))
                      if await el.count():
                          try: await el.first.click(timeout=2500); await page.wait_for_timeout(500); break
                          except: pass
                  title=page.locator('input[placeholder*="title" i]:visible, input[name*="title" i]:visible, input[placeholder*="name" i]:visible')
                  if await title.count():
                      try: await title.first.fill('Social Media Growth Strategy')
                      except: pass
                  editors=page.locator('textarea:visible')
                  filled=False
                  if await editors.count():
                      best=None; area=-1
                      for i in range(await editors.count()):
                          e=editors.nth(i)
                          try:
                              box=await e.bounding_box(); a=(box['width']*box['height']) if box else 0
                              if a>area: best=e; area=a
                          except: pass
                      if best: await best.fill(content); filled=True
                  if not filled:
                      ce=page.locator('[contenteditable="true"]:visible')
                      if await ce.count(): await ce.first.fill(content); filled=True
                  if not filled:
                      fi=page.locator('input[type="file"]')
                      if await fi.count():
                          path=f'/tmp/{idx}.html'; open(path,'w',encoding='utf-8').write(content); await fi.first.set_input_files(path); filled=True
                  if not filled:
                      print(domain,'NO_INPUT'); await page.close(); return None
                  await page.wait_for_timeout(800)
                  clicked=False
                  for pat in ['Host','Get my shareable link','Generate link','Generate Link','Generate Live Page','Deploy Page','Deploy','Publish','Share','Create Link','Upload','Generate']:
                      btn=page.get_by_role('button',name=re.compile(pat,re.I))
                      if await btn.count():
                          try: await btn.first.click(timeout=5000); clicked=True; break
                          except: pass
                      txt=page.get_by_text(re.compile('^'+re.escape(pat)+'$',re.I))
                      if await txt.count():
                          try: await txt.first.click(timeout=5000); clicked=True; break
                          except: pass
                  if not clicked:
                      print(domain,'NO_BUTTON'); await page.close(); return None
                  await page.wait_for_timeout(7000)
                  cands=[]
                  cur=page.url
                  if cur.rstrip('/')!=url.rstrip('/'): cands.append(cur)
                  for a in await page.locator('a[href^="http"]').all():
                      try:
                          h=await a.get_attribute('href')
                          if h and h not in cands: cands.append(h)
                      except: pass
                  body=await page.locator('body').inner_text()
                  for m in re.findall(r'https?://[^\s)\]<>"\']+',body):
                      m=m.rstrip('.,')
                      if m not in cands: cands.append(m)
                  print(domain,'CANDIDATES',cands[:12])
                  for cand in cands[:20]:
                      try:
                          vp=await browser.new_page()
                          await vp.goto(cand,wait_until='domcontentloaded',timeout=30000)
                          await vp.wait_for_timeout(2500)
                          hrefs=await vp.locator('a[href*="smmfansfaster.com"]').count()
                          final=vp.url
                          print(domain,'VERIFY',final,'HREFS',hrefs)
                          await vp.close()
                          if hrefs==1:
                              await page.close(); return final
                      except Exception as e: print(domain,'VERIFY_ERR',cand,repr(e))
              except Exception as e: print(domain,'ERR',repr(e))
              await page.close(); return None

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  results=[]
                  for i,t in enumerate(TARGETS):
                      u=await publish(b,*t,i)
                      if u: results.append([t[0],u])
                  await b.close()
                  print('VALID_RESULTS_JSON='+json.dumps(results))
                  print('VALID_COUNT='+str(len(results)))
          asyncio.run(main())
          PY
          python /tmp/run.py
