name: GoodIPTVServices French Backlinks Batch 05 Six New Domains
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run GoodIPTVServices French backlink batch 05 six new domains'
    runs-on: ubuntu-latest
    steps:
      - name: Install browser tools
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
      - name: Publish six fresh domains
        shell: bash
        run: |
          python - <<'PY'
          import asyncio,re,html,json,os
          from playwright.async_api import async_playwright
          SITE='https://goodiptvservices.com/'
          ANCHOR='abonnement IPTV'
          LINKS=[('abonnement IPTV',SITE),('abonnement IPTV premium',SITE),('meilleur abonnement IPTV',SITE),('service IPTV',SITE),('fournisseur IPTV',SITE)]
          TITLES=[
            'Abonnement IPTV : comment comparer les offres avant de souscrire',
            'IPTV premium : compatibilité, stabilité et support à vérifier',
            'Meilleur abonnement IPTV : critères pratiques pour bien choisir',
            'Service IPTV : qualité, appareils et connexions simultanées',
            'Fournisseur IPTV : comparer prix, stabilité et assistance',
            'Abonnement IPTV en 2026 : guide de comparaison pour les utilisateurs'
          ]
          SECS=[
            ('Compatibilité des appareils','Avant de souscrire, vérifiez la compatibilité avec Smart TV, box Android, ordinateur et mobile afin de limiter les problèmes de configuration.'),
            ('Stabilité du streaming','La qualité dépend de la stabilité des serveurs, de la connexion internet et du réseau domestique. Une résolution élevée n’est utile que si la diffusion reste fluide.'),
            ('Connexions simultanées','Les foyers qui utilisent plusieurs écrans doivent vérifier combien de connexions peuvent fonctionner en même temps et dans quelles conditions.'),
            ('Qualité et contenu','Il est préférable de comparer la qualité réelle et la pertinence du contenu plutôt que de se concentrer uniquement sur le nombre de chaînes annoncé.'),
            ('Support client','Un support accessible facilite l’activation, la configuration et la résolution des problèmes techniques.'),
            ('Prix et durée','Comparez le coût total, la durée, les fonctionnalités incluses et les conditions de renouvellement avant de payer.'),
            ('Connexion internet','Une connexion stable et un Wi-Fi correctement configuré ont un impact direct sur la fluidité du service.'),
            ('Conditions du service','Lisez les modalités d’utilisation et de remboursement avant de souscrire afin d’éviter les mauvaises surprises.'),
            ('Conclusion','Comparer compatibilité, stabilité, connexions, support, prix et conditions permet de choisir une offre IPTV plus adaptée.')]
          def md(i):
            out=[f'# {TITLES[i]}','','Choisir un service IPTV demande de comparer plusieurs éléments importants avant de souscrire. La compatibilité, la stabilité, les connexions, le support et le prix doivent être examinés ensemble.','']
            secs=SECS[i:]+SECS[:i]
            for n,(h,p) in enumerate(secs):
              out += [f'## {h}','',p,'']
              if n<5:
                a,u=LINKS[n]
                out += [f'Pour comparer un [{a}]({u}), Good IPTV Services présente ses offres et informations de service parmi les options disponibles.','']
            return '\n'.join(out)
          def htm(i):
            text=md(i);parts=[]
            for b in re.split(r'\n\s*\n',text):
              b=b.strip()
              if not b:continue
              if b.startswith('# '):parts.append('<h1>'+html.escape(b[2:])+'</h1>');continue
              if b.startswith('## '):parts.append('<h2>'+html.escape(b[3:])+'</h2>');continue
              pos=0;x=[]
              for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',b):
                x.append(html.escape(b[pos:m.start()]));x.append('<a href="'+html.escape(m.group(2),quote=True)+'">'+html.escape(m.group(1))+'</a>');pos=m.end()
              x.append(html.escape(b[pos:]));parts.append('<p>'+''.join(x)+'</p>')
            return '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+html.escape(TITLES[i])+'</title></head><body><main style="max-width:920px;margin:40px auto;padding:20px;font-family:Arial,sans-serif;line-height:1.8;color:#222">'+''.join(parts)+'</main></body></html>'
          M=[md(i) for i in range(6)];H=[htm(i) for i in range(6)]
          async def verify(browser,name,u):
            p=await browser.new_page();resp=None
            try:
              resp=await p.goto(u,wait_until='domcontentloaded',timeout=45000);await p.wait_for_timeout(1800)
              n=0;exact=False;robots=''
              frames=[p.main_frame]+[f for f in p.frames if f!=p.main_frame]
              for fr in frames:
                try:n+=await fr.locator('a[href*="goodiptvservices.com"]').count()
                except:pass
                try:
                  c=(await fr.content()).lower()
                  if ANCHOR.lower() in c:exact=True
                except:pass
              try:robots=(await p.locator('meta[name="robots"],meta[name="googlebot"]').evaluate_all("els=>els.map(e=>e.content||'').join(' ')")).lower()
              except:pass
              xrob=''
              try:xrob=(await resp.all_headers()).get('x-robots-tag','').lower() if resp else ''
              except:pass
              noindex='noindex' in robots or 'noindex' in xrob;final=p.url
              print('VERIFY',name,final,'HREFS',n,'EXACT',int(exact),'NOINDEX',int(noindex))
              await p.close();return final if n>=5 and exact and not noindex else None
            except Exception as e:
              print('VERIFY_ERR',name,repr(e))
              try:await p.close()
              except:pass
              return None
          async def collect_candidates(p,domain,start,network):
            cand=[]
            if domain in p.url and p.url.rstrip('/')!=start.rstrip('/'):cand.append(p.url)
            try:cand += [x for x in await p.locator('a[href]').evaluate_all('els=>els.map(e=>e.href)') if isinstance(x,str) and domain in x]
            except:pass
            try:cand += [x for x in await p.locator('input').evaluate_all('els=>els.map(e=>e.value).filter(Boolean)') if isinstance(x,str) and domain in x]
            except:pass
            try:cand += [x for x in re.findall(r'https?://[^\s<>"\']+',await p.locator('body').inner_text()) if domain in x]
            except:pass
            for t in network:cand += [x for x in re.findall(r'https?://[^\s<>"\\]+',t) if domain in x]
            out=[];seen=set()
            for u in cand:
              u=u.strip().rstrip('.,);]}')
              if u.startswith('//'):u='https:'+u
              if not u.startswith('http') and domain in u:u='https://'+u.lstrip('/')
              if u not in seen:seen.add(u);out.append(u)
            return out
          async def generic(browser,name,domain,start,i,mode='html',force_file=False):
            p=await browser.new_page();network=[]
            async def cap(resp):
              try:
                if resp.request.method in ('POST','PUT'):
                  t=await resp.text()
                  if 'http' in t:network.append(t[:10000])
              except:pass
            p.on('response',cap)
            try:
              await p.goto(start,wait_until='domcontentloaded',timeout=45000);await p.wait_for_timeout(1200)
              content=M[i] if mode=='md' else H[i];filled=False
              for sel in ['input[placeholder*=title i]','input[name*=title i]']:
                loc=p.locator(sel)
                if await loc.count():
                  try:await loc.first.fill(TITLES[i])
                  except:pass
              if force_file:
                fi=p.locator('input[type=file]')
                if await fi.count():
                  ext='md' if mode=='md' else 'html';fn=f'/tmp/goodiptv-{name}.{ext}';open(fn,'w',encoding='utf-8').write(content)
                  try:await fi.first.set_input_files(fn);filled=True
                  except:pass
              if not filled:
                ta=p.locator('textarea:visible')
                if await ta.count():
                  # choose largest visible textarea
                  best=None;area=-1
                  for j in range(await ta.count()):
                    try:
                      e=ta.nth(j);bb=await e.bounding_box();a=bb['width']*bb['height'] if bb else 0
                      if a>area:best=e;area=a
                    except:pass
                  if best:
                    try:await best.fill(content);filled=True
                    except:pass
              if not filled:
                ce=p.locator('[contenteditable=true]:visible')
                if await ce.count():
                  try:await ce.first.fill(content);filled=True
                  except:pass
              if not filled:
                fi=p.locator('input[type=file]')
                if await fi.count():
                  fn=f'/tmp/goodiptv-{name}.html';open(fn,'w',encoding='utf-8').write(H[i])
                  try:await fi.first.set_input_files(fn);filled=True
                  except:pass
              if not filled:
                print(name,'NO_INPUT');await p.close();return None
              for pat in ['Generate link','Generate Link','Get my shareable link','Get shareable link','Publish & Share','Publish','Share Note','Share','Deploy','Upload','Create Bin','Create','Save','Post','View Page']:
                loc=p.get_by_role('button',name=re.compile(pat,re.I))
                if await loc.count():
                  try:await loc.first.click(timeout=7000);break
                  except:pass
              await p.wait_for_timeout(4500)
              cand=await collect_candidates(p,domain,start,network)
              print('CAND',name,cand[:20])
              for u in cand:
                if any(x in u for x in ['/login','/signup','/register','/pricing','/privacy','/terms','/docs']):continue
                v=await verify(browser,name,u)
                if v:await p.close();return v
            except Exception as e:print(name,'ERR',repr(e))
            try:await p.close()
            except:pass
            return None
          async def storage(browser,i):
            p=await browser.new_page();network=[]
            async def cap(resp):
              try:
                if resp.request.method in ('POST','PUT'):
                  t=await resp.text();network.append(t[:12000])
              except:pass
            p.on('response',cap)
            try:
              await p.goto('https://storagebin.link/',wait_until='domcontentloaded',timeout=45000);await p.wait_for_timeout(1200)
              for txt in ['Create a Bin','Try it now']:
                for role in ['link','button']:
                  loc=p.get_by_role(role,name=re.compile(txt,re.I))
                  if await loc.count():
                    try:await loc.first.click();await p.wait_for_timeout(800);break
                    except:pass
              ta=p.locator('textarea:visible')
              if await ta.count():await ta.first.fill(H[i])
              sels=p.locator('select')
              for j in range(await sels.count()):
                try:
                  opts=await sels.nth(j).locator('option').all_text_contents()
                  for o in opts:
                    if 'html' in o.lower():await sels.nth(j).select_option(label=o);break
                except:pass
              for pat in ['Create a Bin','Create Bin','Save','Publish','Create']:
                loc=p.get_by_role('button',name=re.compile(pat,re.I))
                if await loc.count():
                  try:await loc.first.click(timeout=7000);break
                  except:pass
              await p.wait_for_timeout(4000)
              cand=[]
              if '/bin/view/' in p.url:cand.append(p.url)
              try:cand += [x for x in await p.locator('a[href]').evaluate_all('els=>els.map(e=>e.href)') if '/bin/view/' in x]
              except:pass
              for t in network:cand += [x for x in re.findall(r'https?://[^\s<>"\\]+',t) if 'storagebin.link/bin/view/' in x]
              seen=set()
              for u in cand:
                u=u.strip().rstrip('.,);]}')
                if u in seen:continue
                seen.add(u);v=await verify(browser,'StorageBin',u)
                if v:await p.close();return v
            except Exception as e:print('STORAGE_ERR',repr(e))
            try:await p.close()
            except:pass
            return None
          async def main():
            async with async_playwright() as pw:
              b=await pw.chromium.launch(headless=True);out=[]
              targets=[
                ('Notesh','notesh.ink','https://notesh.ink/',0,'md',False),
                ('PageGate','pagegate.app','https://pagegate.app/',1,'html',True),
                ('Paste.page','paste.page','https://paste.page/',2,'html',False),
                ('PagePaste','pagepaste.com','https://pagepaste.com/',3,'html',True),
                ('Fylo','fylo.live','https://fylo.host/html-viewer-online',4,'html',True)]
              for t in targets:
                u=await generic(b,*t)
                if u:out.append((t[0],u))
              u=await storage(b,5)
              if u:out.append(('StorageBin',u))
              print('GOODIPTV5_RESULTS_BEGIN')
              for n,u in out:print(n+'\t'+u)
              print('GOODIPTV5_RESULTS_END')
              print('GOODIPTV5_VALID_COUNT='+str(len(out)))
              print('GOODIPTV5_RESULTS_JSON='+json.dumps(out,ensure_ascii=False))
              await b.close()
          asyncio.run(main())
          PY