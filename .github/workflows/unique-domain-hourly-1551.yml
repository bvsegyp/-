name: Unique Domain Backlinks 1551
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique-domain backlink batch 1551'
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified backlinks
        shell: bash
        run: |
          set -e
          python -m pip install --quiet playwright requests
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/run.py <<'PY'
          import asyncio,re,json,requests,html
          from playwright.async_api import async_playwright

          TARGETS=[
            ('publishmarkdown.com','https://publishmarkdown.com/','https://smmfansfaster.com/api','SMM API resources'),
            ('noterift.com','https://noterift.com/','https://smmfansfaster.com/faq','SMM Fans Faster FAQ'),
            ('htmldrop.app','https://htmldrop.app/','https://smmfansfaster.com/smm-api-integration','SMM API integration'),
          ]

          paras=[
          ('Start with a measurable objective','A dependable social media growth plan starts with a concrete business outcome. Teams may be trying to improve awareness, qualified traffic, lead generation, sales, retention, or support efficiency. Defining the outcome first makes every later decision easier because platform selection, content formats, distribution, and reporting can all be evaluated against the same goal.'),
          ('Understand audience intent','Audience research should combine search behavior, customer questions, comments, direct messages, sales conversations, support tickets, and competitor analysis. These signals show what people are actually trying to accomplish and help teams create content that answers real needs instead of publishing generic material with no connection to demand.'),
          ('Build repeatable content pillars','A sustainable publishing system usually relies on several repeatable themes such as education, product demonstrations, comparisons, frequently asked questions, case studies, industry commentary, and practical tutorials. Clear pillars reduce planning friction while allowing enough variety to keep the audience interested over time.'),
          ('Use short-form content for testing','Short-form posts and videos provide rapid feedback on hooks, topics, positioning, and calls to action. Teams can compare watch time, completion rate, saves, shares, comments, profile visits, clicks, and downstream conversions to identify which ideas deserve deeper investment and which should be retired.'),
          ('Connect promotion to a strong destination','Extra reach only creates value when the destination is ready to convert attention into action. Landing pages and profiles need clear positioning, credible proof, mobile usability, fast load time, useful information, and a simple next step. Promotion works best when it supports a strong customer journey rather than trying to replace it.'),
          ('Measure the whole funnel','Reach and impressions explain discovery, while saves, profile visits, and clicks indicate stronger interest. Leads, purchases, bookings, and revenue reveal business impact. Looking at these stages together helps teams diagnose whether the main constraint is creative quality, audience fit, landing-page performance, or the offer itself.'),
          ('Document experiments','Each experiment should include a hypothesis, target audience, creative concept, publishing conditions, measured result, and next action. A consistent review process turns individual campaigns into a knowledge base that improves future decisions and helps multiple team members work from the same evidence.'),
          ('Protect trust while scaling','Sustainable growth depends on customer trust. Brands should avoid deceptive endorsements, fake reviews, hacked websites, spam comments, and tactics that violate platform safeguards. Useful content, transparent promotion, reliable delivery, and accurate reporting create stronger long-term value than shortcuts that damage credibility.'),
          ('Improve conversion quality','Traffic volume is only part of the equation. Teams should also review page speed, message consistency, forms, checkout friction, proof, pricing clarity, and mobile experience. Small improvements after the click can often create more business value than simply increasing reach.'),
          ('Review strategy every month','Monthly reviews should compare platforms, creative formats, audiences, costs, and business outcomes. Resources can then move toward combinations that repeatedly produce useful results, while low-value activity can be reduced or redesigned.')]

          def article(target,anchor,label):
              out=[f'# Practical Social Media Growth Framework for {label}','',
              'Social media growth is more reliable when content, analytics, audience research, promotion, and conversion are treated as one connected system. The following framework is designed for teams that want to improve visibility while keeping measurable business outcomes and long-term trust at the center of the strategy.','']
              for i,(h,p) in enumerate(paras):
                  out += [f'## {h}','']
                  txt=(p+' '+p+' '+p) if i%2==0 else (p+' '+p)
                  if i==4: txt += f' Teams researching practical support resources can also review [{anchor}]({target}) as part of a broader comparison process. Any provider or technical resource should be evaluated for fit, transparency, compatibility, and relevance to the campaign objective.'
                  out += [txt,'']
              out += ['## Final perspective','', 'A strong social media program combines clear objectives, audience understanding, repeatable publishing, disciplined testing, accurate measurement, and a strong conversion destination. The biggest advantage comes from learning continuously and making better decisions from evidence instead of chasing isolated metrics.']
              text='\n'.join(out)
              while len(re.findall(r"\b[\w'-]+\b",text))<1250:
                  text += '\n\n## Additional operational note\n\nTeams should maintain a simple campaign record covering objectives, audiences, creative formats, publishing dates, distribution methods, costs, and measured outcomes. Consistent documentation improves handoffs, reporting quality, and decision-making across future campaigns.'
              return text

          def html_doc(md):
              lines=[]
              for ln in md.splitlines():
                  if ln.startswith('# '): lines.append('<h1>'+html.escape(ln[2:])+'</h1>')
                  elif ln.startswith('## '): lines.append('<h2>'+html.escape(ln[3:])+'</h2>')
                  elif ln.strip():
                      esc=html.escape(ln,quote=False)
                      esc=re.sub(r'\[([^\]]+)\]\((https://smmfansfaster\.com/[^)]*)\)',r'<a href="\2">\1</a>',esc)
                      lines.append('<p>'+esc+'</p>')
              return '<!doctype html><html><body>'+''.join(lines)+'</body></html>'

          results=[]
          # ShareHTML via public REST API.
          try:
              md=article('https://smmfansfaster.com/api','SMM API documentation','API-led social media operations')
              payload={'html':html_doc(md)}
              r=requests.post('https://share-html.com/api/v1/pages',json=payload,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
              print('share-html POST',r.status_code,r.text[:800])
              if r.ok:
                  data=r.json(); cand=data.get('url') or data.get('pageUrl') or data.get('publicUrl')
                  if cand:
                      vr=requests.get(cand,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
                      if vr.ok and len(re.findall(r'href=["\']https://smmfansfaster\.com/api["\']',vr.text))==1:
                          results.append(['pages.share-html.com',cand])
          except Exception as e: print('share-html ERR',repr(e))

          async def try_site(browser,domain,url,target,anchor):
              md=article(target,anchor,domain)
              page=await browser.new_page()
              try:
                  await page.goto(url,wait_until='domcontentloaded',timeout=45000)
                  await page.wait_for_timeout(2500)
                  fi=page.locator('input[type=file]')
                  editors=page.locator('textarea:visible')
                  ce=page.locator('[contenteditable=true]:visible')
                  if domain=='htmldrop.app' and await fi.count():
                      path='/tmp/drop.html'; open(path,'w',encoding='utf-8').write(html_doc(md)); await fi.first.set_input_files(path)
                  elif await editors.count():
                      await editors.first.fill(md)
                  elif await ce.count():
                      await ce.first.fill(md)
                  else:
                      print(domain,'NO_INPUT'); await page.close(); return
                  await page.wait_for_timeout(800)
                  clicked=False
                  for pat in ['Publish','Share','Create note','Create Note','Get a shareable URL','Upload']:
                      btn=page.get_by_role('button',name=re.compile(pat,re.I))
                      if await btn.count():
                          try: await btn.first.click(timeout=5000); clicked=True; break
                          except: pass
                  if not clicked:
                      for pat in ['Publish','Share','Start writing']:
                          t=page.get_by_text(re.compile(pat,re.I))
                          if await t.count():
                              try: await t.first.click(timeout=5000); clicked=True; break
                              except: pass
                  await page.wait_for_timeout(6000)
                  cands=[]
                  if page.url.rstrip('/')!=url.rstrip('/'): cands.append(page.url)
                  for a in await page.locator('a[href^="http"]').all():
                      try:
                          h=await a.get_attribute('href')
                          if h and h not in cands: cands.append(h)
                      except: pass
                  body=await page.locator('body').inner_text()
                  cands += [m.rstrip('.,') for m in re.findall(r'https?://[^\s<>"\']+',body) if m.rstrip('.,') not in cands]
                  print(domain,'CANDS',cands[:10])
                  for cand in cands[:12]:
                      try:
                          vp=await browser.new_page(); await vp.goto(cand,wait_until='domcontentloaded',timeout=30000); await vp.wait_for_timeout(2000)
                          n=await vp.locator(f'a[href="{target}"]').count(); final=vp.url; await vp.close()
                          if n==1:
                              results.append([re.sub(r'^www\.','',re.search(r'https?://([^/]+)',final).group(1)),final]); break
                      except Exception as e: print(domain,'VERIFY_ERR',repr(e))
              except Exception as e: print(domain,'ERR',repr(e))
              await page.close()

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  for t in TARGETS: await try_site(b,*t)
                  await b.close()
              print('VALID_RESULTS_JSON='+json.dumps(results))
              print('VALID_COUNT='+str(len(results)))
          asyncio.run(main())
          PY
          python /tmp/run.py
