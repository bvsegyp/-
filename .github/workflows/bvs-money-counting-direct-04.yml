name: BVS Money Counting Direct 04
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run BVS direct money counting backlink batch 04'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Publish and verify direct hosts
        run: python scripts/bvs_money_counting_direct_04.py
