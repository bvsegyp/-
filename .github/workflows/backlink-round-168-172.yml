      - name: Publish and verify
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/urls.txt
          R=$(jq -Rs '{content: ., format:"markdown"}' < /tmp/a1.md | curl -fsS -X POST https://output.pub/api/publish -H 'Content-Type: application/json' -d @-); U=$(printf '%s' "$R" | jq -r '.url'); echo "$U" >> /tmp/urls.txt
          R=$(jq -Rs '{markdown: .}' < /tmp/a2.md | curl -fsS -X POST https://md.page/api/publish -H 'Content-Type: application/json' -d @-); U=$(printf '%s' "$R" | jq -r '.url'); echo "$U" >> /tmp/urls.txt
          U=$(curl -fsS -H 'Accept: text/plain' https://markdown.page/api/publish --data-binary @/tmp/a3.md | tr -d '\r\n'); echo "$U" >> /tmp/urls.txt
          R=$(jq -Rs '{content: .}' < /tmp/a4.md | curl -fsS -X POST https://yeet.md/api/share -H 'Content-Type: application/json' -d @-); U=$(printf '%s' "$R" | jq -r '.url'); echo "$U" >> /tmp/urls.txt
          R=$(jq -Rs '{title:"Turning Social Media Attention Into Qualified Website Traffic",content:.,expiresInDays:30}' < /tmp/a5.md | curl -fsS -X POST https://mdview.io/api/public/publish -H 'Content-Type: application/json' -d @-); U=$(printf '%s' "$R" | jq -r '.shareUrl // .viewerUrl'); echo "$U" >> /tmp/urls.txt
          while IFS= read -r url; do
            test -n "$url"
            body=$(curl -fsSL "$url")
            count=$(printf '%s' "$body" | grep -o 'smmfansfaster.com' | wc -l)
            echo "VERIFIED count=$count url=$url"
            test "$count" -ge 6
          done < /tmp/urls.txt
      - name: Print verified URLs
        shell: bash
        run: cat /tmp/urls.txt
