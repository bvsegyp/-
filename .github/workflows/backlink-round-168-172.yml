          # Building Better Instagram and TikTok Campaign Reporting

          Reporting should help marketers make decisions, not simply collect screenshots and numbers. A useful social media report explains what happened, why it may have happened, and what the team should test next. This becomes especially important when a campaign combines organic content with paid or third-party promotion.

          The easiest way to organize reporting is by customer journey stage. Awareness metrics describe attention. Consideration metrics describe deeper interest. Conversion metrics describe business outcomes.

          ## Start with awareness

          Awareness metrics can include reach, impressions, unique viewers, video views, retention, completion rate, and shares. These numbers help teams understand whether the creative is earning attention and whether the platform is distributing it effectively.

          TikTok often gives marketers fast feedback on creative performance. Teams can compare different opening hooks, editing styles, video lengths, and topics. This guide on [growing TikTok followers](https://smmfansfaster.com/blog/tiktok-followers) can be used as one research resource during audience-growth planning.

          Follower count should not be read alone. This article about the [number of TikTok followers](https://smmfansfaster.com/blog/numberoftiktokfollowers) can help frame audience size alongside watch time, repeat viewers, profile visits, and conversions.

