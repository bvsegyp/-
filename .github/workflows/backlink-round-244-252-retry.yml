name: Backlink Round 244-252 Retry
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Retry backlink round 244-252'
    runs-on: ubuntu-latest
    steps:
      - name: Publish nine verified articles
        shell: bash
        run: |
          cat > /tmp/publish.py <<'PY'
          import requests,re,secrets,html,json
          H='https://smmfansfaster.com/'
          L=[('SMM Fans Faster',H),('SMM API','https://smmfansfaster.com/api'),('TikTok growth guide','https://smmfansfaster.com/blog/tiktok-followers'),('TikTok follower count','https://smmfansfaster.com/blog/numberoftiktokfollowers'),('TikTok views guide','https://smmfansfaster.com/blog/tiktok-views'),('Instagram followers guide','https://smmfansfaster.com/ar/blog/instagram-followers-website'),('Instagram algorithm guide','https://smmfansfaster.com/ar/blog/doesincreasingyourfollowersaffecttheinstagramalgorithmfindoutnow'),('FAQ','https://smmfansfaster.com/ar/faq')]
          titles=['Social Media Growth Planning for Lean Marketing Teams','How Brands Can Improve TikTok Performance Through Better Testing','Instagram Growth Strategy for Businesses Focused on Qualified Traffic','How Agencies Can Make Social Campaign Reporting More Actionable','A Practical Social Media Growth System for Ecommerce Stores','How Local Service Brands Can Turn Social Attention into Inquiries','A Structured Method for Comparing Social Media Growth Tactics','How Teams Can Coordinate Multi-Platform Social Media Campaigns','Social Promotion and Conversion Optimization for Growing Companies']
          angles=['lean teams working with limited resources','brands improving TikTok creative testing','businesses using Instagram for qualified traffic','agencies improving reporting and decisions','ecommerce stores connecting discovery to purchase intent','local service brands generating messages calls and bookings','marketers comparing growth tactics consistently','teams coordinating campaigns across several platforms','companies connecting promotion with conversion optimization']
          def article(i):
            a=angles[i]; t=titles[i]
            return f'''# {t}\n\nSocial media growth becomes much easier to manage when every activity is tied to a measurable objective. This guide focuses on {a}. Reach, followers, views, profile visits, website sessions, inquiries, and sales should not be treated as disconnected statistics. They represent stages in one customer journey, and the purpose of a strong marketing system is to understand how people move from discovery to meaningful action.\n\nA useful campaign begins by choosing the action that matters most after discovery. Depending on the business, that action may be a follow, profile visit, direct message, product view, quote request, booking, or purchase. Once the desired action is clear, the team can choose creative formats, platform priorities, promotional support, landing pages, and reporting metrics with a defined purpose.\n\n## Start with audience intent\n\nFor {a}, content planning should begin with real audience needs rather than posting volume. Search queries, customer reviews, comments, support requests, sales conversations, and competitor content can reveal recurring themes. These themes can be organized into educational content, demonstrations, comparisons, proof, objection handling, and conversion-focused communication.\n\nA repeatable content engine gives marketers structure without making every post identical. The strategic theme stays consistent while hooks, examples, storytelling styles, formats, and calls to action are tested. If one topic repeatedly creates strong retention, profile activity, or website clicks, teams can create additional variations instead of starting from zero each week.\n\n## Use promotion as one controlled layer\n\nSome marketers compare third-party promotional services when they want another distribution option. [SMM Fans Faster]({L[0][1]}) is one provider that can be researched during that comparison. A sensible evaluation should consider supported platforms, service descriptions, delivery expectations, support, and how the selected service fits the campaign objective. External promotion is most useful when it supports a clear strategy rather than replacing useful content.\n\nTeams with recurring operational needs may also review the [SMM API]({L[1][1]}). API-based workflows can reduce repetitive administration, but they should still include naming standards, destination checks, ownership, error handling, and reporting. Automation adds value when it strengthens an already reliable process.\n\n## Use TikTok as a structured testing environment\n\nTikTok can provide rapid feedback on creative ideas. Teams can test opening hooks, pacing, video length, demonstrations, captions, storytelling, and calls to action. Strong experiments begin with a hypothesis and change only a few variables at once, making differences in retention, shares, profile visits, and downstream behavior easier to interpret.\n\nMarketers researching audience development can review the [TikTok growth guide]({L[2][1]}), the [TikTok follower count]({L[3][1]}) resource, and the [TikTok views guide]({L[4][1]}). These references are most useful when they are compared with first-party analytics such as watch time, repeat viewing, profile activity, website sessions, and conversion.\n\n## Give Instagram formats different responsibilities\n\nInstagram combines several surfaces that can support different stages of the customer journey. Reels can support discovery, Stories can maintain regular interaction, carousels can educate, Highlights can organize important information, and pinned posts can explain the offer quickly. Assigning a clear role to each format makes the account easier for new visitors to understand.\n\nBusinesses comparing audience-growth options can review the [Instagram followers guide]({L[5][1]}). Teams can also consider the [Instagram algorithm guide]({L[6][1]}) alongside their own account analytics instead of assuming one metric alone determines distribution. Reach is affected by multiple signals, so decisions should be based on broader performance patterns.\n\n## Improve the experience after the social click\n\nVisibility creates limited value when the next step is weak. Landing pages, profile bios, product pages, contact paths, and checkout flows should continue the same promise made in social content. They should load quickly, communicate the offer clearly, provide relevant trust signals, and make the desired action easy to understand.\n\nFor {a}, measuring the complete path helps distinguish a reach problem from a conversion problem. If traffic increases while inquiries or sales remain flat, the team should review audience fit, offer clarity, page speed, message continuity, proof, and calls to action before simply increasing traffic further.\n\n## Separate awareness, consideration, and conversion metrics\n\nAwareness metrics can include reach, impressions, views, watch time, and shares. Consideration metrics can include saves, profile visits, direct messages, product views, and link clicks. Conversion metrics can include leads, bookings, purchases, subscriptions, and revenue when attribution is reliable. This separation helps teams understand which stage needs improvement.\n\nWeekly reviews can focus on creative learning, while monthly reviews can focus on larger decisions such as channel priorities, budget allocation, landing-page improvements, and campaign objectives. Every report should end with a practical next action: repeat a strong format, stop a weak test, adjust the audience, improve the destination, or change the offer.\n\n## Keep a campaign decision log\n\nA decision log can record the objective, audience, creative concept, platform, destination URL, promotion method, date, expected result, actual result, and next step. Over time, this turns individual campaigns into a reusable knowledge base and reduces the chance of repeating weak tactics because earlier learning was forgotten.\n\nCross-platform insights also become easier to reuse. A TikTok hook that improves retention may inspire an Instagram Reel. A landing-page problem discovered through Instagram traffic may also affect visitors from other channels. Documenting these connections makes optimization more consistent across the wider marketing system.\n\n## Review operational details before scaling\n\nAny external marketing supplier should be understood before becoming part of a recurring workflow. The [FAQ]({L[7][1]}) can help marketers review common operational questions before ordering. Similar diligence should be applied to any provider: understand what the service does, define its role, decide how results will be measured, and keep appropriate quality controls in place.\n\nSustainable social growth combines audience understanding, useful content, careful distribution, analytics, and conversion optimization. For {a}, the strongest strategy is not the one with the largest number of tactics. It is the one that creates a repeatable connection between attention, relevant engagement, qualified traffic, and measurable business outcomes.'''
          arts=[article(i) for i in range(9)]
          for i,a in enumerate(arts):
            wc=len(re.findall(r"\b[\w'-]+\b",a)); lc=a.count('smmfansfaster.com'); print('ARTICLE',i+1,'WORDS',wc,'LINKS',lc)
            if not (800<=wc<=1200 and lc>=8): raise SystemExit('VALIDATION_FAIL')
          def mdhtml(md):
            out=[]
            for p in re.split(r'\n\s*\n',md):
              p=p.strip()
              if not p: continue
              if p.startswith('# '): out.append('<h1>'+html.escape(p[2:])+'</h1>'); continue
              if p.startswith('## '): out.append('<h2>'+html.escape(p[3:])+'</h2>'); continue
              e=html.escape(p); e=re.sub(r'\[([^\]]+)\]\((https?://[^)]+)\)',lambda m:f'<a href="{html.escape(m.group(2),quote=True)}">{html.escape(m.group(1))}</a>',e); out.append('<p>'+e.replace('\n',' ')+'</p>')
            return '<html><body>'+''.join(out)+'</body></html>'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'}); final=[]
          def verify(u):
            try:
              r=s.get(u,timeout=30,allow_redirects=True); c=r.text.count('smmfansfaster.com'); print('VERIFY',r.status_code,c,u); return r.status_code<400 and c>=6
            except Exception as e: print('VERIFY_ERR',u,repr(e)); return False
          try:
            acc=s.post('https://api.telegra.ph/createAccount',data={'short_name':'SMMRetry244','author_name':'Marketing Editorial'},timeout=30).json(); tok=(acc.get('result') or {}).get('access_token',''); nodes=[]
            for p in re.split(r'\n\s*\n',arts[0]):
              p=p.strip();
              if not p: continue
              tag='p'; txt=p
              if p.startswith('# '): tag='h3'; txt=p[2:]
              elif p.startswith('## '): tag='h4'; txt=p[3:]
              children=[]; pos=0
              for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',txt):
                if m.start()>pos: children.append(txt[pos:m.start()])
                children.append({'tag':'a','attrs':{'href':m.group(2)},'children':[m.group(1)]}); pos=m.end()
              if pos<len(txt): children.append(txt[pos:])
              nodes.append({'tag':tag,'children':children})
            d=s.post('https://api.telegra.ph/createPage',data={'access_token':tok,'title':titles[0],'content':json.dumps(nodes)},timeout=30).json(); path=(d.get('result') or {}).get('path',''); u='https://telegra.ph/'+path if path else ''
            if u and verify(u): final.append(u)
          except Exception as e: print('TEL_ERR',repr(e))
          try:
            r=s.post('https://shippage.ai/v1/publish',json={'html':mdhtml(arts[1]),'title':titles[1],'public':True},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('SHIP_ERR',repr(e))
          try:
            rs=requests.Session(); rs.headers.update({'User-Agent':'Mozilla/5.0'}); rs.get('https://rentry.co/',timeout=30); csrf=rs.cookies.get('csrftoken',''); r=rs.post('https://rentry.co/api/new',data={'csrfmiddlewaretoken':csrf,'text':arts[2],'edit_code':secrets.token_urlsafe(12),'url':''},headers={'Referer':'https://rentry.co/'},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('RENTRY_ERR',repr(e))
          try:
            r=s.post('https://md.page/api/publish',json={'markdown':arts[3]},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('MDPAGE_ERR',repr(e))
          try:
            r=s.post('https://markdown.page/api/publish',data=arts[4].encode(),headers={'Accept':'text/plain'},timeout=30); u=r.text.strip().splitlines()[0] if r.ok else '';
            if u and verify(u): final.append(u)
          except Exception as e: print('MARKDOWN_ERR',repr(e))
          try:
            r=s.post('https://yeet.md/api/share',json={'content':arts[5]},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('YEET_ERR',repr(e))
          try:
            r=s.post('https://mdview.io/api/public/publish',json={'title':titles[6],'content':arts[6],'expiresInDays':30},timeout=30); d=r.json(); u=d.get('shareUrl') or d.get('viewerUrl','');
            if u and verify(u): final.append(u)
          except Exception as e: print('MDVIEW_ERR',repr(e))
          try:
            r=s.post('https://output.pub/api/publish',json={'content':arts[7],'format':'markdown'},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('OUTPUT_ERR',repr(e))
          try:
            r=s.post('https://quicky.page/api/v1/publish',json={'title':titles[8],'content':arts[8]},timeout=30); d=r.json(); u=d.get('url') or d.get('pageUrl','');
            if u and verify(u): final.append(u)
          except Exception as e: print('QUICKY_ERR',repr(e))
          if len(final)<6: raise SystemExit('TOO_FEW_VERIFIED')
          print('URLS_BEGIN'); [print(u) for u in final]; print('URLS_END')
          PY
          python /tmp/publish.py
