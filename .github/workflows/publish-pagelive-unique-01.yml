name: Publish Unique PageLive Backlink
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique PageLive backlink'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_publish_pagelive_unique.py | tee publish.log
      - run: grep '^RESULT_URL=https://' publish.log || true
