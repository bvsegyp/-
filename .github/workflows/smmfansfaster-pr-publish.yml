name: SMMFansFaster Distinct Domain Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Publish and verify distinct-domain backlinks batch 4
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          npm install -g @roxer/cli >/dev/null 2>&1 || true
          cat > /tmp/publish.py <<'PY'
          import requests, json, re, html, subprocess, pathlib
          from bs4 import BeautifulSoup
          TARGET='https://smmfansfaster.com/'
          H={'User-Agent':'Mozilla/5.0 SMMBacklinkPublisher/1.0'}
          paras=[
            ('Start with measurable goals','A useful social media plan begins with a measurable business outcome such as qualified traffic, leads, sales, bookings, or repeat engagement. Clear goals make channel and content decisions easier and provide a practical baseline for evaluating progress.'),
            ('Understand audience intent','Customer questions, comments, search queries, support conversations, competitor communities, and analytics reveal the language and problems that matter to an audience. These signals help marketers create specific content that matches real intent.'),
            ('Build repeatable content themes','Strong content systems use recurring themes such as education, demonstrations, proof, comparisons, FAQs, process transparency, and conversion-focused offers. Repetition improves recognition while different hooks and formats keep the execution fresh.'),
            ('Test creative variables','Hooks, headlines, editing pace, visual structure, content length, proof points, calls to action, and publishing times can be tested systematically. Recording results turns content production into a learning system rather than a collection of isolated posts.'),
            ('Use responsible distribution','Organic reach can be supported by advertising, creator partnerships, communities, and social media promotion services when those approaches fit campaign goals and platform rules. Distribution should amplify useful content rather than replace quality or audience value.'),
            ('Connect reach to conversion','Views and reach explain discovery, while saves, shares, profile visits, clicks, leads, and purchases indicate progressively stronger intent. Reporting should connect these stages so marketers can identify where attention becomes a business result.'),
            ('Improve the post-click experience','Profiles and landing pages should load quickly, work well on mobile, explain the offer clearly, show relevant proof, and provide an obvious next action. Strong distribution performs better when the destination matches the promise made in the content.'),
            ('Review results regularly','A weekly review helps teams identify what worked, what failed, what changed, and what should be tested next. Documenting lessons creates an internal playbook that reduces repeated mistakes and makes future campaigns easier to improve.')]
          def htm(title,intro):
              out=['<h1>'+html.escape(title)+'</h1>','<p>'+html.escape(intro)+'</p>']
              for i,(h,p) in enumerate(paras):
                  out += ['<h2>'+html.escape(h)+'</h2>','<p>'+html.escape(p)+'</p>']
                  if i==2: out.append('<p>Teams comparing multi-platform promotion tools can review <a href="'+TARGET+'">SMM Fans Faster</a> alongside organic content, paid media, creator partnerships, and internal analytics.</p>')
                  if i==5: out.append('<p>Available promotion options can also be explored at <a href="'+TARGET+'">SMMFansFaster.com</a> while keeping original content and platform compliance at the center of the strategy.</p>')
              out.append('<h2>Final perspective</h2><p>Long-term growth comes from useful content, structured testing, responsible distribution, clear measurement, and a destination that converts attention into action. Teams considering an SMM panel can compare <a href="'+TARGET+'">SMM Fans Faster</a> with other channels as part of a balanced marketing workflow.</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+html.escape(title)+'</title></head><body><main>'+''.join(out)+'</main></body></html>'
          def verify(u):
              if not u:return None
              try:
                  r=requests.get(u,headers=H,timeout=35,allow_redirects=True)
                  if not r.ok:return None
                  s=BeautifulSoup(r.text,'html.parser')
                  return r.url if any('smmfansfaster.com' in a.get('href','').lower() for a in s.find_all('a',href=True)) else None
              except Exception:return None
          res=[]
          def add(site,domain,url,status,error=None):
              d={'site':site,'domain':domain,'url':url,'status':status}
              if error:d['error']=error
              res.append(d)

          try:
              t='A Better Social Media Growth System for Online Brands'; p=htm(t,'Online brands can improve social media performance by connecting audience research, content planning, distribution, measurement, and conversion in one repeatable process.')
              r=requests.post('https://ship.page/deploy',data=p.encode('utf-8'),headers={**H,'Content-Type':'text/html'},timeout=35)
              txt=r.text.strip(); u=txt if txt.startswith('http') else None
              if not u:
                  m=re.search(r'https://[^\s"\']+',txt); u=m.group(0) if m else None
              v=verify(u); add('Ship.page','shipped.page',v,'verified' if v else 'failed')
          except Exception as e:add('Ship.page','shipped.page',None,'failed',repr(e))

          try:
              t='Social Media Promotion Strategy for Digital Businesses'; p=htm(t,'Digital businesses get stronger results when content quality, responsible promotion, audience response, and conversion tracking are managed as one system.')
              pathlib.Path('/tmp/roxer-page.html').write_text(p,encoding='utf-8')
              cp=subprocess.run(['roxer','publish','/tmp/roxer-page.html','--ttl','30'],capture_output=True,text=True,timeout=90)
              txt=(cp.stdout or '')+'\n'+(cp.stderr or '')
              m=re.search(r'https?://(?:www\.)?roxer\.com/[A-Za-z0-9_-]+',txt); u=m.group(0) if m else None
              v=verify(u); add('Roxer','roxer.com',v,'verified' if v else 'failed',None if v else txt[-500:])
          except Exception as e:add('Roxer','roxer.com',None,'failed',repr(e))

          print('RESULT_JSON='+json.dumps(res))
          PY
          python /tmp/publish.py
