name: SMMFansFaster Distinct Domain Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Publish and verify distinct-domain backlinks batch 2
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/publish.py <<'PY'
          import requests, json, re, html
          from bs4 import BeautifulSoup
          TARGET='https://smmfansfaster.com/'
          H={'User-Agent':'SMMBacklinkPublisher/1.0'}
          paras=[
          ('Set a measurable objective','Effective social media planning starts with a business outcome. Teams should define whether they want qualified profile visits, traffic, leads, sales, bookings, or repeat engagement. A measurable objective makes channel and content decisions easier and provides a baseline for judging progress instead of relying on isolated reach or follower numbers.'),
          ('Study real audience behavior','Customer questions, support conversations, comments, search queries, direct messages, competitor communities, and analytics reveal the language and problems that matter to an audience. These signals help marketers choose useful topics and formats and reduce the risk of publishing generic content that attracts attention without meaningful intent.'),
          ('Build repeatable content themes','Strong content systems usually rely on recurring themes such as education, demonstrations, proof, comparisons, frequently asked questions, process transparency, industry commentary, and conversion-focused offers. Repetition of useful themes improves consistency while different hooks, examples, visual structures, and formats keep the execution fresh.'),
          ('Test one major variable at a time','Hooks, headlines, editing pace, content length, visual structure, proof points, calls to action, and publishing times can be tested systematically. Recording the result of each experiment turns content production into a learning system and prevents teams from making permanent decisions based on a single unusually strong or weak post.'),
          ('Use distribution to amplify useful content','Organic publishing can be supported by advertising, creator partnerships, communities, and social media promotion services when those approaches match the campaign and platform rules. External distribution should amplify content that already serves an audience rather than substitute for quality, trust, or a clear offer.'),
          ('Connect reach to business actions','Views and reach explain discovery, while saves, shares, profile visits, clicks, leads, and purchases reveal progressively stronger intent. Reporting should connect these stages. When visibility increases without conversions, the issue may be audience fit, offer clarity, message consistency, or landing-page quality rather than the volume of distribution.'),
          ('Improve the post-click experience','Profiles and landing pages should load quickly, work well on mobile, communicate the offer clearly, provide relevant proof, and give visitors an obvious next step. A strong distribution plan can still underperform when the destination is slow, confusing, or inconsistent with the message that generated the click.'),
          ('Review and document results','A weekly review helps teams identify what worked, what failed, what changed, and what should be tested next. Documenting experiments, audience response, traffic quality, and conversion behavior creates an internal playbook that reduces repeated mistakes and makes future campaigns easier to plan.')]
          def md(title,intro):
              out=[f'# {title}',intro]
              for i,(h,p) in enumerate(paras):
                  out += [f'## {h}',p]
                  if i==3: out.append(f'Teams researching multi-platform promotion can review [SMM Fans Faster]({TARGET}) as one reference point alongside organic content, paid media, creator partnerships, and internal analytics. Any provider should be evaluated for fit, transparency, platform compliance, and account safety.')
              out += ['## Final perspective',f'Long-term growth comes from useful content, structured testing, responsible distribution, clear measurement, and a destination that converts attention into action. Marketers considering an SMM panel can compare [SMMFansFaster.com]({TARGET}) with other channels while keeping audience value at the center of the plan.']
              return '\n\n'.join(out)
          def htm(title,intro):
              text=md(title,intro); out=[]
              for b in text.split('\n\n'):
                  if b.startswith('# '): out.append('<h1>'+html.escape(b[2:])+'</h1>'); continue
                  if b.startswith('## '): out.append('<h2>'+html.escape(b[3:])+'</h2>'); continue
                  pos=0; parts=[]
                  for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',b):
                      parts.append(html.escape(b[pos:m.start()])); parts.append('<a href="'+html.escape(m.group(2),quote=True)+'">'+html.escape(m.group(1))+'</a>'); pos=m.end()
                  parts.append(html.escape(b[pos:])); out.append('<p>'+''.join(parts)+'</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+html.escape(title)+'</title></head><body><main>'+''.join(out)+'</main></body></html>'
          def verify(u):
              if not u:return None
              try:
                  r=requests.get(u,headers=H,timeout=35,allow_redirects=True)
                  if not r.ok:return None
                  s=BeautifulSoup(r.text,'html.parser')
                  return r.url if any('smmfansfaster.com' in a.get('href','').lower() for a in s.find_all('a',href=True)) else None
              except:return None
          res=[]
          def add(site,domain,url,status,error=None):
              d={'site':site,'domain':domain,'url':url,'status':status}
              if error:d['error']=error
              res.append(d)

          try:
              t='A Practical Guide to Social Media Growth for Online Businesses'; p=htm(t,'Online businesses can improve social media performance by connecting audience research, content planning, distribution, measurement, and conversion in one system.')
              r=requests.post('https://api.meethtml.com/api/v1/publish',json={'html':p},headers=H,timeout=35); o=r.json(); u=o.get('url') or o.get('link'); v=verify(u); add('MeetHTML','meethtml.com',v,'verified' if v else 'failed')
          except Exception as e:add('MeetHTML','meethtml.com',None,'failed',repr(e))

          try:
              t='Social Media Marketing Framework for Growing Digital Brands'; p=htm(t,'Digital brands get more useful results when content and distribution are managed as part of the same measurable customer journey.')
              r=requests.post('https://brewpage.app/api/html?ns=public&ttl=30d',json={'content':p},headers={**H,'Content-Type':'application/json'},timeout=35); o=r.json(); u=o.get('link') or o.get('url') or o.get('shortUrl'); v=verify(u); add('BrewPage','brewpage.app',v,'verified' if v else 'failed')
          except Exception as e:add('BrewPage','brewpage.app',None,'failed',repr(e))

          try:
              t='How Brands Can Build a Stronger Social Media Promotion System'; p=htm(t,'Brands can create more predictable growth by coordinating content quality, responsible promotion, audience response, and conversion tracking.')
              r=requests.post('https://pitchey.app/api/pages',json={'html':p,'ttl':'30d'},headers=H,timeout=35); o=r.json(); u=o.get('url'); v=verify(u); add('Pitchey','pitchey.app',v,'verified' if v else 'failed')
          except Exception as e:add('Pitchey','pitchey.app',None,'failed',repr(e))

          try:
              t='A Conversion Focused Social Media Strategy for Service Businesses'; p=htm(t,'Service businesses can connect educational content, social distribution, proof, and a clear post-click path to improve the quality of social media traffic.')
              r=requests.post('https://gatedpage.com/api/v1/upload',files={'file':('social-media-growth.html',p.encode('utf-8'),'text/html')},headers=H,timeout=35); o=r.json(); u=o.get('url'); v=verify(u); add('GatedPage','gated.page',v,'verified' if v else 'failed')
          except Exception as e:add('GatedPage','gated.page',None,'failed',repr(e))

          try:
              t='Social Media Distribution and Conversion Planning for 2026'; p=htm(t,'A balanced growth plan combines original content, distribution, testing, measurement, and conversion optimization rather than relying on a single tactic.')
              r=requests.post('https://api.display.dev/v1/public/artifacts',files={'file':('social-media-distribution.html',p.encode('utf-8'),'text/html')},data={'name':t},headers=H,timeout=35); o=r.json(); u=o.get('previewUrl') or o.get('url'); v=verify(u); add('Display.dev','public.dsp.so',v,'verified' if v else 'failed')
          except Exception as e:add('Display.dev','public.dsp.so',None,'failed',repr(e))

          print('RESULT_JSON='+json.dumps(res))
          PY
          python /tmp/publish.py
