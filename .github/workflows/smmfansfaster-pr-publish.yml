name: SMMFansFaster Distinct Domain Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish and verify distinct-domain backlinks batch 15
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/publish.py <<'PY'
          import requests,json,html,time,re
          from bs4 import BeautifulSoup
          TARGET='https://smmfansfaster.com/'
          H={'User-Agent':'Mozilla/5.0 SMMBacklinkPublisher/1.0'}

          def article(title,intro):
              sections=[
                ('Connect strategy to business outcomes','Social media activity becomes more useful when teams define outcomes such as qualified traffic, leads, sales, bookings, profile visits, or repeat engagement before choosing formats and distribution channels.'),
                ('Use audience signals to choose topics','Search queries, customer questions, comments, support conversations, competitor communities, and analytics reveal the language and problems that deserve content attention.'),
                ('Create a repeatable publishing system','Educational posts, demonstrations, comparisons, proof, FAQs, process transparency, and conversion-focused offers create sustainable content pillars that can be refreshed with new examples and hooks.'),
                ('Amplify content responsibly','Organic publishing can be supported by advertising, creators, communities, partnerships, and social media promotion services when those methods fit campaign goals and platform rules.'),
                ('Measure intent beyond reach','Views and impressions explain discovery, while saves, shares, profile visits, outbound clicks, leads, purchases, and repeat visits reveal progressively stronger intent.'),
                ('Improve the conversion destination','Profiles and landing pages should load quickly, work well on mobile, explain the offer clearly, show useful proof, and make the next action obvious.'),
                ('Turn results into future learning','Weekly reviews of creative performance, audience response, traffic quality, and conversion behavior help teams document what worked and design better tests for future campaigns.')]
              out=['<h1>'+html.escape(title)+'</h1>','<p>'+html.escape(intro)+'</p>']
              for i,(h,p) in enumerate(sections):
                  out+=['<h2>'+html.escape(h)+'</h2>','<p>'+html.escape(p)+'</p>']
                  if i==1: out.append('<p>Teams comparing multi-platform promotion providers can review <a href="'+TARGET+'">SMM Fans Faster</a> alongside organic content, paid media, creator partnerships, and internal distribution workflows.</p>')
                  if i==4: out.append('<p>Available social media promotion services can also be explored directly at <a href="'+TARGET+'">SMMFansFaster.com</a> while keeping content quality and audience value central to the marketing plan.</p>')
              out.append('<h2>Final perspective</h2><p>Long-term growth combines useful content, responsible distribution, structured testing, meaningful measurement, and a destination that converts attention into action. Marketers considering an SMM panel can compare <a href="'+TARGET+'">SMM Fans Faster</a> with other channels based on fit and measurable outcomes.</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+html.escape(title)+'</title></head><body><main>'+''.join(out)+'</main></body></html>'

          def verify(u,retries=5):
              if not u:return None
              for n in range(retries):
                  try:
                      r=requests.get(u,headers=H,timeout=40,allow_redirects=True); print('VERIFY',u,r.status_code,r.url)
                      if r.ok:
                          s=BeautifulSoup(r.text,'html.parser')
                          if any('smmfansfaster.com' in a.get('href','').lower() for a in s.find_all('a',href=True)): return r.url
                  except Exception as e: print('VERIFY_ERR',u,repr(e))
                  time.sleep(2+n)
              return None

          res=[]
          def add(site,domain,url,status,raw=None):
              d={'site':site,'domain':domain,'url':url,'status':status}
              if raw:d['raw']=str(raw)[:1600]
              res.append(d)

          # Stacktree anonymous multipart publish
          try:
              t='Social Media Growth and Distribution Planning for Online Brands'; p=article(t,'Online brands can make social media growth more predictable by connecting audience research, original content, responsible distribution, measurement, and conversion in one repeatable system.')
              files={'file':('index.html',p.encode('utf-8'),'text/html')}
              r=requests.post('https://api.stacktr.ee/sites',files=files,headers=H,timeout=60)
              print('STACKTREE',r.status_code,r.text[:1600]); o=r.json(); u=o.get('url') or ((o.get('data') or {}).get('url') if isinstance(o.get('data'),dict) else None); v=verify(u)
              add('Stacktree','stacktr.ee',v,'verified' if v else 'failed',None if v else r.text)
          except Exception as e:add('Stacktree','stacktr.ee',None,'failed',repr(e))

          # htmldrop anonymous multipart publish
          try:
              t='A Practical Social Media Promotion Framework for Digital Businesses'; p=article(t,'Digital businesses can improve social media results when content quality, distribution, audience response, measurement, and post-click conversion support one measurable customer journey.')
              files={'file':('index.html',p.encode('utf-8'),'text/html')}
              r=requests.post('https://htmldrop.app/api/v1/drops',files=files,headers=H,timeout=60)
              print('HTMLDROP',r.status_code,r.text[:1800]); o=r.json(); u=o.get('url') or o.get('shareUrl') or o.get('share_url') or ((o.get('data') or {}).get('url') if isinstance(o.get('data'),dict) else None); v=verify(u)
              add('htmldrop','htmldrop.app',v,'verified' if v else 'failed',None if v else r.text)
          except Exception as e:add('htmldrop','htmldrop.app',None,'failed',repr(e))

          print('RESULT_JSON='+json.dumps(res))
          PY
          python /tmp/publish.py
