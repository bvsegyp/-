name: SMMFansFaster Distinct Domain Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Discover current publish schemas for batch 9
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/probe.py <<'PY'
          import requests,re
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 SMMBacklinkPublisher/1.0'}

          def context(label,text,needle,n=1800):
              pos=0; count=0
              while True:
                  i=text.find(needle,pos)
                  if i<0: break
                  print('\n###',label,'OCC',count,'###\n',text[max(0,i-n):i+n])
                  pos=i+len(needle); count+=1
                  if count>=6: break

          # YourWebs skill is the authoritative agent API guide.
          try:
              r=requests.get('https://yourwebs.cc/skill.md',headers=H,timeout=30)
              print('YOURWEBS_SKILL_STATUS',r.status_code,r.headers.get('content-type'))
              context('YOURWEBS',r.text,'/api/v1/pages',2200)
          except Exception as e: print('YOURWEBS_ERR',repr(e))

          def scan_site(base,needle):
              try:
                  r=requests.get(base,headers=H,timeout=30); print('HOME',base,r.status_code)
                  blobs=[(r.url,r.text)]
                  s=BeautifulSoup(r.text,'html.parser')
                  for tag in s.find_all('script',src=True):
                      u=urljoin(r.url,tag['src'])
                      if urlparse(u).netloc==urlparse(base).netloc:
                          try:
                              js=requests.get(u,headers=H,timeout=25).text
                              blobs.append((u,js))
                          except: pass
                  for src,text in blobs:
                      if needle in text:
                          print('\nSOURCE',src)
                          context(base,text,needle,2400)
              except Exception as e: print('SCAN_ERR',base,repr(e))

          scan_site('https://pagey.site','/api/public/sites/')
          scan_site('https://paste.page','/api/pages')
          PY
          python /tmp/probe.py
