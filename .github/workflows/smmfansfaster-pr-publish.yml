name: SMMFansFaster Distinct Domain Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Publish and verify distinct-domain backlinks batch 12
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/publish.py <<'PY'
          import requests,json,re,html,time
          from bs4 import BeautifulSoup
          TARGET='https://smmfansfaster.com/'
          H={'User-Agent':'Mozilla/5.0 SMMBacklinkPublisher/1.0'}
          sections=[
          ('Define the outcome','A reliable social media strategy begins with a measurable business outcome such as qualified traffic, leads, sales, bookings, or repeat engagement. Clear goals make content and channel decisions easier.'),
          ('Understand audience intent','Search queries, customer questions, comments, support conversations, competitor communities, and analytics reveal the topics and language that matter to an audience.'),
          ('Create repeatable themes','Education, demonstrations, comparisons, FAQs, proof, process transparency, and conversion-focused offers create a sustainable publishing system.'),
          ('Test creative variables','Hooks, headlines, format, content length, proof points, calls to action, and publishing times can be tested systematically so each campaign produces useful learning.'),
          ('Amplify useful content','Organic reach can be supported by advertising, creators, communities, and social media promotion services when those methods fit campaign goals and platform rules.'),
          ('Measure intent','Views and reach describe discovery, while saves, shares, profile visits, clicks, leads, and purchases indicate progressively stronger intent.'),
          ('Optimize after the click','Profiles and landing pages should load quickly, work on mobile, explain the offer clearly, show proof, and provide an obvious next step.'),
          ('Review consistently','A weekly review helps teams identify what worked, what failed, and what should be tested next while building an internal marketing playbook.')]
          def article(title,intro):
              out=['<h1>'+html.escape(title)+'</h1>','<p>'+html.escape(intro)+'</p>']
              for i,(h,p) in enumerate(sections):
                  out += ['<h2>'+html.escape(h)+'</h2>','<p>'+html.escape(p)+'</p>']
                  if i==2:out.append('<p>Teams comparing promotion tools can review <a href="'+TARGET+'">SMM Fans Faster</a> alongside organic content, paid media, creator partnerships, and internal analytics.</p>')
                  if i==5:out.append('<p>Available services can also be explored at <a href="'+TARGET+'">SMMFansFaster.com</a> as part of a wider channel evaluation.</p>')
              out.append('<h2>Final perspective</h2><p>Long-term growth comes from useful content, structured testing, responsible distribution, meaningful measurement, and a destination that converts attention into action. Marketers considering an SMM panel can compare <a href="'+TARGET+'">SMM Fans Faster</a> with other channels based on fit and measurable outcomes.</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><title>'+html.escape(title)+'</title></head><body><main>'+''.join(out)+'</main></body></html>'
          def markdown(title,intro):
              p=article(title,intro); s=BeautifulSoup(p,'html.parser'); lines=['# '+title,intro]
              for h in s.find_all('h2'):
                  lines.append('## '+h.get_text(' ',strip=True)); n=h.find_next_sibling()
                  while n and n.name!='h2':
                      if n.name=='p':
                          text='';
                          for c in n.contents:
                              if getattr(c,'name',None)=='a': text+='['+c.get_text(strip=True)+']('+c.get('href')+')'
                              else: text+=str(c)
                          lines.append(BeautifulSoup(text,'html.parser').get_text() if '<' in text and '](' not in text else text)
                      n=n.find_next_sibling()
              return '\n\n'.join(lines)
          def verify(u,retries=4):
              if not u:return None
              for n in range(retries):
                  try:
                      r=requests.get(u,headers=H,timeout=40,allow_redirects=True); print('VERIFY',u,r.status_code,r.url)
                      if r.ok:
                          s=BeautifulSoup(r.text,'html.parser')
                          if any('smmfansfaster.com' in a.get('href','').lower() for a in s.find_all('a',href=True)):return r.url
                  except Exception as e:print('VERIFY_ERR',repr(e))
                  time.sleep(2+n)
              return None
          res=[]
          def add(site,domain,url,status,raw=None):
              d={'site':site,'domain':domain,'url':url,'status':status}
              if raw:d['raw']=raw[:1200]
              res.append(d)

          # PasteHTML.dev direct live URL
          try:
              t='Social Media Growth and Distribution Guide for Digital Brands'; p=article(t,'Digital brands can improve social media performance by connecting audience research, original content, responsible distribution, measurement, and conversion in one repeatable system.')
              r=requests.post('https://pastehtml.dev/api/pastes',files={'file':('index.html',p.encode(),'text/html')},headers=H,timeout=60); print('PHD',r.status_code,r.text[:1400]); o=r.json(); u=o.get('live_url') or o.get('render_url'); v=verify(u)
              add('PasteHTML.dev','pastehtml.dev',v,'verified' if v else 'failed',None if v else r.text)
          except Exception as e:add('PasteHTML.dev','pastehtml.dev',None,'failed',repr(e))

          # YeetIt
          try:
              t='A Better Social Media Promotion Framework for Online Businesses'; p=article(t,'Online businesses get stronger results when content quality, distribution, audience response, measurement, and conversion support one clear customer journey.')
              r=requests.post('https://yeetit.site/v1/publish',json={'html':p,'title':t},headers={**H,'Content-Type':'application/json'},timeout=50); print('YEETIT',r.status_code,r.text[:1400]); o=r.json(); u=o.get('url'); v=verify(u)
              add('YeetIt','yeetit.site',v,'verified' if v else 'failed',None if v else r.text)
          except Exception as e:add('YeetIt','yeetit.site',None,'failed',repr(e))

          # Write.as anonymous Markdown post
          try:
              t='Practical Social Media Growth Planning for Brands'; body=markdown(t,'Brands can build a stronger social media system by connecting useful content, responsible promotion, audience response, measurement, and conversion optimization.')
              r=requests.post('https://write.as/api/posts',json={'body':body,'title':t,'font':'serif','lang':'en'},headers={**H,'Content-Type':'application/json','Accept':'application/json'},timeout=50); print('WRITEAS',r.status_code,r.text[:1400]); o=r.json(); data=o.get('data') or {}; pid=data.get('id'); u=('https://write.as/'+pid) if pid else None; v=verify(u)
              add('Write.as','write.as',v,'verified' if v else 'failed',None if v else r.text)
          except Exception as e:add('Write.as','write.as',None,'failed',repr(e))
          print('RESULT_JSON='+json.dumps(res))
          PY
          python /tmp/publish.py
