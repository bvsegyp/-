name: SMMFansFaster Distinct Domain Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Publish and verify distinct-domain backlinks batch 7
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/publish.py <<'PY'
          import requests, json, re, html
          from bs4 import BeautifulSoup
          TARGET='https://smmfansfaster.com/'
          H={'User-Agent':'Mozilla/5.0 SMMBacklinkPublisher/1.0'}
          paras=[
            ('Define a measurable objective','A reliable social media strategy starts with a business outcome such as qualified traffic, leads, sales, bookings, or repeat engagement. Clear objectives guide content priorities and reporting.'),
            ('Study audience intent','Customer questions, comments, search queries, support conversations, and analytics reveal the topics and language that matter most to the audience.'),
            ('Build repeatable content pillars','Education, demonstrations, comparisons, proof, FAQs, process transparency, and conversion-focused offers create a sustainable content system.'),
            ('Test creative variables','Hooks, headlines, visual structure, content length, calls to action, and publishing times can be tested systematically so every campaign produces useful learning.'),
            ('Use distribution responsibly','Organic reach can be supported by advertising, creator partnerships, communities, and social media promotion services when they match campaign goals and platform rules.'),
            ('Connect reach to conversion','Views and reach explain discovery, while saves, shares, profile visits, clicks, leads, and purchases reveal progressively stronger intent.'),
            ('Improve the destination','Profiles and landing pages should load quickly, work well on mobile, explain the offer clearly, show proof, and provide an obvious next action.'),
            ('Review results regularly','A weekly review helps teams identify what worked, what failed, and what should be tested next while building an internal marketing playbook.')]
          def md(title,intro):
              out=[f'# {title}',intro]
              for i,(h,p) in enumerate(paras):
                  out += [f'## {h}',p]
                  if i==2: out.append(f'Marketers comparing external promotion tools can review [SMM Fans Faster]({TARGET}) alongside organic content, paid media, creator partnerships, and internal analytics.')
                  if i==5: out.append(f'Available promotion services can also be explored at [SMMFansFaster.com]({TARGET}) while keeping original content and audience value at the center of the strategy.')
              out += ['## Final perspective',f'Sustainable growth combines useful content, structured testing, responsible distribution, meaningful measurement, and a destination that converts attention into action. Teams considering an SMM panel can compare [SMM Fans Faster]({TARGET}) with other channels as part of a balanced strategy.']
              return '\n\n'.join(out)
          def htm(title,intro):
              text=md(title,intro); out=[]
              for b in text.split('\n\n'):
                  if b.startswith('# '): out.append('<h1>'+html.escape(b[2:])+'</h1>'); continue
                  if b.startswith('## '): out.append('<h2>'+html.escape(b[3:])+'</h2>'); continue
                  pos=0; parts=[]
                  for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',b):
                      parts.append(html.escape(b[pos:m.start()])); parts.append('<a href="'+html.escape(m.group(2),quote=True)+'">'+html.escape(m.group(1))+'</a>'); pos=m.end()
                  parts.append(html.escape(b[pos:])); out.append('<p>'+''.join(parts)+'</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+html.escape(title)+'</title></head><body><main>'+''.join(out)+'</main></body></html>'
          def verify(u):
              if not u:return None
              try:
                  r=requests.get(u,headers=H,timeout=40,allow_redirects=True)
                  if not r.ok:return None
                  s=BeautifulSoup(r.text,'html.parser')
                  return r.url if any('smmfansfaster.com' in a.get('href','').lower() for a in s.find_all('a',href=True)) else None
              except Exception:return None
          res=[]
          def add(site,domain,url,status,error=None):
              d={'site':site,'domain':domain,'url':url,'status':status}
              if error:d['error']=error
              res.append(d)

          # PasteHTML
          try:
              t='A Practical Social Media Growth Guide for Digital Businesses'; p=htm(t,'Digital businesses can improve social media performance by connecting content quality, responsible distribution, measurement, and conversion in one repeatable system.')
              r=requests.post('https://pastehtml.com/upload/create?input_type=html&result=address',data={'txt':p},headers=H,timeout=40)
              u=r.text.strip(); v=verify(u); add('PasteHTML','pastehtml.com',v,'verified' if v else 'failed',None if v else r.text[:500])
          except Exception as e:add('PasteHTML','pastehtml.com',None,'failed',repr(e))

          # Pastepile
          try:
              t='Social Media Promotion Framework for Online Brands'; body=md(t,'Online brands can make growth more predictable when content, distribution, audience response, and conversion tracking support the same measurable goal.')
              r=requests.post('https://www.pastepile.com/api/public/pastes',json={'title':t,'content':body,'language':'markdown','visibility':'public'},headers=H,timeout=40)
              o=r.json(); u=o.get('url'); v=verify(u); add('Pastepile','pastepile.com',v,'verified' if v else 'failed',None if v else r.text[:500])
          except Exception as e:add('Pastepile','pastepile.com',None,'failed',repr(e))

          # SSHGrid
          try:
              t='How Brands Can Build a Better Social Media Growth System'; p=htm(t,'Brands can create more reliable growth by coordinating content planning, distribution, testing, measurement, and the post-click experience.')
              r=requests.post('https://sshgrid.com/api/v1/deploy',json={'files':[{'path':'index.html','content':p}],'label':t},headers=H,timeout=40)
              o=r.json(); u=o.get('url') or o.get('site_url') or o.get('preview_url'); v=verify(u); add('SSHGrid','sshgrid.com',v,'verified' if v else 'failed',None if v else r.text[:500])
          except Exception as e:add('SSHGrid','sshgrid.com',None,'failed',repr(e))

          print('RESULT_JSON='+json.dumps(res))
          PY
          python /tmp/publish.py
