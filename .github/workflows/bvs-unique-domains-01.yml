name: BVS Unique Domains 01

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run BVS unique domains 01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Publish and verify BVS backlinks
        run: python scripts/bvs_unique_domains_01.py
