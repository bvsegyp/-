name: Publish Unique publishto.us Backlink
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique publishto.us backlink'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests beautifulsoup4
      - run: python3 scripts/publish_publishtous_unique.py | tee publish.log
      - run: grep '^RESULT_URL=https://' publish.log || true
