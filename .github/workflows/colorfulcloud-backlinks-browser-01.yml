name: Colorful Cloud Browser Backlinks 01
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run Colorful Cloud browser backlink batch 01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
      - name: Publish browser backlinks
        run: python scripts/colorfulcloud_backlinks_browser_01.py
