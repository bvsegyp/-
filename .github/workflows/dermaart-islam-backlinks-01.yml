name: DermaArt Islam Backlinks Batch 01

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run DermaArt Islam backlink batch 01'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          pip install playwright requests beautifulsoup4
          python -m playwright install chromium --with-deps
      - name: Publish and verify DermaArt backlinks
        shell: bash
        run: |
          python - <<'PY'
          import asyncio,re,html,json,requests,hashlib,secrets
          from urllib.parse import urljoin
          from playwright.async_api import async_playwright

          LINKS=[
            ('أفضل دكتورة تجميل في الرياض','https://dermaart-sa.com/dr-islam-el-laboudi-landing-page/'),
            ('الدكتورة إسلام اللبودي','https://dermaart-sa.com/dr-islam-el-laboudi-landing-page/'),
            ('عيادة ديرما آرت للتجميل','https://dermaart-sa.com/'),
            ('خدمات الجلدية والتجميل والليزر','https://dermaart-sa.com/services/'),
            ('حجز موعد في ديرما آرت','https://dermaart-sa.com/contact-us/'),
          ]
          TARGETS=[
            ('notesh.ink','https://notesh.ink/','md'),
            ('yapp.page','https://yapp.page/','html'),
            ('publishmarkdown.com','https://publishmarkdown.com/','md'),
            ('markdshare.com','https://markdshare.com/','md'),
            ('htmlhost.co','https://htmlhost.co/','html'),
            ('pagegate.app','https://pagegate.app/','html'),
            ('paste.page','https://paste.page/','html'),
          ]
          TITLES=[
            'كيف تختارين دكتورة تجميل في الرياض بخبرة في الجلدية والليزر',
            'دليل اختيار دكتورة تجميل في الرياض لنتائج طبيعية ومدروسة',
            'ما الذي يميز الاستشارة التجميلية الجيدة قبل الفيلر والبوتوكس',
            'العناية بالبشرة والتجميل غير الجراحي في الرياض: دليل عملي',
            'اختيار طبيبة جلدية وتجميل وليزر في الرياض بخطوات واضحة',
            'الفيلر والبوتوكس والعناية بالبشرة: كيف تبدأ الاستشارة الصحيحة',
            'دليلك للعناية التجميلية والليزر في الرياض مع خطة مناسبة للحالة',
            'متى تحتاجين إلى استشارة جلدية وتجميل قبل اختيار الإجراء',
          ]
          SECTIONS=[
            ('ابدئي بالتشخيص قبل اختيار الإجراء','نجاح أي خطة تجميلية يبدأ بفهم احتياج البشرة والملامح قبل اختيار التقنية. الاستشارة الجيدة لا تبدأ باسم الإجراء، بل بتقييم الحالة ومناقشة الهدف والنتيجة المتوقعة وما إذا كان الفيلر أو البوتوكس أو جلسات البشرة أو الليزر مناسبًا أصلًا.'),
            ('النتائج الطبيعية تحتاج خطة مخصصة','الوجه يختلف من شخص لآخر في توزيع الحجم وحركة العضلات ونوعية البشرة، لذلك لا توجد خطة واحدة تناسب الجميع. الأفضل هو اختيار خطوات تدريجية تحافظ على التوازن العام للملامح وتبتعد عن المبالغة، مع مراجعة النتيجة بعد كل مرحلة.'),
            ('الجلدية والتجميل والليزر مجالات مترابطة','بعض الحالات تحتاج إلى تحسين جودة البشرة قبل أي إجراء تجميلي، بينما تحتاج حالات أخرى إلى علاج تصبغات أو آثار أو مشاكل جلدية بالتوازي مع خطة التجميل. وجود تقييم يجمع الجلدية والتجميل والليزر يساعد على ترتيب الأولويات بصورة أكثر منطقية.'),
            ('اسألي عن البدائل والمدة والمتابعة','قبل أي جلسة من المفيد معرفة البدائل المتاحة والوقت المتوقع للنتيجة وفترة التعافي إن وجدت وطريقة المتابعة بعد الإجراء. هذه التفاصيل تجعل القرار أكثر وضوحًا وتساعد على اختيار ما يتناسب مع نمط الحياة والهدف الشخصي.'),
            ('الفيلر والبوتوكس ليسا الإجراء نفسه','البوتوكس يستخدم عادة للتعامل مع الحركة العضلية والتجاعيد التعبيرية، بينما يعتمد الفيلر على إضافة حجم أو دعم مناطق محددة بحسب الخطة. تحديد الإجراء المناسب يجب أن يعتمد على تشخيص الحالة وليس على اسم الخدمة الأكثر انتشارًا.'),
            ('جودة البشرة جزء أساسي من النتيجة','حتى مع الإجراءات التجميلية، تظل صحة البشرة وترطيبها ونظافتها وعلاج التصبغات أو الملمس عوامل مؤثرة في الشكل النهائي. لذلك قد تتضمن الخطة جلسات عناية أو تنظيف أو ترطيب أو علاجات جلدية إلى جانب الإجراءات الأخرى.'),
            ('المتابعة بعد الجلسة مهمة','المتابعة تساعد على تقييم الاستجابة وتقديم التعليمات المناسبة ومراجعة النتيجة في الوقت الصحيح. كما أنها تتيح تعديل الخطة مستقبلًا بدل تكرار الإجراءات دون تقييم واضح.'),
          ]

          def md_article(i):
            title=TITLES[i%len(TITLES)]
            out=[f'# {title}','','عند البحث عن طبيبة تجميل في الرياض، من المهم النظر إلى التخصص وطريقة التشخيص ووضوح الخطة أكثر من الاعتماد على اسم إجراء بعينه. هذا الدليل يوضح نقاطًا عملية تساعد على فهم الاستشارة التجميلية واختيار ما يناسب البشرة والملامح بصورة مدروسة.','']
            for n,(h,p) in enumerate(SECTIONS):
              out += [f'## {h}','',p,'']
              if n<5:
                a,u=LINKS[n]
                if n==0:
                  extra='لمن تبحث عن ['+a+']('+u+') يمكن الاطلاع على صفحة د. إسلام اللبودي للتعرف على مجال تخصصها وخيارات الحجز.'
                else:
                  extra='للمزيد يمكن زيارة ['+a+']('+u+').' 
                out += [extra,'']
            out += ['## الخلاصة','','اختيار الإجراء التجميلي المناسب يبدأ باستشارة واضحة وتقييم حقيقي للحالة. كلما كانت الخطة مخصصة وواقعية ومرتبطة بصحة البشرة والملامح، كان اتخاذ القرار أسهل وأكثر اتزانًا.']
            return '\n'.join(out)

          def html_article(i):
            text=md_article(i); blocks=[]
            for b in re.split(r'\n\s*\n',text):
              b=b.strip()
              if not b: continue
              if b.startswith('# '): blocks.append('<h1>'+html.escape(b[2:])+'</h1>'); continue
              if b.startswith('## '): blocks.append('<h2>'+html.escape(b[3:])+'</h2>'); continue
              pos=0; parts=[]
              for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',b):
                parts.append(html.escape(b[pos:m.start()])); parts.append('<a href="'+html.escape(m.group(2),quote=True)+'">'+html.escape(m.group(1))+'</a>'); pos=m.end()
              parts.append(html.escape(b[pos:])); blocks.append('<p>'+''.join(parts)+'</p>')
            return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+html.escape(TITLES[i%len(TITLES)])+'</title></head><body><main style="max-width:920px;margin:40px auto;padding:0 24px;font-family:Arial,Tahoma,sans-serif;line-height:2;color:#222">'+''.join(blocks)+'</main></body></html>'

          async def verify(browser,url):
            p=await browser.new_page(); resp=None
            try:
              resp=await p.goto(url,wait_until='domcontentloaded',timeout=40000); await p.wait_for_timeout(1800)
              n=0
              try:n+=await p.locator('a[href*="dermaart-sa.com"]').count()
              except:pass
              for fr in p.frames:
                if fr==p.main_frame: continue
                try:n+=await fr.locator('a[href*="dermaart-sa.com"]').count()
                except:pass
              content=''
              try:content=await p.content()
              except:pass
              exact='أفضل دكتورة تجميل في الرياض' in content
              robots=''
              try:robots=(await p.locator('meta[name="robots"],meta[name="googlebot"]').evaluate_all("els=>els.map(e=>e.content||'').join(' ')")).lower()
              except:pass
              xrob=''
              try:xrob=(await resp.all_headers()).get('x-robots-tag','').lower() if resp else ''
              except:pass
              noindex='noindex' in robots or 'noindex' in xrob
              final=p.url
              print('VERIFY',url,'FINAL',final,'HREFS',n,'EXACT',int(exact),'NOINDEX',int(noindex))
              await p.close(); return final,n,exact,noindex
            except Exception as e:
              print('VERIFY_ERR',url,repr(e))
              try:await p.close()
              except:pass
              return url,0,False,True

          async def generic(browser,idx,domain,url,mode):
            pg=await browser.new_page(); m=md_article(idx); h=html_article(idx); content=m if mode=='md' else h
            print('TRY',domain,'LINKS_IN_SOURCE',content.count('dermaart-sa.com'))
            try:
              await pg.goto(url,wait_until='domcontentloaded',timeout=45000); await pg.wait_for_timeout(1200)
              for sel in ['input[name*=title i]','input[placeholder*=title i]','input[type=text]']:
                loc=pg.locator(sel)
                if await loc.count():
                  try: await loc.first.fill(TITLES[idx]); break
                  except: pass
              filled=False
              tas=pg.locator('textarea:visible')
              if await tas.count():
                try: await tas.first.fill(content); filled=True
                except: pass
              if not filled:
                ces=pg.locator('[contenteditable="true"]:visible')
                if await ces.count():
                  try: await ces.first.fill(content); filled=True
                  except: pass
              if not filled:
                fis=pg.locator('input[type=file]')
                if await fis.count():
                  path=f'/tmp/derma-{idx}.html';open(path,'w',encoding='utf-8').write(h)
                  try:await fis.first.set_input_files(path);filled=True
                  except:pass
              if not filled:
                print(domain,'NO_INPUT');await pg.close();return None
              for pat in ['Get my shareable link','Get shareable link','Generate link','Generate Live Page','Deploy Page','Deploy','Publish','Share Note','Share','Host','Upload','Generate','Create','Save','Post']:
                btn=pg.get_by_role('button',name=re.compile(pat,re.I))
                if await btn.count():
                  try:await btn.first.click(timeout=5000);break
                  except:pass
              await pg.wait_for_timeout(3500)
              c=[]
              if pg.url.rstrip('/')!=url.rstrip('/'):c.append(pg.url)
              try:c += [x for x in await pg.locator('a[href]').evaluate_all('els=>els.map(e=>e.href)') if domain in x]
              except:pass
              try:
                vals=await pg.locator('input').evaluate_all('els=>els.map(e=>e.value).filter(Boolean)');c += [v for v in vals if isinstance(v,str) and v.startswith('http') and domain in v]
              except:pass
              seen=set()
              for cand in c:
                cand=cand.rstrip('.,);]')
                if cand in seen or domain not in cand:continue
                seen.add(cand)
                if any(x in cand for x in ['/api/','favicon','manifest','login','signup','register']):continue
                final,n,exact,noindex=await verify(browser,cand)
                if n>=5 and exact and not noindex:
                  print('VALID',domain,final);await pg.close();return (domain,final)
              print(domain,'NO_VALID',c[:10])
            except Exception as e:print(domain,'ERR',repr(e))
            try:await pg.close()
            except:pass
            return None

          async def draftmark(browser):
            m=md_article(7)
            try:
              r=requests.post('https://draftmark.app/api/v1/docs',json={'content':m,'visibility':'public'},timeout=40,headers={'User-Agent':'Mozilla/5.0 DermaArtSEO/1.0'})
              print('DRAFTMARK_POST',r.status_code,r.text[:500])
              d=r.json() if r.ok else {};u=d.get('url','')
              if u and not u.startswith('http'):u='https://'+u.lstrip('/')
              if u:
                final,n,exact,noindex=await verify(browser,u)
                if n>=5 and exact and not noindex:return ('draftmark.app',final)
            except Exception as e:print('DRAFTMARK_ERR',repr(e))
            return None

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              vals=await asyncio.gather(*[generic(browser,i,*t) for i,t in enumerate(TARGETS)],draftmark(browser),return_exceptions=True)
              out=[]
              for v in vals:
                if isinstance(v,tuple):out.append(v)
              print('DERMAART_RESULTS_BEGIN')
              for d,u in out:print(d+'\t'+u)
              print('DERMAART_RESULTS_END')
              print('DERMAART_VALID_COUNT='+str(len(out)))
              print('DERMAART_RESULTS_JSON='+json.dumps([{'source':d,'url':u} for d,u in out],ensure_ascii=False))
              await browser.close()
          asyncio.run(main())
          PY
