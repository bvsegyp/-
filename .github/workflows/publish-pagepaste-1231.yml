name: Publish PagePaste 1231
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run PagePaste publish 1231'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/publish_pagepaste_1231.py | tee publish.log
      - run: grep '^RESULT_URL=https://' publish.log || true
