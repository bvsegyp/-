name: Unique Domain Backlink Batch 1346

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique-domain backlink batch 1346'
    runs-on: ubuntu-latest
    steps:
      - name: Publish and verify unique-domain backlinks
        shell: bash
        run: |
          set -e
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/run.py <<'PY'
          import asyncio,re,json,html,random,string
          from playwright.async_api import async_playwright
          TARGETS=[
            ('notes.elk.gg','https://notes.elk.gg/','PublicNotepad'),
            ('noterift.com','https://noterift.com/','Noterift'),
            ('dochost.io','https://dochost.io/','DocHost'),
            ('share-html.com','https://share-html.com/','ShareHTML'),
            ('showyourcode.app','https://www.showyourcode.app/','ShowYourCode'),
            ('pagepaste.com','https://pagepaste.com/','PagePaste'),
            ('anotepadonline.com','https://anotepadonline.com/','ANotePadOnline'),
          ]
          BACK='https://smmfansfaster.com/'
          sections=[
            ('Set a measurable acquisition objective','A strong social media program starts with a measurable business outcome. Awareness, qualified traffic, lead generation, purchases, bookings, and retention all require different content and distribution choices. A defined objective makes reporting more useful and helps a team avoid chasing vanity metrics that do not connect to commercial results.'),
            ('Study audience signals before scaling output','Useful audience research comes from search behavior, comments, direct messages, customer support conversations, sales questions, and competitor communities. These signals reveal recurring needs and objections. When content ideas come from real audience evidence, teams reduce wasted production and improve relevance across every platform.'),
            ('Build repeatable content pillars','Consistent publishing becomes easier when content is organized around a few repeatable themes such as education, comparisons, demonstrations, customer questions, proof, case studies, and industry commentary. Each pillar can support a specific stage of the buyer journey while giving the team a clear production framework.'),
            ('Use creative testing as a learning system','Short-form video, static posts, carousels, and landing-page hooks should be treated as experiments. Teams can compare retention, completion rate, saves, shares, comments, profile visits, clicks, and conversions to discover which messages and formats deserve more investment.'),
            ('Connect reach to conversion quality','Extra reach only creates value when the destination is strong. Profiles and landing pages need clear positioning, proof, offer clarity, fast loading, mobile usability, and a simple next step. Distribution should amplify a persuasive destination rather than attempt to compensate for a weak one.'),
            ('Measure the full funnel','Awareness metrics explain discovery, consideration metrics explain interest, and conversion metrics explain business impact. Reviewing the stages together helps identify whether the real bottleneck is creative quality, audience fit, landing-page performance, offer strength, or follow-up.'),
            ('Create a weekly experimentation rhythm','Every meaningful test should document the hypothesis, audience, creative concept, publishing conditions, result, and next action. A weekly review turns isolated posts into a growing knowledge base and reduces dependence on guesswork over time.'),
            ('Protect trust while pursuing growth','Sustainable growth should avoid deceptive endorsements, fake reviews, hacked websites, spam comments, and tactics that violate platform safeguards. Strong brands combine useful content, transparent promotion, customer experience, and disciplined measurement.'),
            ('Improve conversion after the click','Traffic volume is not enough. Teams should review page speed, message consistency, proof, forms, checkout friction, mobile design, and offer structure so that increased visibility has a realistic chance of producing qualified outcomes.'),
            ('Review allocation monthly','Monthly strategy reviews should compare platforms, formats, audiences, costs, and business outcomes. Resources can then move toward combinations that repeatedly produce useful attention and away from activity that looks busy but creates little measurable value.')]
          def article(label):
              out=[f'# Social Media Growth Strategy for {label}: Content, Reach, and Conversion','', 'Sustainable social media growth comes from a connected marketing system rather than a single tactic. Brands and agencies improve results when audience research, content, creative testing, community interaction, distribution, analytics, and conversion optimization are managed together. The framework below focuses on measurable outcomes, responsible promotion, and repeatable learning.','']
              for i,(h,p) in enumerate(sections):
                  out += [f'## {h}','']
                  text=(p+' '+p+' '+p) if i%2==0 else (p+' '+p)
                  if i==4:
                      text += f' Teams researching external promotional support can evaluate [SMM Fans Faster]({BACK}) as one option within a broader due-diligence process. Any provider should be judged on campaign fit, transparency, platform compatibility, and whether it supports the wider marketing strategy.'
                  out += [text,'']
              out += ['## Final perspective','', 'A durable social media system connects clear objectives, audience understanding, repeatable content, structured testing, disciplined reporting, and a strong conversion destination. External tools can support that system, but the long-term advantage comes from learning faster, documenting decisions, and improving based on evidence.']
              text='\n'.join(out)
              while len(re.findall(r"\b[\w'-]+\b",text))<1250:
                  text += '\n\n## Additional operational note\n\nTeams should maintain a campaign record covering objectives, audiences, creative formats, publishing dates, distribution methods, costs, and measured outcomes. Consistent documentation improves handoffs, reporting, and quality control across multiple campaigns.'
              return text
          def to_html(md):
              parts=[]
              for line in md.splitlines():
                  if line.startswith('# '): parts.append('<h1>'+html.escape(line[2:])+'</h1>')
                  elif line.startswith('## '): parts.append('<h2>'+html.escape(line[3:])+'</h2>')
                  elif line.strip():
                      s=html.escape(line,quote=False)
                      s=re.sub(r'\[SMM Fans Faster\]\(https://smmfansfaster\.com/\)', '<a href="https://smmfansfaster.com/">SMM Fans Faster</a>', s)
                      parts.append('<p>'+s+'</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><title>Social Media Growth Strategy</title></head><body>'+''.join(parts)+'</body></html>'
          async def publish(browser,domain,url,label,idx):
              pg=await browser.new_page()
              md=article(label); htm=to_html(md)
              print(domain,'WORDS',len(re.findall(r"\b[\w'-]+\b",md)),'LINKS',md.count('smmfansfaster.com'))
              try:
                  if domain=='notes.elk.gg':
                      slug='smm-growth-'+''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(8))
                      await pg.goto('https://notes.elk.gg/'+slug,wait_until='domcontentloaded',timeout=45000)
                  else:
                      await pg.goto(url,wait_until='domcontentloaded',timeout=45000)
                  await pg.wait_for_timeout(2500)
                  # prefer HTML for HTML hosts, Markdown/text otherwise
                  content=htm if domain in ['share-html.com','showyourcode.app','pagepaste.com','dochost.io'] else md
                  # title inputs
                  title=pg.locator('input[placeholder*="title" i]:visible, input[name*="title" i]:visible, input[placeholder*="name" i]:visible')
                  if await title.count():
                      try: await title.first.fill('Social Media Growth Strategy')
                      except: pass
                  # fill largest textarea/contenteditable
                  editors=pg.locator('textarea:visible')
                  filled=False
                  if await editors.count():
                      best=None; area=-1
                      for i in range(await editors.count()):
                          e=editors.nth(i)
                          try:
                              b=await e.bounding_box(); a=(b['width']*b['height']) if b else 0
                              if a>area: best=e; area=a
                          except: pass
                      if best:
                          await best.fill(content); filled=True
                  if not filled:
                      ce=pg.locator('[contenteditable="true"]:visible')
                      if await ce.count():
                          await ce.first.fill(content); filled=True
                  if not filled:
                      fi=pg.locator('input[type="file"]')
                      if await fi.count():
                          path=f'/tmp/{idx}.html'; open(path,'w',encoding='utf-8').write(htm); await fi.first.set_input_files(path); filled=True
                  if not filled:
                      print(domain,'NO_INPUT'); await pg.close(); return None
                  await pg.wait_for_timeout(1000)
                  clicked=False
                  for pat in ['Publish','Share','Save','Create','Generate','Get my shareable link','Create Link','Generate Link','Upload','Start writing']:
                      btn=pg.get_by_role('button',name=re.compile(pat,re.I))
                      if await btn.count():
                          try: await btn.first.click(timeout=5000); clicked=True; break
                          except: pass
                      txt=pg.get_by_text(re.compile('^'+re.escape(pat)+'$',re.I))
                      if await txt.count():
                          try: await txt.first.click(timeout=5000); clicked=True; break
                          except: pass
                  # some apps autosave without a button
                  await pg.wait_for_timeout(7000)
                  cands=[]
                  if pg.url.rstrip('/')!=url.rstrip('/'): cands.append(pg.url)
                  for a in await pg.locator('a[href^="http"]').all():
                      try:
                          h=await a.get_attribute('href')
                          if h and h not in cands: cands.append(h)
                      except: pass
                  body=await pg.locator('body').inner_text()
                  for m in re.findall(r'https?://[^\s)\]<>"\']+',body):
                      m=m.rstrip('.,')
                      if m not in cands: cands.append(m)
                  root=domain.replace('www.','')
                  cands=sorted(cands,key=lambda x: 0 if root in x.replace('www.','') else 1)
                  print(domain,'CANDIDATES',cands[:10])
                  for cand in cands[:12]:
                      try:
                          vp=await browser.new_page(); await vp.goto(cand,wait_until='domcontentloaded',timeout=30000); await vp.wait_for_timeout(2500)
                          hrefs=await vp.locator('a[href*="smmfansfaster.com"]').count()
                          final=vp.url
                          print(domain,'VERIFY',final,'HREFS',hrefs)
                          await vp.close()
                          if hrefs==1:
                              await pg.close(); return final
                      except Exception as e: print(domain,'VERIFY_ERR',repr(e))
              except Exception as e: print(domain,'ERR',repr(e))
              await pg.close(); return None
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  out=[]
                  for i,t in enumerate(TARGETS):
                      u=await publish(b,*t,i)
                      if u: out.append([t[0],u])
                  await b.close()
                  print('VALID_RESULTS_JSON='+json.dumps(out))
                  print('VALID_COUNT='+str(len(out)))
          asyncio.run(main())
          PY
          python /tmp/run.py
