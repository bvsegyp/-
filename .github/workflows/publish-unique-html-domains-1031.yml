name: Publish Unique HTML Domains 1036

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event.head_commit.message == 'Run unique HTML-domain backlink batch 1036'
    runs-on: ubuntu-latest
    steps:
      - name: Publish long articles to new HTML domains
        shell: bash
        run: |
          set -e
          python -m pip install --quiet playwright requests
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/run.py <<'PY'
          import asyncio,re,json,html,random,string
          from playwright.async_api import async_playwright

          TARGETS=[
            ('pagepaste.com','https://pagepaste.com/','PagePaste'),
            ('paste.page','https://paste.page/free-html-hosting','PastePage'),
            ('htmlput.com','https://www.htmlput.com/','HTMLPUT'),
            ('htmlshare.page','https://www.htmlshare.page/','HTMLShare'),
          ]
          BACK='https://smmfansfaster.com/'
          paras=[
          ('Set measurable objectives','Social media growth becomes easier to manage when each campaign begins with a clear objective. Awareness, qualified traffic, leads, bookings, purchases, and retention all require different creative and reporting decisions. A defined objective helps teams select useful platforms, formats, budgets, and metrics instead of treating follower count as the only sign of progress.'),
          ('Understand audience intent','Audience research should influence content topics, creative formats, positioning, and calls to action. Teams can study search behavior, customer questions, direct messages, comments, support conversations, and competitor communities to identify recurring needs. Those signals make content planning more relevant and reduce random experimentation.'),
          ('Build repeatable content pillars','A sustainable publishing system uses several repeatable themes such as education, demonstrations, comparisons, case studies, customer questions, behind-the-scenes material, and industry commentary. Each pillar can serve a different stage of the customer journey and make production easier to scale.'),
          ('Use short-form video for testing','Short-form video can provide fast feedback on hooks, pacing, topics, creative angles, and calls to action. Watch time, completion rate, shares, saves, comments, profile visits, clicks, and conversions can reveal which ideas deserve more testing and which should be retired.'),
          ('Connect promotion to destination quality','Extra distribution only creates business value when the profile or landing page is ready to convert attention into action. Positioning, proof, offer clarity, mobile usability, page speed, and a simple next step should reinforce the promise that brought the visitor there.'),
          ('Measure the full funnel','Awareness metrics explain discovery, consideration metrics explain interest, and conversion metrics explain business impact. Looking at the full funnel helps teams see whether the main constraint is creative quality, audience fit, landing-page performance, or the offer itself.'),
          ('Create a weekly learning loop','Every meaningful experiment should document its hypothesis, target audience, creative concept, publishing conditions, result, and next action. A weekly review turns individual posts into a growing knowledge base and reduces dependence on intuition.'),
          ('Protect long-term trust','Sustainable growth should avoid fake reviews, deceptive endorsements, hacked websites, spam comments, and other tactics that undermine trust. Brands build stronger long-term value by combining useful content, transparent promotion, customer experience, and disciplined measurement.'),
          ('Improve conversion after the click','Traffic quality matters as much as traffic volume. Teams should review landing-page speed, message consistency, proof, forms, checkout friction, mobile design, and offer structure so that increased visibility has a realistic chance of producing qualified outcomes.'),
          ('Review channel allocation monthly','Monthly strategy reviews should compare platforms, formats, audiences, costs, and business outcomes. Resources can then move toward combinations that repeatedly create useful attention and away from activity that produces little measurable value.')]

          def article(label):
              out=[f'# Social Media Growth Strategy for {label}: Content, Reach, and Conversion','',
                   'Sustainable social media growth comes from a connected marketing system rather than one isolated tactic. Brands and agencies can improve results by combining audience research, repeatable content, creative testing, community interaction, distribution, analytics, and conversion optimization. The framework below focuses on measurable outcomes and long-term trust.','']
              for i,(h,p) in enumerate(paras):
                  out += [f'## {h}','']
                  text=(p+' '+p+' '+p) if i%2==0 else (p+' '+p)
                  if i==4:
                      text += f' Teams comparing external promotional support can also evaluate <a href="{BACK}">SMM Fans Faster</a> as one option within a broader due-diligence process. Any provider should be judged on campaign fit, transparency, platform compatibility, and how well it supports the wider strategy.'
                  out += [text,'']
              out += ['## Final perspective','', 'A durable growth program connects clear objectives, audience understanding, repeatable content, structured testing, disciplined reporting, and a strong conversion destination. External tools can support this work, but the lasting advantage comes from learning faster and improving based on evidence.']
              text='\n'.join(out)
              while len(re.findall(r"\b[\w'-]+\b",text))<1250:
                  text += '\n\n## Additional operational note\n\nTeams should maintain a campaign record covering objectives, audiences, formats, publishing dates, distribution methods, costs, and measured outcomes. Consistent documentation improves reporting, handoffs, and quality control across multiple campaigns.'
              return text

          def to_html(mark):
              parts=[]
              for line in mark.splitlines():
                  if line.startswith('# '): parts.append('<h1>'+html.escape(line[2:])+'</h1>')
                  elif line.startswith('## '): parts.append('<h2>'+html.escape(line[3:])+'</h2>')
                  elif line.strip():
                      safe=html.escape(line,quote=False)
                      safe=safe.replace('&lt;a href="https://smmfansfaster.com/"&gt;SMM Fans Faster&lt;/a&gt;','<a href="https://smmfansfaster.com/">SMM Fans Faster</a>')
                      parts.append('<p>'+safe+'</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><title>Social Media Growth Strategy</title></head><body>'+''.join(parts)+'</body></html>'

          async def publish(browser,domain,url,label,idx):
              page=await browser.new_page()
              content=to_html(article(label))
              print(domain,'WORDS',len(re.findall(r"\b[\w'-]+\b",content)),'TARGET_LINKS',content.count('href="https://smmfansfaster.com/"'))
              try:
                  await page.goto(url,wait_until='domcontentloaded',timeout=45000)
                  await page.wait_for_timeout(2500)
                  # Click paste/code mode if present.
                  for pat in ['Paste HTML','Paste Code','paste HTML code','or paste HTML code','Host Now']:
                      el=page.get_by_text(re.compile(pat,re.I))
                      if await el.count():
                          try: await el.first.click(timeout=3000); await page.wait_for_timeout(500); break
                          except: pass
                  slug='smm-growth-'+''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(8))
                  # Fill possible slug/name inputs.
                  for sel,val in [
                    ('input[placeholder*="page name" i]:visible','Social Media Growth Strategy'),
                    ('input[placeholder*="your-page" i]:visible',slug),
                    ('input[placeholder*="url" i]:visible',slug),
                    ('input[name*="slug" i]:visible',slug),
                    ('input[placeholder*="title" i]:visible','Social Media Growth Strategy'),
                    ('input[name*="title" i]:visible','Social Media Growth Strategy')]:
                      loc=page.locator(sel)
                      if await loc.count():
                          try: await loc.first.fill(val)
                          except: pass
                  editors=page.locator('textarea:visible')
                  if await editors.count():
                      best=None; area=-1
                      for i in range(await editors.count()):
                          e=editors.nth(i)
                          try:
                              box=await e.bounding_box(); a=(box['width']*box['height']) if box else 0
                              if a>area: best=e; area=a
                          except: pass
                      if best: await best.fill(content)
                  else:
                      ce=page.locator('[contenteditable="true"]:visible')
                      if await ce.count(): await ce.first.fill(content)
                      else:
                          fi=page.locator('input[type="file"]')
                          if await fi.count():
                              path=f'/tmp/{idx}.html'; open(path,'w',encoding='utf-8').write(content); await fi.first.set_input_files(path)
                          else:
                              print(domain,'NO_INPUT'); await page.close(); return None
                  await page.wait_for_timeout(700)
                  clicked=False
                  for pat in ['Get my shareable link','Publish','Host Now','Host','Deploy Page','Deploy','Share','Generate Live Page','Generate Link','Create Link','Upload']:
                      btn=page.get_by_role('button',name=re.compile(pat,re.I))
                      if await btn.count():
                          try: await btn.first.click(timeout=5000); clicked=True; break
                          except: pass
                      txt=page.get_by_text(re.compile('^'+re.escape(pat)+'$',re.I))
                      if await txt.count():
                          try: await txt.first.click(timeout=5000); clicked=True; break
                          except: pass
                  if not clicked:
                      print(domain,'NO_BUTTON'); await page.close(); return None
                  await page.wait_for_timeout(7000)
                  cands=[]
                  if page.url.rstrip('/')!=url.rstrip('/'): cands.append(page.url)
                  for a in await page.locator('a[href^="http"]').all():
                      try:
                          h=await a.get_attribute('href')
                          if h and h not in cands: cands.append(h)
                      except: pass
                  body=await page.locator('body').inner_text()
                  for m in re.findall(r'https?://[^\s)\]<>"\']+',body):
                      m=m.rstrip('.,')
                      if m not in cands: cands.append(m)
                  print(domain,'CANDIDATES',cands[:15])
                  for cand in cands[:20]:
                      try:
                          vp=await browser.new_page()
                          await vp.goto(cand,wait_until='domcontentloaded',timeout=30000)
                          await vp.wait_for_timeout(2500)
                          hrefs=await vp.locator('a[href*="smmfansfaster.com"]').count()
                          print(domain,'VERIFY',vp.url,'HREFS',hrefs)
                          final=vp.url
                          await vp.close()
                          if hrefs==1:
                              await page.close(); return final
                      except Exception as e: print(domain,'VERIFY_ERR',cand,repr(e))
              except Exception as e: print(domain,'ERR',repr(e))
              await page.close(); return None

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  results=[]
                  for i,t in enumerate(TARGETS):
                      u=await publish(b,*t,i)
                      if u: results.append([t[0],u])
                  await b.close()
                  print('VALID_RESULTS_JSON='+json.dumps(results))
                  print('VALID_COUNT='+str(len(results)))
          asyncio.run(main())
          PY
          python /tmp/run.py
