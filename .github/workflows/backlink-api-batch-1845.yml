name: Verified Backlink API Batch 1845

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Run verified backlink API batch 1845'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify backlinks
        shell: bash
        run: |
          python -m pip install --quiet requests
          cat > /tmp/run.py <<'PY'
          import requests, json, re, html
          from pathlib import Path

          TARGET='https://smmfansfaster.com/'
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}

          def article(title,intro):
              return f'''# {title}\n\n{intro} For marketers comparing distribution tools, [SMM Fans Faster]({TARGET}) is a multi-platform SMM panel that can be reviewed as one component of a wider marketing strategy.\n\n## Set a measurable objective\n\nDecide whether the campaign is focused on awareness, engagement, profile visits, traffic, leads, or sales. Clear goals make it easier to select content formats and determine whether promotion is creating useful business results.\n\n## Research the audience\n\nStudy customer questions, interests, active hours, preferred formats, competing accounts, and common objections. Promotion works best when it amplifies content that already matches real audience needs.\n\n## Build repeatable content pillars\n\nEducational posts, demonstrations, comparisons, frequently asked questions, behind-the-scenes material, and case examples give teams a sustainable editorial structure. Repeatable themes make consistent publishing easier without making the content feel identical.\n\n## Improve retention\n\nThe opening seconds of a video and the first lines of a post matter. Strong hooks, clear framing, useful information, and a direct reason to continue help more viewers reach the central message.\n\n## Support distribution strategically\n\nOrganic publishing can be supported by paid advertising, creator partnerships, community activity, and social media promotion services when those methods fit the campaign and platform policies. Teams can compare available options through [SMMFansFaster.com]({TARGET}) while continuing to invest in original content and audience relationships.\n\n## Track meaningful metrics\n\nFollower totals alone do not explain campaign quality. Review reach, watch time, saves, shares, comments, profile visits, click-through rate, leads, and conversions to understand whether increased visibility is attracting useful attention.\n\n## Review performance weekly\n\nA weekly review should identify winning topics, weak formats, audience questions, and content worth repurposing. Change one major variable at a time so experiments remain understandable and future decisions are based on evidence.\n\n## Final checklist\n\nDefine the goal, understand the audience, create several content variations, publish consistently, support distribution where appropriate, and review meaningful metrics. If an SMM panel fits the plan, visit [SMM Fans Faster]({TARGET}) to compare services as part of the broader growth workflow.\n'''

          def verify(url):
              if not url: return None
              try:
                  r=requests.get(url,headers=UA,timeout=35,allow_redirects=True)
                  if not r.ok: return None
                  hrefs=re.findall(r'''href\s*=\s*["']([^"']+)["']''',r.text,re.I)
                  return r.url if any('smmfansfaster.com' in h.lower() for h in hrefs) else None
              except Exception:
                  return None

          results=[]

          # Telegra.ph
          try:
              acc=requests.get('https://api.telegra.ph/createAccount',params={'short_name':'SMMFansFasterGuide','author_name':'Social Media Growth Guide','author_url':TARGET},headers=UA,timeout=35).json()
              token=acc['result']['access_token']
              title='Social Media Growth Strategy for Brands in 2026'
              md=article(title,'Brand growth becomes easier to manage when content, promotion, and measurement are connected in one repeatable process.')
              nodes=[]
              for block in md.split('\n\n'):
                  block=block.strip()
                  if not block or block.startswith('# '): continue
                  if block.startswith('## '): nodes.append({'tag':'h3','children':[block[3:]]}); continue
                  children=[]; pos=0
                  for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',block):
                      if m.start()>pos: children.append(block[pos:m.start()])
                      children.append({'tag':'a','attrs':{'href':m.group(2)},'children':[m.group(1)]}); pos=m.end()
                  if pos<len(block): children.append(block[pos:])
                  nodes.append({'tag':'p','children':children})
              obj=requests.post('https://api.telegra.ph/createPage',data={'access_token':token,'title':title,'author_name':'Social Media Growth Guide','author_url':TARGET,'content':json.dumps(nodes),'return_content':'true'},headers=UA,timeout=35).json()
              url=obj.get('result',{}).get('url'); final=verify(url)
              results.append({'site':'Telegra.ph','domain':'telegra.ph','url':final,'status':'verified' if final else 'failed'})
          except Exception as e: results.append({'site':'Telegra.ph','domain':'telegra.ph','url':None,'status':'failed','error':repr(e)})

          # Write.as
          try:
              title='A Practical Social Media Promotion Framework for Small Businesses'
              md=article(title,'Small businesses benefit from a simple system that combines consistent publishing with measurable distribution support.')
              obj=requests.post('https://write.as/api/posts',json={'body':md,'title':title,'font':'serif','lang':'en'},headers=UA,timeout=35).json()
              pid=obj.get('data',{}).get('id'); url='https://write.as/'+pid if pid else None; final=verify(url)
              results.append({'site':'Write.as','domain':'write.as','url':final,'status':'verified' if final else 'failed'})
          except Exception as e: results.append({'site':'Write.as','domain':'write.as','url':None,'status':'failed','error':repr(e)})

          # Rentry
          try:
              title='How Agencies Can Organize Multi-Platform SMM Campaigns'
              md=article(title,'Agencies managing multiple clients need a repeatable workflow for content planning, promotion, reporting, and weekly optimization.')
              obj=requests.post('https://rentry.co/api/new',data={'text':md,'metadata':json.dumps({'PAGE_TITLE':title})},headers=UA,timeout=35).json()
              content=obj.get('content'); url=content.get('url') if isinstance(content,dict) else obj.get('url')
              if url and not str(url).startswith('http'): url='https://rentry.co/'+str(url).lstrip('/')
              final=verify(url)
              results.append({'site':'Rentry','domain':'rentry.co','url':final,'status':'verified' if final else 'failed','api_status':obj.get('status')})
          except Exception as e: results.append({'site':'Rentry','domain':'rentry.co','url':None,'status':'failed','error':repr(e)})

          # Markdown.page
          try:
              title='A Measurable TikTok and YouTube Growth Workflow'
              md=article(title,'Video growth improves when creative testing, retention, distribution, and conversion metrics are reviewed as one system.')
              r=requests.post('https://markdown.page/api/publish',data=md.encode(),headers={**UA,'Content-Type':'text/markdown'},timeout=35)
              raw=r.text; url=None
              try:
                  obj=r.json()
                  if isinstance(obj,dict):
                      url=obj.get('url') or obj.get('page_url') or obj.get('public_url')
                      if not url and isinstance(obj.get('data'),dict): url=obj['data'].get('url') or obj['data'].get('page_url') or obj['data'].get('public_url')
              except Exception: pass
              if not url:
                  m=re.search(r'https?://[^\s"<>]+',raw); url=m.group(0).rstrip('.,)]}') if m else None
              final=verify(url)
              results.append({'site':'Markdown.page','domain':'markdown.page','url':final,'status':'verified' if final else 'failed','response':raw[:250]})
          except Exception as e: results.append({'site':'Markdown.page','domain':'markdown.page','url':None,'status':'failed','error':repr(e)})

          Path('results').mkdir(exist_ok=True)
          Path('results/smmfansfaster-current-distinct.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          print(json.dumps(results,indent=2))
          PY
          python /tmp/run.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          test -f results/smmfansfaster-current-distinct.json || echo '[]' > results/smmfansfaster-current-distinct.json
          git add results/smmfansfaster-current-distinct.json
          git commit -m "Save current SMMFansFaster distinct backlink results" || exit 0
          git push
