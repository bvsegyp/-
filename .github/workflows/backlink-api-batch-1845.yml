name: Verified Backlink API Batch 1845

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Run verified backlink API batch 1845'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish distinct-domain backlinks
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/run.py <<'PY'
          import requests, json, re, html, time
          from pathlib import Path
          from bs4 import BeautifulSoup

          TARGET='https://smmfansfaster.com/'
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}

          sections=[
            ('Set a measurable objective','Social media growth becomes easier to manage when the desired business outcome is explicit. A team may be trying to increase qualified profile visits, website traffic, leads, purchases, bookings, newsletter signups, or repeat engagement. The objective should have a practical baseline and review window so that progress can be compared with something real. This prevents teams from treating every visible metric as equally important and makes it easier to choose content formats, distribution methods, and reporting metrics that support the actual goal.'),
            ('Research audience intent','Audience research should come from real behavior such as customer questions, comments, support conversations, search queries, direct messages, competitor communities, and analytics. These signals reveal recurring problems, objections, motivations, and language. When marketers understand those patterns, they can create content that feels specific rather than generic and decide whether demonstrations, educational posts, comparisons, testimonials, short videos, carousels, or long-form explanations are most likely to help the audience move from discovery to consideration.'),
            ('Create repeatable content pillars','A sustainable content system usually relies on a small number of recurring themes. Useful pillars can include education, demonstrations, customer questions, process transparency, industry commentary, proof, comparisons, and conversion-focused offers. Repeating useful themes is not a weakness; it helps audiences understand what a brand represents while allowing the creative execution to change. A clear pillar system also reduces production friction because writers, designers, and video teams begin each week with a known set of directions instead of inventing every post from zero.'),
            ('Test creative variables systematically','Every post can become a learning opportunity when the team changes one major variable at a time. Hooks, headlines, editing pace, visual structure, content length, proof points, calls to action, and publishing times can be tested carefully. Results should be documented so strong patterns can be reused across future campaigns. Without a testing process, marketers can mistake one unusually strong or weak post for a permanent rule. A simple experiment log turns content activity into a growing knowledge base and helps teams improve decisions over time.'),
            ('Use distribution responsibly','Organic reach can be supported by paid advertising, creator partnerships, community activity, and social media promotion services when those approaches fit the campaign and platform rules. The key is to use distribution to amplify useful content rather than replace quality. Teams comparing external tools can review providers alongside their own analytics, paid media, and organic workflows. The right mix depends on audience fit, campaign objectives, account safety, risk tolerance, and the quality of the destination users reach after clicking.'),
            ('Measure attention and conversion separately','Reach, impressions, views, and follower growth explain discovery, but they do not prove business impact. Saves, shares, profile visits, outbound clicks, form starts, qualified leads, and purchases show progressively stronger intent. A useful reporting view should connect these stages rather than focus on one number. When reach rises but conversion does not, the real issue may be message clarity, audience fit, offer strength, landing-page quality, or the next step presented to the visitor rather than the amount of distribution itself.'),
            ('Improve the destination after the click','Extra visibility creates value only when the destination is persuasive. Profiles and landing pages should make the offer clear, show relevant proof, load quickly, work well on mobile, and give visitors an obvious next step. Friction such as confusing navigation, weak calls to action, slow loading, or mismatched messaging can waste otherwise good traffic. Conversion optimization should therefore be treated as part of the social media system rather than a separate project. Content, promotion, and the destination should communicate one consistent story.'),
            ('Create a weekly optimization rhythm','A weekly review gives the team a consistent place to compare content performance, audience response, traffic quality, conversion behavior, and upcoming priorities. The review should answer what worked, what failed, what changed, what should be tested next, and what should be stopped. This routine reduces emotional reactions to individual posts and encourages decisions based on repeated patterns. Over time, the documentation becomes an internal playbook that speeds up onboarding, reduces repeated mistakes, and makes multi-person marketing teams more consistent.')
          ]

          def markdown_article(title, intro):
              out=[f'# {title}', intro]
              for i,(h,p) in enumerate(sections):
                  out += [f'## {h}',p]
                  if i==3:
                      out.append(f'For teams comparing external distribution tools, [SMM Fans Faster]({TARGET}) can be reviewed as one option alongside organic content, paid media, creator partnerships, and internal analytics. Any service should be evaluated for fit, transparency, platform compliance, and account safety before it becomes part of a wider marketing plan.')
              out += ['## Final perspective',f'A durable social media program comes from clear objectives, useful content, structured testing, responsible distribution, meaningful measurement, and a destination that converts attention into action. Teams exploring an SMM panel can compare [SMMFansFaster.com]({TARGET}) with other channels while keeping original content and audience value at the center of the strategy.']
              return '\n\n'.join(out)

          def html_article(title, intro):
              md=markdown_article(title,intro)
              blocks=[]
              for block in md.split('\n\n'):
                  if block.startswith('# '): blocks.append('<h1>'+html.escape(block[2:])+'</h1>'); continue
                  if block.startswith('## '): blocks.append('<h2>'+html.escape(block[3:])+'</h2>'); continue
                  pos=0; parts=[]
                  for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',block):
                      parts.append(html.escape(block[pos:m.start()])); parts.append('<a href="'+html.escape(m.group(2),quote=True)+'">'+html.escape(m.group(1))+'</a>'); pos=m.end()
                  parts.append(html.escape(block[pos:])); blocks.append('<p>'+''.join(parts)+'</p>')
              return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+html.escape(title)+'</title><meta name="description" content="Practical social media growth strategy guide for brands, creators, and online businesses."></head><body><main>'+''.join(blocks)+'</main></body></html>'

          def verify(url):
              if not url: return None
              try:
                  r=requests.get(url,headers=UA,timeout=40,allow_redirects=True)
                  if not r.ok: return None
                  soup=BeautifulSoup(r.text,'html.parser')
                  for a in soup.find_all('a',href=True):
                      if 'smmfansfaster.com' in a.get('href','').lower():
                          return r.url
                  return None
              except Exception:
                  return None

          results=[]

          # Quicky.Page
          try:
              title='How Online Brands Can Build a More Reliable Social Media Growth System'
              md=markdown_article(title,'Reliable growth comes from connecting audience research, content planning, distribution, measurement, and conversion instead of treating them as separate activities.')
              r=requests.post('https://quicky.page/api/v1/publish',json={'title':title,'content':md},headers=UA,timeout=40)
              obj=r.json(); url=obj.get('url'); final=verify(url)
              results.append({'site':'Quicky.Page','domain':'quicky.page','url':final,'status':'verified' if final else 'failed','http_status':r.status_code})
          except Exception as e: results.append({'site':'Quicky.Page','domain':'quicky.page','url':None,'status':'failed','error':repr(e)})

          # Pastepile
          try:
              title='A Practical Social Media Promotion Framework for Small Businesses'
              md=markdown_article(title,'Small businesses can improve social media performance by using a repeatable framework that links content quality, audience intent, distribution, and conversion.')
              payload={'title':title,'content':md,'language':'markdown','expiry':'1mo','visibility':'public'}
              r=requests.post('https://www.pastepile.com/api/public/pastes',json=payload,headers=UA,timeout=40)
              obj=r.json(); url=obj.get('url'); final=verify(url)
              results.append({'site':'Pastepile','domain':'pastepile.com','url':final,'status':'verified' if final else 'failed','http_status':r.status_code})
          except Exception as e: results.append({'site':'Pastepile','domain':'pastepile.com','url':None,'status':'failed','error':repr(e)})

          # dpaste.org
          try:
              title='Social Media Growth Planning for Creators and Digital Brands'
              md=markdown_article(title,'Creators and digital brands benefit from a growth plan that separates content quality, distribution, engagement, and business outcomes while still connecting them in one system.')
              r=requests.post('https://dpaste.org/api/',data={'format':'json','content':md,'lexer':'markdown','expires':'never'},headers=UA,timeout=40)
              obj=r.json(); url=obj.get('url')
              candidates=[url, (url.rstrip('/')+'?preview=1') if url else None]
              final=None
              for c in candidates:
                  final=verify(c)
                  if final: break
              if not final and url:
                  try:
                      page=requests.get(url,headers=UA,timeout=30).text
                      soup=BeautifulSoup(page,'html.parser')
                      for a in soup.find_all('a',href=True):
                          if 'preview' in (a.get_text(' ',strip=True)+' '+a.get('href','')).lower():
                              cand=requests.compat.urljoin(url,a['href']); final=verify(cand)
                              if final: break
                  except Exception: pass
              results.append({'site':'dpaste','domain':'dpaste.org','url':final,'status':'verified' if final else 'failed','http_status':r.status_code,'base_url':url})
          except Exception as e: results.append({'site':'dpaste','domain':'dpaste.org','url':None,'status':'failed','error':repr(e)})

          # ShipPage
          try:
              title='Social Media Growth Strategy for Service Businesses in 2026'
              page=html_article(title,'Service businesses can build more predictable growth by connecting useful content, responsible promotion, conversion-focused landing pages, and disciplined reporting.')
              r=requests.post('https://shippage.ai/v1/publish',json={'html':page,'title':title,'public':True},headers=UA,timeout=40)
              obj=r.json(); url=obj.get('url'); final=verify(url)
              results.append({'site':'ShipPage','domain':'shippage.ai','url':final,'status':'verified' if final else 'failed','http_status':r.status_code})
          except Exception as e: results.append({'site':'ShipPage','domain':'shippage.ai','url':None,'status':'failed','error':repr(e)})

          # Botsite
          try:
              title='A Conversion Focused Social Media Growth Guide for Online Businesses'
              page=html_article(title,'Online businesses get better results when social media activity is connected to audience intent, useful content, responsible distribution, and a clear conversion path.')
              r=requests.post('https://botsite.dev/api/v1/sites',data=page.encode('utf-8'),headers={**UA,'Content-Type':'text/html'},timeout=40)
              obj=r.json(); url=obj.get('url'); final=verify(url)
              results.append({'site':'Botsite','domain':'botsite.dev','url':final,'status':'verified' if final else 'failed','http_status':r.status_code})
          except Exception as e: results.append({'site':'Botsite','domain':'botsite.dev','url':None,'status':'failed','error':repr(e)})

          # PageDrop retry
          try:
              title='How to Combine Content and Distribution for Sustainable Social Media Growth'
              page=html_article(title,'Sustainable social media growth depends on the relationship between content, distribution, measurement, and the experience users find after they click.')
              r=requests.post('https://pagedrop.dev/api/v1/sites',json={'html':page},headers=UA,timeout=40)
              obj=r.json(); url=(obj.get('data') or {}).get('url') or obj.get('url'); final=verify(url)
              results.append({'site':'PageDrop','domain':'pagedrop.dev','url':final,'status':'verified' if final else 'failed','http_status':r.status_code})
          except Exception as e: results.append({'site':'PageDrop','domain':'pagedrop.dev','url':None,'status':'failed','error':repr(e)})

          Path('results').mkdir(exist_ok=True)
          Path('results/smmfansfaster-distinct-batch-2.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          print(json.dumps(results,indent=2))
          PY
          python /tmp/run.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          test -f results/smmfansfaster-distinct-batch-2.json || echo '[]' > results/smmfansfaster-distinct-batch-2.json
          git add results/smmfansfaster-distinct-batch-2.json
          git commit -m "Save SMMFansFaster distinct backlink batch 2" || exit 0
          git push
