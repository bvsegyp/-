name: Publish NAREX anonymous backlinks batch 13
on:
  push:
    branches: [narex-publish-batch13-20260812]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish direct anonymous pages
        shell: bash
        run: |
          python3 -m pip -q install requests beautifulsoup4 playwright
          python3 -m playwright install chromium --with-deps >/dev/null 2>&1
          python3 - <<'PY'
          import requests,re,json,csv,html,hashlib,asyncio
          from urllib.parse import urlparse,urljoin
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          HOME='https://narexx.com/';PRODUCT='https://narexx.com/ar/easy-wash/p754364761'
          WHY='https://narexx.com/en/%D9%84%D9%85%D8%A7%D8%B0%D8%A7-%D8%AA%D8%B3%D8%AA%D8%AE%D8%AF%D9%85-%D8%A7%D9%84%D9%85%D9%86%D8%AA%D8%AC/page-833898435'
          WHOLESALE='https://narexx.com/en/%D8%B7%D9%84%D8%A8%D8%A7%D8%AA-%D8%A7%D9%84%D8%AC%D9%85%D9%84%D9%87/page-768158116'
          COMPLAINTS='https://narexx.com/%D9%84%D9%84%D8%B4%D9%83%D8%A7%D9%88%D9%89-%D9%88-%D8%A7%D9%84%D8%A7%D9%82%D8%AA%D8%B1%D8%A7%D8%AD%D8%A7%D8%AA/page-50408011'
          RETURNS='https://narexx.com/ar/%D8%B3%D9%8A%D8%A7%D8%B3%D8%A9-%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%A8%D8%AF%D8%A7%D9%84-%D9%88%D8%A7%D9%84%D8%A5%D8%B3%D8%AA%D8%B1%D8%AC%D8%A7%D8%B9/page-1592231750';EN='https://narexx.com/en/'
          refs=[('Easy Wash',PRODUCT),('NAREX السعودية',HOME),('لماذا تستخدم المنتج',WHY),('صفحة المنتج',PRODUCT),('متجر NAREX',HOME),('سياسة الاستبدال والاسترجاع',RETURNS),('الشكاوى والاقتراحات',COMPLAINTS),('طلبات الجملة',WHOLESALE),('النسخة الإنجليزية',EN),('مناديل Easy Wash',PRODUCT),('منتجات NAREX',HOME),('حل حماية الألوان',PRODUCT),('NAREX للعناية بالغسيل',HOME),('Easy Wash الرسمي',PRODUCT),('المتجر الرسمي',HOME),('خدمة العملاء',COMPLAINTS),('حلول الغسيل',HOME),('Easy Wash للملابس الملونة',PRODUCT),('NAREX',HOME),('منتج منع انتقال الألوان',PRODUCT)]
          paras=['انتقال الألوان بين الملابس من المشكلات التي قد تظهر عند غسل القطع الجديدة أو ذات الدرجات القوية. بعض الأقمشة تطلق صبغة داخل الماء وقد تستقر هذه الصبغة على قطع أخرى، لذلك تبدأ الحماية من قراءة تعليمات الغسيل وفهم طبيعة القماش واختيار درجة حرارة تناسب الحمولة.','الفرز الذكي لا يعني تشغيل دورة مستقلة لكل لون. يمكن جمع الملابس المتقاربة عندما تكون تعليمات العناية متوافقة، مع فصل الأبيض شديد الحساسية والقطع الجديدة المعروفة بنزيف اللون. هذا الأسلوب يقلل الدورات غير الضرورية مع الحفاظ على مستوى جيد من الحذر.','مناديل التقاط الألوان تعمل داخل ماء الغسيل للمساعدة على جذب جزء من الصبغات الزائدة. توضع الورقة مع الملابس داخل الحلة وتتحرك أثناء الدورة ثم يتم التخلص منها بعد الانتهاء. عدد المناديل المناسب يعتمد على كمية الملابس وقوة الألوان، لذلك يفضل الالتزام بالتعليمات الحالية للمنتج.','Easy Wash من NAREX يقدم هذا النوع من الحلول كجزء من روتين العناية بالملابس. الهدف هو إضافة وسيلة مساعدة تقلل احتمالية انتقال الصبغات، لا إلغاء قواعد الفرز أو تجاهل القطع الحساسة. ويمكن أن يكون ذلك مناسبًا للعائلات التي تشغل الغسالة بصورة متكررة.','درجة الحرارة وبرنامج الغسيل وحجم الحمولة تؤثر جميعها في النتيجة. الحرارة العالية ليست مطلوبة لكل الأقمشة، كما أن تحميل الغسالة فوق طاقتها يقلل حركة الماء والمنظف. من الأفضل استخدام برنامج يناسب نوع القماش وكمية منظف معتدلة وترك مساحة للحركة داخل الحلة.','الملابس الداكنة الجديدة قد تحتاج إلى غسل منفصل في المرة الأولى إذا كان هناك شك في ثبات الصبغة. بعد معرفة سلوك القماش يصبح إدخاله في حمولة أخرى أكثر أمانًا. كما يمكن قلب بعض القطع من الداخل إلى الخارج لتقليل الاحتكاك والمحافظة على مظهرها.','تنظيم روتين الغسيل يوفر الوقت عندما يتم تحديد القطع التي تحتاج إلى فصل فعلي بدل تقسيم كل حمولة بصورة مبالغ فيها. بعد معرفة الملابس الحساسة يمكن التعامل مع بقية القطع بمرونة أكبر، مع استخدام حل مساعد لالتقاط الصبغات عندما يكون ذلك مناسبًا.','العناية لا تتوقف عند انتهاء الدورة. يفضل إخراج الملابس وعدم تركها مبللة لفترة طويلة، ثم تجفيفها بالطريقة المناسبة لنوع القماش. كما يساعد التعامل السريع مع البقع وتجنب الغسيل القاسي المتكرر على الحفاظ على جودة الأنسجة والألوان.','قبل شراء أي منتج للعناية بالملابس عبر الإنترنت من المفيد مراجعة وصف المنتج وطريقة الاستخدام وسياسات المتجر وقنوات التواصل. للمستخدم في السعودية، معرفة سياسة الاستبدال والاسترجاع وخيارات التواصل والجملة تجعل قرار الشراء أكثر وضوحًا.','أفضل حماية للألوان تأتي من روتين متكامل يجمع بين الفرز المنطقي والبرنامج المناسب ودرجة الحرارة الملائمة والكمية الصحيحة من المنظف والعناية بالقطع الجديدة. ويمكن إضافة مناديل التقاط الصبغات كخطوة مساعدة عند الحاجة.']
          topics=['مناديل منع انتقال الألوان للغسيل اليومي','حل حماية الملابس الملونة في الغسالة','طريقة تقليل نزيف ألوان الملابس','ورق التقاط الصبغات للملابس الملونة','غسل الملابس المختلطة بأمان أكبر','Easy Wash لحماية ألوان الملابس']
          def md(title):
            out=['# '+title]
            for i,p in enumerate(paras):
              a,b=refs[2*i],refs[2*i+1];out += ['## إرشاد '+str(i+1),p+f' للمزيد راجع [{a[0]}]({a[1]}) و[{b[0]}]({b[1]}).']
            return '\n\n'.join(out)
          def hdoc(title):
            text=md(title);parts=[]
            for block in text.split('\n\n'):
              if block.startswith('# '):parts.append('<h1>'+html.escape(block[2:])+'</h1>')
              elif block.startswith('## '):parts.append('<h2>'+html.escape(block[3:])+'</h2>')
              else:
                e=html.escape(block);e=re.sub(r'\[([^\]]+)\]\((https?://[^)]+)\)',lambda m:f'<a href="{m.group(2)}">{html.escape(m.group(1))}</a>',e);parts.append('<p>'+e+'</p>')
            return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+html.escape(title)+'</title></head><body><main>'+''.join(parts)+'</main></body></html>'
          def host(u):
            try:return (urlparse(u).hostname or '').lower().lstrip('www.')
            except:return ''
          def verify(u,allowed):
            if not u or not u.startswith('http'):return False
            hh=host(u)
            if 'narexx.com' in hh or any(x in u.lower() for x in ['/edit/','admin','dashboard','token=']):return False
            if allowed and not any(hh==d or hh.endswith('.'+d) for d in allowed):return False
            try:
              r=requests.get(u,timeout=35,allow_redirects=True,headers={'User-Agent':'Mozilla/5.0'});return r.status_code<400 and r.text.lower().count('narexx.com')>=7
            except:return False
          async def browser_verify(u,allowed):
            if not u:return False
            try:
              async with async_playwright() as p:
                b=await p.chromium.launch(headless=True);pg=await b.new_page();await pg.goto(u,wait_until='domcontentloaded',timeout=40000);await pg.wait_for_timeout(2500);src=(await pg.content()).lower();await b.close();return src.count('narexx.com')>=7 and any(host(u)==d or host(u).endswith('.'+d) for d in allowed)
            except:return False
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 NAREXPublisher/13.0'});rows=[]
          def add(site,u,title,c,ok,note=''):
            rows.append([site,u if ok else '',title,c,'published' if ok else 'FAILED '+note]);print('RESULT|'+site+'|'+(u if ok else '')+'|links='+str(c)+'|'+rows[-1][-1],flush=True)
          # post-easy.org
          title=topics[0];body=md(title);c=body.count('https://narexx.com');u='';note=''
          try:
            sp=requests.Session();sp.headers.update({'User-Agent':'Mozilla/5.0'});r=sp.get('https://post-easy.org/post',timeout=30);soup=BeautifulSoup(r.text,'html.parser');form=None
            for f in soup.find_all('form'):
              names={x.get('name') for x in f.find_all(['input','textarea','select']) if x.get('name')}
              if 'content' in names and 'title' in names:form=f;break
            if not form:raise Exception('form not found')
            action=urljoin(r.url,form.get('action') or r.url);data={}
            for inp in form.find_all('input'):
              n=inp.get('name');typ=(inp.get('type') or '').lower()
              if n and typ not in ('submit','button','image','file'):data[n]=inp.get('value','')
            data['title']=title;data['content']=body
            if form.find(attrs={'name':'category'}):data['category']='Tech'
            if form.find(attrs={'name':'author'}):data['author']='NAREX Editorial'
            rr=sp.post(action,data=data,allow_redirects=True,timeout=40);u=rr.url;note=rr.text[:100]
          except Exception as e:note=repr(e)
          add('post-easy.org',u,title,c,verify(u,['post-easy.org']),note)
          # oneclicklive.app
          title=topics[1];h=hdoc(title);c=h.count('https://narexx.com');u='';note=''
          try:
            r=s.post('https://oneclicklive.app/api/deploy',json={'code':h,'title':title},timeout=45);d=r.json();cand=[]
            def walk(x):
              if isinstance(x,dict):
                for v in x.values():
                  if isinstance(v,str) and v.startswith('http'):cand.append(v)
                  else:walk(v)
              elif isinstance(x,list):
                for v in x:walk(v)
            walk(d);u=next((x for x in cand if verify(x,[host(x)]) and 'narexx.com' not in host(x)), '');note=r.text[:120]
          except Exception as e:note=repr(e)
          ok=verify(u,[host(u)]) if u else False;add('oneclicklive.app',u,title,c,ok,note)
          # pagepaste.com
          title=topics[2];h=hdoc(title);c=h.count('https://narexx.com');u='';note=''
          try:
            r=s.post('https://pagepaste.com/',data={'html':h,'title':title},timeout=40,allow_redirects=True);cand=[]
            if r.url.rstrip('/')!='https://pagepaste.com':cand.append(r.url)
            cand+=re.findall(r'https://[A-Za-z0-9.-]*pagepaste\.com/[A-Za-z0-9_./?=-]+',r.text,re.I);u=next((x for x in cand if verify(x,['pagepaste.com'])), '');note=r.text[:100]
          except Exception as e:note=repr(e)
          add('pagepaste.com',u,title,c,bool(u),note)
          # botsite.dev
          title=topics[3];h=hdoc(title);c=h.count('https://narexx.com');u='';note=''
          try:
            r=s.post('https://botsite.dev/api/v1/sites',data=h.encode(),headers={'Content-Type':'text/html'},timeout=40);d=r.json();u=d.get('url','');note=r.text[:120]
          except Exception as e:note=repr(e)
          add('botsite.dev',u,title,c,verify(u,['botsite.dev']),note)
          # stacktr.ee
          title=topics[4];h=hdoc(title);c=h.count('https://narexx.com');u='';note=''
          try:
            r=s.post('https://api.stacktr.ee/sites',files={'file':('index.html',h.encode(),'text/html')},timeout=45);d=r.json();u=d.get('url','');note=r.text[:120]
          except Exception as e:note=repr(e)
          add('stacktr.ee',u,title,c,verify(u,['stacktr.ee']),note)
          # here.now 3-step
          title=topics[5];h=hdoc(title);c=h.count('https://narexx.com');u='';note=''
          try:
            b=h.encode();sha=hashlib.sha256(b).hexdigest();r=s.post('https://here.now/api/v1/publish',headers={'X-HereNow-Client':'chatgpt/direct-api'},json={'files':[{'path':'index.html','size':len(b),'contentType':'text/html; charset=utf-8','hash':sha}],'viewer':{'title':title}},timeout=40);d=r.json();u=d.get('siteUrl','');up=d.get('upload') or {};ups=up.get('uploads') or []
            if ups:requests.put(ups[0]['url'],data=b,headers=ups[0].get('headers') or {'Content-Type':'text/html; charset=utf-8'},timeout=45)
            if up.get('finalizeUrl') and up.get('versionId'):s.post(up['finalizeUrl'],json={'versionId':up['versionId']},timeout=40)
            note=r.text[:120]
          except Exception as e:note=repr(e)
          add('here.now',u,title,c,verify(u,['here.now']),note)
          with open('narex-batch13.csv','w',newline='',encoding='utf-8-sig') as f:csv.writer(f).writerows([['platform','published_url','title','narex_links','status']]+rows)
          print('SUCCESS_COUNT='+str(len([r for r in rows if r[1]])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: narex-batch13-results
          path: narex-batch13.csv
