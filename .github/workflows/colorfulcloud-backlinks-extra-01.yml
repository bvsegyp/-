name: Colorful Cloud Extra Backlinks 01
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run Colorful Cloud extra backlink batch 01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Publish extra backlinks
        run: python scripts/colorfulcloud_backlinks_extra_01.py
