name: BVS Unique Domains 02 Browser Verify

on:
  push:
    branches: [main]

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify BVS unique domains 02 browser'
    runs-on: ubuntu-latest
    steps:
      - name: Browser verify JavaScript publishers
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          cat > /tmp/verify.py <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          targets=[
            ('showyourcode.app','https://www.showyourcode.app/share/gs5mvmmswjv82t'),
            ('pastehtml.dev','https://5s3oz47hcnajw0hczzt1wg051we8v8x2.pastehtml.dev/'),
            ('botsite.dev','https://cfncqxtw15mz.botsite.dev/'),
            ('mdshare.live','https://mdshare.live/d/O_saWFbfmT?key=viw_hq3V0UXtYXgcdZ9aBxT6EHYGxAwdpt3t'),
            ('pastebox.ai','https://pastebox.ai/S3oGoHCo'),
            ('pastepile.com','https://www.pastepile.com/p/2OWTX8a'),
          ]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              out=[]
              for d,u in targets:
                pg=await b.new_page()
                try:
                  await pg.goto(u,wait_until='domcontentloaded',timeout=45000)
                  await pg.wait_for_timeout(3500)
                  hrefs=await pg.locator('a[href*="bvsegypt.com"]').count()
                  frames=0
                  for fr in pg.frames:
                    try: frames += await fr.locator('a[href*="bvsegypt.com"]').count()
                    except: pass
                  body=(await pg.locator('body').inner_text()) if await pg.locator('body').count() else ''
                  print('VERIFY',d,'URL',pg.url,'HREFS',hrefs,'FRAME_HREFS',frames,'TEXT',body.lower().count('bvsegypt.com'))
                  if max(hrefs,frames)>=1: out.append([d,pg.url])
                except Exception as e: print('ERR',d,repr(e))
                await pg.close()
              await b.close()
              print('BVS2_BROWSER_RESULTS='+json.dumps(out))
              print('BVS2_BROWSER_COUNT='+str(len(out)))
          asyncio.run(main())
          PY
          python /tmp/verify.py
