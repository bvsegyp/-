          titles=['Social Media Growth Planning for Subscription Brands','A Practical SMM Measurement Framework for Ecommerce','TikTok Audience Growth Planning for Creative Teams','Instagram Growth Operations for Service Providers','Social Media Conversion Planning for Online Businesses','A Content Testing Framework for Digital Agencies','Multi-Platform Audience Development for SaaS Brands','Social Media Reporting for Performance Campaigns','Sustainable Social Growth Systems for Small Companies']
