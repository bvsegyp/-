name: Inspect Swolvy OneClick htmlhost 1245
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: github.event.head_commit.message == 'Run three-host inspection 1245'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_swolvy_oneclick_htmlhost_1245.py
