name: Publish PlsReadMe and MdShare 1018
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish plsreadme mdshare 1018'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare two long one-link articles and inspect official clients
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import re
          base='''# {title}

Social media growth works best when it is managed as a complete marketing system rather than as a collection of disconnected tactics. A strong plan connects audience research, content quality, publishing consistency, creative testing, analytics, community interaction, and conversion optimization to a clear business objective.

## Define the objective first

Before choosing a platform or promotional tactic, decide what outcome matters. Awareness, website traffic, leads, bookings, purchases, and retention each require different metrics and different content decisions. Clear objectives prevent teams from treating follower count as the only measure of progress.

## Understand the audience

Audience research should identify recurring questions, buying concerns, preferred content formats, platform habits, and the language people use to describe their problems. These insights can come from search behavior, customer support conversations, sales objections, comments, and direct messages. Content becomes more relevant when it reflects real audience needs rather than internal assumptions.

## Build repeatable content pillars

A reliable publishing system usually includes several repeatable pillars such as education, demonstrations, comparisons, customer questions, case studies, behind-the-scenes material, and industry commentary. Each pillar should have a purpose in the customer journey. Educational posts can attract attention, demonstrations can explain an offer, and case studies can help reduce uncertainty.

## Use promotion as support

Organic publishing, paid distribution, partnerships, and carefully evaluated third-party tools can support the same strategy. Teams researching external options can review {link} as one reference while comparing alternatives. The service should fit a defined campaign objective and should never replace useful content, account quality, or real audience engagement.

## Measure useful signals

For awareness, track reach, impressions, video views, completion rate, and shares. For consideration, monitor saves, profile visits, direct messages, and website clicks. For conversion, track leads, purchases, bookings, revenue, and cost per acquisition where reliable attribution is available. A smaller set of meaningful metrics is usually more actionable than a dashboard filled with every available number.

## Test creative ideas systematically

Creative testing works best when one major variable changes at a time. Teams can compare opening hooks, visual formats, captions, offers, audiences, and calls to action. Documenting the hypothesis and the outcome makes each campaign a learning opportunity. Over time, this creates a useful library of patterns instead of a collection of isolated results.

## Improve the destination

Visibility creates limited value if the destination is unclear. Social profiles should explain who the brand serves, what it offers, and what action a visitor should take next. Landing pages should load quickly, continue the promise made in the social post, provide relevant proof, and remove unnecessary friction from forms or checkout.

## Protect long-term account quality

Short-term growth should not come at the expense of trust. Teams should avoid deceptive claims, fake endorsements, hacked properties, spam comments, and attempts to bypass platform safeguards. Third-party services should be evaluated like any other supplier: understand what is being purchased, how it supports the objective, and what risks need to be controlled.

## Create a reporting rhythm

Weekly reviews work well for creative decisions, while monthly reviews are better for budget allocation and broader strategy. Every report should end with actions: continue a winning format, stop a weak test, improve a landing page, refine the offer, or adjust the audience. Reporting becomes valuable when it changes what the team does next.

## Document operations

Clear ownership helps teams maintain quality as campaign volume grows. Decide who owns research, writing, design, publishing, moderation, reporting, and optimization. A pre-publish checklist can catch broken links, incorrect tracking parameters, formatting mistakes, and mismatched calls to action before they become repeated problems.

## Separate learning from scaling

Promising ideas can be tested with limited resources before the team increases budget. Strong organic performance can provide evidence for paid distribution, and small paid tests can validate audience or offer assumptions. Staging experiments this way reduces waste and improves confidence in scaling decisions.

## Stay flexible

Social platforms change frequently. Formats, recommendation systems, advertising features, and audience habits evolve. Durable strategies keep their principles stable while allowing tactics to change. Useful content, clear positioning, ethical promotion, measurable goals, and disciplined learning remain valuable even as specific platform features change.

## Additional operational considerations

Teams can improve consistency by maintaining an editorial calendar that connects each piece of content to a campaign objective. The calendar should not merely list publishing dates; it should also record the intended audience, format, call to action, and measurement plan. This makes it easier to review performance later and understand why a post was created in the first place.

Another useful habit is to maintain a creative archive. Save successful hooks, opening frames, headline structures, visual approaches, and calls to action. The archive becomes a source of tested building blocks. Instead of copying old posts, marketers can recombine proven elements into new concepts while preserving variety.

Campaign quality also depends on feedback loops. Comments, support requests, sales calls, reviews, and on-site behavior all reveal what audiences understand and where friction remains. These signals should feed back into the content plan. If prospects repeatedly ask the same question, that question deserves content. If visitors abandon a landing page at the same point, the issue may require a page change rather than more traffic.

Teams should also distinguish platform metrics from business metrics. A high-performing social post can be valuable even when it does not generate immediate sales if its objective is awareness. Conversely, a post with modest reach may be highly valuable if it generates qualified leads. Evaluation should always return to the original objective rather than relying on one universal benchmark.

Finally, growth should be treated as a portfolio of experiments. Some ideas will fail, and that is acceptable when the test is controlled and the learning is captured. The goal is not to make every post a winner. The goal is to improve the percentage of decisions that are informed by evidence over time.

## Final perspective

Sustainable social media growth is a process of repeated learning. Clear objectives, audience understanding, useful content, structured testing, careful promotion, conversion optimization, and consistent reporting reinforce one another. The strongest strategy does not chase isolated numbers; it builds visibility that contributes to trust, qualified traffic, and measurable business outcomes.
'''
          specs=[
            ('/tmp/pls.md','Sharing a Social Media Growth Plan Clearly Across Teams','[SMM API](https://smmfansfaster.com/api)'),
            ('/tmp/mdshare.md','A Practical Social Media Content and Measurement Playbook','[TikTok growth guide](https://smmfansfaster.com/blog/tiktok-followers)')
          ]
          for fn,t,l in specs:
            a=base.format(title=t,link=l)
            wc=len(re.findall(r"\b[\w’'-]+\b",a)); lc=a.count('https://smmfansfaster.com')
            print(fn,'WORDS',wc,'LINKS',lc)
            if wc<1200 or lc!=1: raise SystemExit('ARTICLE_INVALID')
            open(fn,'w',encoding='utf-8').write(a)
          PY

          echo '=== PLSREADME INSPECT ==='
          curl -fsSL https://plsreadme.com/ -o /tmp/pls-home.html
          grep -o -E '.{0,500}/api/create-link.{0,1000}' /tmp/pls-home.html | head -5 || true
          curl -fsSL https://plsreadme.com/track.js -o /tmp/pls-track.js || true
          grep -o -E '.{0,500}/api/create-link.{0,1000}' /tmp/pls-track.js | head -5 || true

          echo '=== MDSHARE CLI ==='
          npm view mdshare version description bin --json || true
          npm install -g mdshare
          mdshare --help || true
          echo '=== MDSHARE PUBLISH ==='
          set +e
          OUT=$(mdshare /tmp/mdshare.md 2>&1)
          RC=$?
          set -e
          echo "MDSHARE_RC=$RC"
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            URL=$(echo "$OUT" | grep -oE 'https?://[^ ]+' | tail -1 | sed 's/[[:punct:]]$//')
            echo "MDSHARE_URL=$URL"
            if [ -n "$URL" ]; then
              python - "$URL" <<'PY'
          import requests,re,sys
          u=sys.argv[1]
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=35)
          hrefs=re.findall(r'href=["\'](https://smmfansfaster\.com[^"\']*)["\']',r.text,re.I)
          print('MDSHARE_VERIFY_STATUS=',r.status_code)
          print('MDSHARE_HREF_COUNT=',len(hrefs))
          print('MDSHARE_FINAL_URL=',r.url)
          if r.status_code>=400 or len(hrefs)!=1: raise SystemExit(3)
          PY
            fi
          fi
