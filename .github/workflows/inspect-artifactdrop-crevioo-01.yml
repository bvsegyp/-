name: Inspect ArtifactDrop and Crevioo
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: github.event.head_commit.message == 'Run fresh ArtifactDrop Crevioo inspection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/inspect_artifactdrop_crevioo_01.sh
