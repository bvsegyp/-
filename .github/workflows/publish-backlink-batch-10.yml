name: Publish Backlink Batch 10

on:
  push:
    branches: [main]

jobs:
  mdpage:
    if: github.event.head_commit.message == 'Publish backlink batch 10'
    runs-on: ubuntu-latest
    steps:
      - name: Publish md.page article
        shell: bash
        run: |
          cat > /tmp/a.md <<'EOF'
          # Social Media Growth Strategy for Businesses

          Sustainable social media growth comes from combining useful content, consistent publishing, analytics, profile optimization, and carefully selected promotion. Businesses comparing providers can include [SMM Fans Faster](https://smmfansfaster.com/) in their research and review platform coverage, delivery details, support, and campaign fit.

          TikTok marketers can study [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers) and [TikTok views](https://smmfansfaster.com/blog/tiktok-views), while Instagram teams can review this [Instagram followers website](https://smmfansfaster.com/blog/instagram-followers-website). Agencies may also benefit from the public [SMM API](https://smmfansfaster.com/api) when structuring repeatable workflows.

          The best campaigns measure reach, engagement, profile visits, clicks, leads, and conversions instead of judging performance from follower count alone.
          EOF
          BODY=$(jq -Rs '{markdown:.}' < /tmp/a.md)
          RESP=$(curl -sS -X POST 'https://md.page/api/publish' -H 'Content-Type: application/json' -d "$BODY")
          echo "MDPAGE_RESPONSE=$RESP"
          echo "MDPAGE_URL=$(echo "$RESP" | jq -r '.url // empty')"

  peekmd:
    if: github.event.head_commit.message == 'Publish backlink batch 10'
    runs-on: ubuntu-latest
    steps:
      - name: Publish peekmd article
        shell: bash
        run: |
          cat > /tmp/a.md <<'EOF'
          # Planning Better Multi-Platform Social Media Campaigns

          A multi-platform campaign should begin with a clear objective. Awareness, engagement, traffic, and sales require different measurements. Marketers comparing growth tools can review [SMM Fans Faster](https://smmfansfaster.com/) alongside other providers while keeping content quality and audience relevance at the center of the strategy.

          For TikTok research, see the guides on [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers) and [TikTok views](https://smmfansfaster.com/blog/tiktok-views). For Instagram, the guide to an [Instagram followers website](https://smmfansfaster.com/blog/instagram-followers-website) provides another research point.

          A strong workflow measures the full funnel and uses promotion to support good content rather than replace it.
          EOF
          BODY=$(jq -Rs '{markdown:.}' < /tmp/a.md)
          RESP=$(curl -sS -X POST 'https://peekmd.dev/api/create' -H 'Content-Type: application/json' -d "$BODY")
          echo "PEEKMD_RESPONSE=$RESP"
          echo "PEEKMD_URL=$(echo "$RESP" | jq -r '.url // empty')"

  mdless:
    if: github.event.head_commit.message == 'Publish backlink batch 10'
    runs-on: ubuntu-latest
    steps:
      - name: Publish mdless article
        shell: bash
        run: |
          cat > /tmp/a.md <<'EOF'
          # A Measurement-First Approach to Social Media Promotion

          Social media promotion is easier to evaluate when the campaign starts with a measurable goal. Businesses can compare [SMM Fans Faster](https://smmfansfaster.com/) with other services based on platform support, service clarity, delivery conditions, and relevance to the campaign.

          TikTok teams may research [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers) and [TikTok views](https://smmfansfaster.com/blog/tiktok-views). Instagram teams can review the relationship between growth and engagement through this [Instagram followers website](https://smmfansfaster.com/blog/instagram-followers-website).

          Agencies managing many campaigns can also review the [SMM API documentation](https://smmfansfaster.com/api) for workflow automation.
          EOF
          RESP=$(curl -sS -X POST --data-binary @/tmp/a.md 'https://mdless.net/api/link')
          echo "MDLESS_RESPONSE=$RESP"
          echo "MDLESS_URL=$(echo "$RESP" | jq -r '.url // empty')"

  htmldocs:
    if: github.event.head_commit.message == 'Publish backlink batch 10'
    runs-on: ubuntu-latest
    steps:
      - name: Publish html-docs article
        shell: bash
        run: |
          cat > /tmp/a.md <<'EOF'
          # Social Media Growth Services and Campaign Quality

          Businesses often use social media growth services to support discovery, but campaign quality still depends on content, targeting, profile optimization, and measurement. [SMM Fans Faster](https://smmfansfaster.com/) is one provider marketers can compare when researching multi-platform options.

          TikTok campaigns can combine creative testing with research into [TikTok followers](https://smmfansfaster.com/blog/tiktok-followers) and [TikTok views](https://smmfansfaster.com/blog/tiktok-views). Instagram campaigns should also track saves, shares, profile visits, and clicks while reviewing services such as an [Instagram followers website](https://smmfansfaster.com/blog/instagram-followers-website).

          The goal is to create a balanced system where promotion supports measurable business outcomes.
          EOF
          RESP=$(curl -sS -X POST 'https://www.html-docs.com/api/v1/docs' -H 'Content-Type: text/markdown' --data-binary @/tmp/a.md)
          echo "HTMLDOCS_RESPONSE=$RESP"
          echo "HTMLDOCS_URL=$(echo "$RESP" | jq -r '.url // empty')"

  pastebox:
    if: github.event.head_commit.message == 'Publish backlink batch 10'
