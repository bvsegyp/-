name: Backlink Round 257-265
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish backlink round 257-265'
    runs-on: ubuntu-latest
    steps:
      - name: Publish nine verified articles
        shell: bash
        run: |
          cat > /tmp/publish.py <<'PY'
          import requests,re,secrets,html,json
          H='https://smmfansfaster.com/'
          L=[('social media services',H),('automation API','https://smmfansfaster.com/api'),('TikTok audience growth','https://smmfansfaster.com/blog/tiktok-followers'),('TikTok audience metrics','https://smmfansfaster.com/blog/numberoftiktokfollowers'),('TikTok visibility guide','https://smmfansfaster.com/blog/tiktok-views'),('Instagram audience growth','https://smmfansfaster.com/ar/blog/instagram-followers-website'),('Instagram distribution insights','https://smmfansfaster.com/ar/blog/doesincreasingyourfollowersaffecttheinstagramalgorithmfindoutnow'),('service FAQ','https://smmfansfaster.com/ar/faq')]
          titles=['How B2B Teams Can Build a Measurable Social Media Growth Process','A Social Media Acquisition Framework for New Ecommerce Products','How Creators Can Test TikTok Growth Ideas Without Chasing Vanity Metrics','Instagram Growth Planning for Professional Service Brands','How Small Agencies Can Organize Social Media Delivery and Reporting','A Practical Social Media KPI Framework for Performance Marketers','How Online Stores Can Improve Social Discovery and Landing Page Conversion','A Cross-Platform Social Media Testing System for Growing Teams','How to Combine Organic Content and Paid Social Promotion More Effectively']
          angles=['B2B teams that need qualified visibility and leads','ecommerce teams launching new products','creators balancing audience growth with meaningful engagement','professional service brands building trust and inquiries','small agencies managing repeatable client work','performance marketers connecting social activity with business outcomes','online stores improving discovery and product-page conversion','growing teams learning across TikTok and Instagram','marketers coordinating organic content with promotional support']
          def article(i):
            a=angles[i]; t=titles[i]
            return f'''# {t}\n\nSocial media performs better when growth is treated as a measurable system rather than a collection of isolated tactics. This guide is designed for {a}. The useful question is not simply whether reach or follower count increased. The useful question is whether attention moved into relevant profile activity, qualified website visits, inquiries, purchases, or another business outcome that matters.\n\nA clear objective makes the rest of the campaign easier to manage. Teams should decide what they want a person to do after seeing content, then build creative, distribution, landing pages, and reporting around that next action. This creates a consistent path from discovery to conversion and makes campaign decisions easier to defend.\n\n## Research the audience before increasing output\n\nFor {a}, customer intent provides a stronger foundation than posting frequency alone. Search queries, comments, reviews, sales conversations, support requests, and competitor content can reveal recurring needs. Those needs can become content pillars such as education, demonstrations, comparisons, proof, objection handling, and direct-response communication.\n\nOnce the pillars are defined, marketers can experiment without losing direction. Hooks, examples, visual formats, calls to action, and storytelling styles can change while the underlying strategic purpose remains stable. This makes it easier to identify patterns instead of judging every post as an isolated event.\n\n## Evaluate distribution options in context\n\nOrganic publishing is one part of the system, and some teams also research external promotional support. A provider such as [social media services]({L[0][1]}) can be evaluated by reviewing supported platforms, service descriptions, delivery expectations, support, and the role the service is expected to play. External promotion should complement useful content and a clear destination rather than substitute for them.\n\nTeams that manage recurring activity may also review an [automation API]({L[1][1]}). API-based workflows can reduce repetitive administration, but strong operations still require campaign naming, destination validation, ownership, error handling, and reporting. Faster execution is valuable only when the process remains controlled and measurable.\n\n## Use TikTok as a creative laboratory\n\nTikTok gives marketers a fast feedback loop for testing hooks, pacing, video length, demonstrations, storytelling, captions, and calls to action. Strong experiments begin with a hypothesis. Changing only a small number of variables at a time makes differences in watch time, retention, shares, profile visits, and downstream behavior easier to interpret.\n\nTeams researching audience development can review this resource on [TikTok audience growth]({L[2][1]}), place follower count in context with [TikTok audience metrics]({L[3][1]}), and compare visibility signals using the [TikTok visibility guide]({L[4][1]}). These references are most useful when considered alongside first-party analytics rather than used as replacements for platform data.\n\n## Design Instagram as a journey across formats\n\nInstagram gives brands several different surfaces. Reels can support discovery, Stories can maintain interaction, carousels can educate, Highlights can organize recurring information, and pinned posts can explain the offer. A stronger account gives each format a defined responsibility rather than expecting every post to achieve every objective.\n\nBusinesses comparing audience-growth options can review this guide to [Instagram audience growth]({L[5][1]}). Teams can also consider these [Instagram distribution insights]({L[6][1]}) alongside their own analytics. Reach is influenced by multiple signals, which is why account-level testing and useful content remain important.\n\n## Make the destination ready for more traffic\n\nIncreasing social reach is only useful when the next step can convert attention. A profile should make the value proposition clear. A landing page should load quickly, match the promise made in the social content, provide relevant trust signals, and make the desired action obvious. Product pages should reduce uncertainty, and service pages should make contact simple.\n\nFor {a}, measuring the full path helps reveal the actual bottleneck. If social traffic increases while leads or purchases remain flat, the problem may be audience relevance, offer clarity, page speed, trust, message continuity, or the call to action rather than the social channel itself.\n\n## Organize metrics by funnel stage\n\nAwareness metrics can include reach, impressions, views, watch time, and shares. Consideration metrics can include saves, profile visits, direct messages, product views, and website clicks. Conversion metrics can include leads, bookings, purchases, subscriptions, or revenue where attribution is reliable. Separating these stages prevents teams from using one metric to represent the entire customer journey.\n\nWeekly reviews can focus on creative learning, while monthly reviews can focus on broader decisions such as platform priorities, budget allocation, landing-page improvements, and campaign objectives. Every report should end with a decision about what to repeat, change, stop, or test next.\n\n## Build a reusable learning archive\n\nA campaign decision log can record the objective, target audience, creative concept, platform, destination URL, promotion method, date, expected outcome, actual result, and next step. Over time, this becomes a practical knowledge base that improves consistency and reduces repeated mistakes.\n\nCross-platform learning is especially useful. A TikTok hook that improves retention may inspire an Instagram Reel. A landing-page problem discovered through Instagram traffic may also affect users arriving from other channels. Recording these connections turns individual tests into broader marketing knowledge.\n\n## Review operational details before scaling\n\nAny external service should be understood before it becomes part of a repeatable workflow. The [service FAQ]({L[7][1]}) can provide operational context before an order is placed. Similar diligence should be applied to any supplier: define why the service is being used, understand what it does, decide how results will be measured, and maintain appropriate quality controls.\n\nFor {a}, sustainable growth comes from connecting audience research, useful content, disciplined testing, careful distribution, analytics, and conversion optimization. The strongest system is not the one with the most tactics; it is the one that turns attention into relevant engagement, qualified traffic, and measurable outcomes consistently.'''
          arts=[article(i) for i in range(9)]
          for i,a in enumerate(arts):
            wc=len(re.findall(r"\b[\w'-]+\b",a)); lc=a.count('smmfansfaster.com'); print('ARTICLE',i+1,'WORDS',wc,'LINKS',lc)
            if not (800<=wc<=1200 and lc>=8): raise SystemExit('VALIDATION_FAIL')
          def mdhtml(md):
            out=[]
            for p in re.split(r'\n\s*\n',md):
              p=p.strip()
              if not p: continue
              if p.startswith('# '): out.append('<h1>'+html.escape(p[2:])+'</h1>'); continue
              if p.startswith('## '): out.append('<h2>'+html.escape(p[3:])+'</h2>'); continue
              e=html.escape(p); e=re.sub(r'\[([^\]]+)\]\((https?://[^)]+)\)',lambda m:f'<a href="{html.escape(m.group(2),quote=True)}">{html.escape(m.group(1))}</a>',e); out.append('<p>'+e.replace('\n',' ')+'</p>')
            return '<html><body>'+''.join(out)+'</body></html>'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 SMMEditorial/1.0'}); final=[]
          def verify(u):
            try:
              r=s.get(u,timeout=30,allow_redirects=True); c=r.text.count('smmfansfaster.com'); print('VERIFY',r.status_code,c,u); return r.status_code<400 and c>=6
            except Exception as e: print('VERIFY_ERR',u,repr(e)); return False
          try:
            acc=s.post('https://api.telegra.ph/createAccount',data={'short_name':'SMMRound257','author_name':'Marketing Editorial'},timeout=30).json(); tok=(acc.get('result') or {}).get('access_token',''); nodes=[]
            for p in re.split(r'\n\s*\n',arts[0]):
              p=p.strip();
              if not p: continue
              tag='p'; txt=p
              if p.startswith('# '): tag='h3'; txt=p[2:]
              elif p.startswith('## '): tag='h4'; txt=p[3:]
              children=[]; pos=0
              for m in re.finditer(r'\[([^\]]+)\]\((https?://[^)]+)\)',txt):
                if m.start()>pos: children.append(txt[pos:m.start()])
                children.append({'tag':'a','attrs':{'href':m.group(2)},'children':[m.group(1)]}); pos=m.end()
              if pos<len(txt): children.append(txt[pos:])
              nodes.append({'tag':tag,'children':children})
            d=s.post('https://api.telegra.ph/createPage',data={'access_token':tok,'title':titles[0],'content':json.dumps(nodes)},timeout=30).json(); path=(d.get('result') or {}).get('path',''); u='https://telegra.ph/'+path if path else ''
            if u and verify(u): final.append(u)
          except Exception as e: print('TEL_ERR',repr(e))
          try:
            r=s.post('https://shippage.ai/v1/publish',json={'html':mdhtml(arts[1]),'title':titles[1],'public':True},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('SHIP_ERR',repr(e))
          try:
            rs=requests.Session(); rs.headers.update({'User-Agent':'Mozilla/5.0'}); rs.get('https://rentry.co/',timeout=30); csrf=rs.cookies.get('csrftoken',''); r=rs.post('https://rentry.co/api/new',data={'csrfmiddlewaretoken':csrf,'text':arts[2],'edit_code':secrets.token_urlsafe(12),'url':''},headers={'Referer':'https://rentry.co/'},timeout=30); u=r.json().get('url','');
            if u and verify(u): final.append(u)
          except Exception as e: print('RENTRY_ERR',repr(e))
          for name,fn in [
            ('MDPAGE',lambda:s.post('https://md.page/api/publish',json={'markdown':arts[3]},timeout=30).json().get('url','')),
            ('MARKDOWN',lambda:(lambda r:r.text.strip().splitlines()[0] if r.ok else '')(s.post('https://markdown.page/api/publish',data=arts[4].encode(),headers={'Accept':'text/plain'},timeout=30))),
            ('YEET',lambda:s.post('https://yeet.md/api/share',json={'content':arts[5]},timeout=30).json().get('url','')),
            ('MDVIEW',lambda:(lambda d:d.get('shareUrl') or d.get('viewerUrl',''))(s.post('https://mdview.io/api/public/publish',json={'title':titles[6],'content':arts[6],'expiresInDays':30},timeout=30).json())),
            ('OUTPUT',lambda:s.post('https://output.pub/api/publish',json={'content':arts[7],'format':'markdown'},timeout=30).json().get('url','')),
            ('QUICKY',lambda:(lambda d:d.get('url') or d.get('pageUrl',''))(s.post('https://quicky.page/api/v1/publish',json={'title':titles[8],'content':arts[8]},timeout=30).json()))]:
            try:
              u=fn();
              if u and verify(u): final.append(u)
            except Exception as e: print(name+'_ERR',repr(e))
          if len(final)<6: raise SystemExit('TOO_FEW_VERIFIED')
          print('URLS_BEGIN'); [print(u) for u in final]; print('URLS_END')
          PY
          python /tmp/publish.py
