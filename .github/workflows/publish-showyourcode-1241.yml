name: Publish ShowYourCode 1241
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.event.head_commit.message == 'Run ShowYourCode publish 1241'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/publish_showyourcode_1241.py | tee publish.log
      - run: grep '^RESULT_URL=https://' publish.log || true
