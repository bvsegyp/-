name: Inspect ShareMyHTML Upload Call
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: github.event.head_commit.message == 'Run ShareMyHTML upload inspection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_sharemyhtml_upload_call.py
